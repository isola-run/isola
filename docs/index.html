<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isola</title>
    <meta
      name="description"
      content="Isola brings Kubernetes-native sandboxing together with gVisor, snapshotting, open source foundations, and developer-first SDKs."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="./isola-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="ambient-grid" aria-hidden="true"></div>

    <div class="page">
      <header class="site-header">
        <a class="brand" href="./" aria-label="Isola home">Isola</a>

        <a class="repo-link" href="https://github.com/isola-ai/isola">GitHub</a>
      </header>

      <main class="hero">
        <section class="hero-copy">
          <h1>Secure Sandboxing for Kubernetes</h1>
          <p class="hero-meta">gVisor · Snapshotting · Open source · Developer-first SDKs</p>
        </section>

        <section class="hero-visual" aria-label="Isola logo">
          <img class="hero-logo" src="./isola-logo.svg" alt="Isola logo" />
        </section>
      </main>
    </div>
  </body>
</html>
