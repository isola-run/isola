# Node.js Sandbox Template
# JavaScript/TypeScript development environment
apiVersion: sandbox.isola.run/v1alpha1
kind: SandboxTemplate
metadata:
  name: nodejs-sandbox
  namespace: isola-sandboxes
  labels:
    language: nodejs
    variant: standard
spec:
  timeoutSeconds: 300
  podTemplate:
    metadata:
      labels:
        sandbox-type: nodejs
    spec:
      containers:
        - name: sandbox
          image: node:20-slim
          command: ["sleep", "infinity"]
          workingDir: /app
          env:
            - name: NODE_ENV
              value: "development"
            - name: NPM_CONFIG_UPDATE_NOTIFIER
              value: "false"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          emptyDir:
            sizeLimit: 1Gi
