# Lefthook configuration
# Install tools: ./hack/setup.sh --tools-only
# Install hooks: lefthook install

pre-commit:
  parallel: true
  commands:
    lint:
      skip:
        - run: "! command -v golangci-lint >/dev/null 2>&1"
      glob: "**/*.{go,mod,sum}"
      run: make lint

    tidy:
      glob: "{go.mod,go.sum}"
      run: go mod tidy && git add go.mod go.sum
