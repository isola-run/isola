# Lefthook configuration
# Install: go install github.com/evilmartians/lefthook/v2@v2.0.13 && lefthook install

pre-commit:
  parallel: true
  commands:
    lint:
      skip:
        - run: "! command -v golangci-lint >/dev/null 2>&1"
      glob: "**/*.{go,mod,sum}"
      run: make lint

    tidy:
      glob: "{go.mod,go.sum}"
      run: go mod tidy && git add go.mod go.sum
