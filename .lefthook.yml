# Lefthook configuration
# Install: go install github.com/evilmartians/lefthook/v2@v2.0.13 && lefthook install

pre-commit:
  parallel: true
  commands:
    # isola-operator - lint on .go, .mod, .sum changes
    lint-operator:
      glob: "services/isola-operator/**/*.{go,mod,sum}"
      run: make -C services/isola-operator lint

    # isola-gw
    lint-gw:
      glob: "services/isola-gw/**/*.{go,mod,sum}"
      run: make -C services/isola-gw lint

    # isola-agent
    lint-agent:
      glob: "services/isola-agent/**/*.{go,mod,sum}"
      run: make -C services/isola-agent lint

    # go mod tidy - only when go.mod/go.sum change
    tidy-operator:
      glob: "services/isola-operator/{go.mod,go.sum}"
      run: cd services/isola-operator && go mod tidy && git add go.mod go.sum

    tidy-gw:
      glob: "services/isola-gw/{go.mod,go.sum}"
      run: cd services/isola-gw && go mod tidy && git add go.mod go.sum

    tidy-agent:
      glob: "services/isola-agent/{go.mod,go.sum}"
      run: cd services/isola-agent && go mod tidy && git add go.mod go.sum
