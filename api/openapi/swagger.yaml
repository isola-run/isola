definitions:
  internal_api-gateway_handlers.ErrorResponse:
    properties:
      message:
        example: service not ready
        type: string
    type: object
  internal_api-gateway_handlers.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
info:
  contact: {}
  description: API for managing sandboxes
  title: Isola Sandbox API
  version: "1.0"
paths:
  /health:
    get:
      description: Returns the health status of the API
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api-gateway_handlers.HealthResponse'
      summary: Health check
      tags:
      - health
  /ready:
    get:
      description: Returns the readiness status of the API
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api-gateway_handlers.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_api-gateway_handlers.ErrorResponse'
      summary: Readiness check
      tags:
      - health
swagger: "2.0"
