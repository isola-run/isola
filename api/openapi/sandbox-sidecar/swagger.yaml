definitions:
  internal_sandbox-sidecar_handlers.ErrorResponse:
    properties:
      message:
        example: path is required
        type: string
    type: object
  internal_sandbox-sidecar_handlers.FilesystemWriteResponse:
    properties:
      absolute_path:
        example: /workspace/file.txt
        type: string
      bytes_written:
        example: 1024
        type: integer
      container:
        example: main
        type: string
    type: object
  internal_sandbox-sidecar_handlers.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
info:
  contact: {}
  description: Internal API for sandbox filesystem operations
  title: Isola Sandbox Sidecar API
  version: "1.0"
paths:
  /filesystem:
    post:
      consumes:
      - application/octet-stream
      description: Writes a file to the specified path in the sandbox container
      parameters:
      - description: Destination path (absolute or relative to container cwd)
        in: query
        name: path
        required: true
        type: string
      - description: Container name (defaults to main container)
        in: query
        name: container
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_sandbox-sidecar_handlers.FilesystemWriteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_sandbox-sidecar_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_sandbox-sidecar_handlers.ErrorResponse'
      summary: Write a file to the sandbox filesystem
      tags:
      - filesystem
  /health:
    get:
      description: Returns the health status of the sidecar
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_sandbox-sidecar_handlers.HealthResponse'
      summary: Health check
      tags:
      - health
swagger: "2.0"
