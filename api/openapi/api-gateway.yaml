components:
  schemas:
    CommandStatusResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CommandStatusResponse.json
          format: uri
          readOnly: true
          type: string
        exitCode:
          description: Process exit code, null if still running
          format: int64
          type:
            - integer
            - "null"
      required:
        - exitCode
      type: object
    Container:
      additionalProperties: false
      properties:
        command:
          description: Override the container entrypoint. Defaults to sleep infinity if omitted.
          items:
            type: string
          type:
            - array
            - "null"
        env:
          additionalProperties:
            type: string
          description: Environment variables
          type: object
        image:
          description: Container image
          minLength: 1
          type: string
        name:
          description: Container name. Defaults to sandbox{i} if omitted.
          maxLength: 63
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
        resources:
          $ref: "#/components/schemas/ResourceRequirements"
          description: Resource requests and limits
        rootfsSnapshotName:
          description: Rootfs snapshot to restore into this container. Files on separately-mounted filesystems (e.g. /tmp) are excluded.
          maxLength: 59
          minLength: 1
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          type: string
      required:
        - image
      type: object
    ContainerInfo:
      additionalProperties: false
      properties:
        command:
          description: Container entrypoint override
          items:
            type: string
          type:
            - array
            - "null"
        image:
          description: Container image
          type: string
        name:
          description: Container name
          type: string
        resources:
          $ref: "#/components/schemas/ResourceRequirements"
          description: Resource requests and limits
        rootfsSnapshotName:
          description: Rootfs snapshot restored into this container.
          type: string
      required:
        - name
        - image
      type: object
    CreateCommandRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateCommandRequest.json
          format: uri
          readOnly: true
          type: string
        args:
          description: "Argument vector: Args[0] is the executable path, Args[1:] are its arguments"
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
        cwd:
          description: Working directory inside the sandbox. Defaults to the target container process's working directory if omitted.
          type: string
        env:
          additionalProperties:
            type: string
          description: Environment variable overrides
          type: object
        timeoutSeconds:
          description: Max execution time in seconds
          format: int64
          minimum: 1
          type: integer
      required:
        - args
      type: object
    CreateCommandResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateCommandResponse.json
          format: uri
          readOnly: true
          type: string
        id:
          description: Unique command identifier
          type: string
      required:
        - id
      type: object
    CreateRootfsSnapshotRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateRootfsSnapshotRequest.json
          format: uri
          readOnly: true
          type: string
        containerName:
          description: Container to snapshot. Defaults to the first container if omitted.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
        sandboxId:
          description: ID of the sandbox to snapshot (as returned by POST /v1/sandboxes)
          maxLength: 47
          minLength: 1
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          type: string
        snapshotName:
          description: Snapshot storage key and restore reference. Defaults to the sandbox ID if omitted. To restore, pass this value as rootfsSnapshotName on a container when creating a sandbox.
          maxLength: 59
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          type: string
        timeoutSeconds:
          description: Max duration in seconds for the snapshot job. Defaults to 300 if omitted.
          format: int64
          minimum: 1
          type: integer
        ttlSecondsAfterFinished:
          description: Seconds to retain the resource after completion. 0 means immediate deletion. Defaults to 300 if omitted.
          format: int32
          minimum: 0
          type: integer
      required:
        - sandboxId
      type: object
    CreateSandboxRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateSandboxRequest.json
          format: uri
          readOnly: true
          type: string
        network:
          $ref: "#/components/schemas/Network"
          description: Network isolation config
        podTemplate:
          $ref: "#/components/schemas/PodTemplate"
          description: Pod template
        startupTimeoutSeconds:
          description: Max seconds for the sandbox to become Ready. Defaults to 90 if omitted.
          format: int64
          minimum: 1
          type: integer
        terminationPolicy:
          $ref: "#/components/schemas/TerminationPolicy"
          description: What to do when the sandbox terminates
        timeoutSeconds:
          description: How long the sandbox runs before the termination process begins, in seconds. Omit for no timeout
          format: int64
          minimum: 1
          type: integer
      required:
        - podTemplate
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    HealthResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthResponse.json
          format: uri
          readOnly: true
          type: string
        status:
          description: Health status
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    Info:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Info.json
          format: uri
          readOnly: true
          type: string
        buildDate:
          examples:
            - "2026-04-17T12:00:00Z"
          type: string
        gitCommit:
          examples:
            - abc1234
          type: string
        gitTreeState:
          examples:
            - clean
          type: string
        gitVersion:
          examples:
            - 0.1.0
          type: string
        goVersion:
          examples:
            - go1.26.2
          type: string
        platform:
          examples:
            - linux/amd64
          type: string
      required:
        - gitVersion
        - goVersion
        - platform
      type: object
    ListSandboxesResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListSandboxesResponse.json
          format: uri
          readOnly: true
          type: string
        sandboxes:
          description: List of sandboxes
          items:
            $ref: "#/components/schemas/SandboxSummary"
          type:
            - array
            - "null"
      required:
        - sandboxes
      type: object
    Network:
      additionalProperties: false
      properties:
        allowClusterDNS:
          description: Allow cluster DNS queries
          type: boolean
        allowIPv6Egress:
          description: "Enable IPv6 in egress configuration (default: IPv4 only)"
          type: boolean
        allowInternetEgress:
          description: Allow public internet egress
          type: boolean
        allowedEgressCIDRs:
          description: Allowed egress CIDRs
          items:
            maxLength: 43
            type: string
          maxItems: 16
          type:
            - array
            - "null"
        nameservers:
          description: Custom DNS servers (max 3)
          items:
            type: string
          maxItems: 3
          type:
            - array
            - "null"
      type: object
    PodTemplate:
      additionalProperties: false
      properties:
        containers:
          description: Sandbox containers
          items:
            $ref: "#/components/schemas/Container"
          minItems: 1
          type:
            - array
            - "null"
      required:
        - containers
      type: object
    PodTemplateInfo:
      additionalProperties: false
      properties:
        containers:
          description: Sandbox containers
          items:
            $ref: "#/components/schemas/ContainerInfo"
          type:
            - array
            - "null"
      required:
        - containers
      type: object
    ResourceList:
      additionalProperties: false
      properties:
        cpu:
          description: CPU (K8s quantity)
          examples:
            - 125m
          type: string
        ephemeralStorage:
          description: Ephemeral storage (K8s quantity)
          examples:
            - 1Gi
          type: string
        memory:
          description: Memory (K8s quantity)
          examples:
            - 512Mi
          type: string
      type: object
    ResourceRequirements:
      additionalProperties: false
      properties:
        limits:
          $ref: "#/components/schemas/ResourceList"
          description: Resource limits
        requests:
          $ref: "#/components/schemas/ResourceList"
          description: Resource requests
      type: object
    RootfsSnapshotResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RootfsSnapshotResponse.json
          format: uri
          readOnly: true
          type: string
        containerName:
          description: Container being snapshotted
          type: string
        creationTimestamp:
          description: Creation UTC timestamp in RFC3339 format
          type: string
        id:
          description: RootfsSnapshot identifier
          type: string
        sandboxId:
          description: ID of the sandbox being snapshotted
          type: string
        snapshotName:
          description: Snapshot storage key and restore reference
          type: string
        status:
          description: Snapshot status
          enum:
            - Pending
            - Running
            - Succeeded
            - Failed
          type: string
        timeoutSeconds:
          description: Max duration in seconds for the snapshot job
          format: int64
          type: integer
        ttlSecondsAfterFinished:
          description: Seconds to retain the resource after completion
          format: int32
          type: integer
      required:
        - id
        - sandboxId
        - snapshotName
        - status
        - creationTimestamp
      type: object
    SandboxResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SandboxResponse.json
          format: uri
          readOnly: true
          type: string
        creationTimestamp:
          description: Creation UTC timestamp in RFC3339 format
          type: string
        id:
          description: Sandbox identifier
          type: string
        network:
          $ref: "#/components/schemas/Network"
          description: Network isolation config
        podTemplate:
          $ref: "#/components/schemas/PodTemplateInfo"
          description: Pod template
        startupTimeoutSeconds:
          description: Max seconds for the sandbox to become Ready
          format: int64
          type: integer
        status:
          description: Sandbox status
          enum:
            - Pending
            - Running
            - Terminating
            - Succeeded
            - Failed
          type: string
        terminationPolicy:
          $ref: "#/components/schemas/TerminationPolicy"
          description: Termination policy
        timeoutSeconds:
          description: How long the sandbox runs before the termination process begins, in seconds
          format: int64
          type: integer
      required:
        - id
        - podTemplate
        - status
        - creationTimestamp
      type: object
    SandboxSummary:
      additionalProperties: false
      properties:
        creationTimestamp:
          description: Creation timestamp
          type: string
        id:
          description: Sandbox identifier
          type: string
        status:
          description: Sandbox status
          enum:
            - Pending
            - Running
            - Terminating
            - Succeeded
            - Failed
          type: string
      required:
        - id
        - status
        - creationTimestamp
      type: object
    SnapshotRootfsTermination:
      additionalProperties: false
      properties:
        snapshotName:
          description: Snapshot storage key. Defaults to sandbox ID if omitted.
          maxLength: 59
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          type: string
        timeoutSeconds:
          description: Snapshot operation deadline in seconds. Defaults to 300.
          format: int64
          minimum: 1
          type: integer
      type: object
    TerminationPolicy:
      additionalProperties: false
      properties:
        snapshotRootfs:
          $ref: "#/components/schemas/SnapshotRootfsTermination"
          description: Config for SnapshotRootfs type
        type:
          default: Delete
          description: Termination type
          enum:
            - Delete
            - SnapshotRootfs
          type: string
      type: object
info:
  description: API for managing sandboxes
  title: Isola Sandbox API
  version: 0.5.0
openapi: 3.1.0
paths:
  /health:
    get:
      description: Returns the health status of the API
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Health check
      tags:
        - health
  /healthz:
    get:
      description: Returns the health status of the API
      operationId: getHealthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Health check (alias)
      tags:
        - health
  /ready:
    get:
      description: Returns the readiness status of the API
      operationId: getReady
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Readiness check
      tags:
        - health
  /readyz:
    get:
      description: Returns the readiness status of the API
      operationId: getReadyz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Readiness check (alias)
      tags:
        - health
  /v1/rootfs-snapshots:
    post:
      description: Creates a snapshot of a sandbox's root filesystem overlay upper layer.
      operationId: createRootfsSnapshot
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRootfsSnapshotRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootfsSnapshotResponse"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Create a rootfs snapshot
      tags:
        - rootfs-snapshots
  /v1/rootfs-snapshots/{id}:
    get:
      description: "Get the status and details of a rootfs snapshot. Eventually consistent: a recently created snapshot may briefly return 404. The Kubernetes resource is auto-deleted after ttlSecondsAfterFinished. The snapshot data in storage is not affected."
      operationId: getRootfsSnapshot
      parameters:
        - description: RootfsSnapshot identifier
          in: path
          name: id
          required: true
          schema:
            description: RootfsSnapshot identifier
            maxLength: 59
            minLength: 1
            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootfsSnapshotResponse"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get rootfs snapshot details
      tags:
        - rootfs-snapshots
  /v1/sandboxes:
    get:
      description: "Eventually consistent: a sandbox returned by POST may not appear immediately in the list. Clients should retry or poll if a recently-created sandbox is missing."
      operationId: listSandboxes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSandboxesResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List sandboxes
      tags:
        - sandboxes
    post:
      operationId: createSandbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandboxRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxResponse"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Create a sandbox
      tags:
        - sandboxes
  /v1/sandboxes/{id}:
    delete:
      operationId: deleteSandbox
      parameters:
        - description: Sandbox identifier
          in: path
          name: id
          required: true
          schema:
            description: Sandbox identifier
            maxLength: 47
            minLength: 1
            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a sandbox
      tags:
        - sandboxes
    get:
      description: "Eventually consistent: a sandbox returned by POST may briefly return 404 on GET. Clients should retry if polling a recently-created sandbox."
      operationId: getSandbox
      parameters:
        - description: Sandbox identifier
          in: path
          name: id
          required: true
          schema:
            description: Sandbox identifier
            maxLength: 47
            minLength: 1
            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxResponse"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get sandbox details
      tags:
        - sandboxes
  /v1/sandboxes/{sandboxId}/commands:
    post:
      description: Starts a new command in the sandbox container and returns a command ID for tracking. Commands always run as root (UID 0, GID 0).
      operationId: createSandboxCommand
      parameters:
        - description: Sandbox identifier
          in: path
          name: sandboxId
          required: true
          schema:
            description: Sandbox identifier
            maxLength: 47
            minLength: 1
            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
            type: string
        - description: Container name. Defaults to the only container if there is one, otherwise it's required.
          explode: false
          in: query
          name: container
          schema:
            description: Container name. Defaults to the only container if there is one, otherwise it's required.
            maxLength: 63
            minLength: 1
            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommandRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCommandResponse"
          description: Accepted
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      summary: Start a command in a sandbox
      tags:
        - sandboxes
        - commands
  /v1/sandboxes/{sandboxId}/commands/{id}:
    delete:
      description: Kills the command process. Idempotent for already-exited commands.
      operationId: deleteSandboxCommand
      parameters:
        - description: Sandbox identifier
          in: path
          name: sandboxId
          required: true
          schema:
            description: Sandbox identifier
            maxLength: 47
            minLength: 1
