components:
  schemas:
    CommandStatusResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CommandStatusResponse.json
          format: uri
          readOnly: true
          type: string
        exitCode:
          description: Process exit code, null if still running
          format: int64
          type:
            - integer
            - "null"
      required:
        - exitCode
      type: object
    ContainerInfo:
      additionalProperties: false
      properties:
        command:
          description: Container entrypoint override
          items:
            type: string
          type:
            - array
            - "null"
        image:
          description: Container image
          type: string
        resources:
          $ref: "#/components/schemas/ResourcesSpec"
          description: Resource requests and limits
      required:
        - image
      type: object
    ContainerSpec:
      additionalProperties: false
      properties:
        command:
          description: Override the container entrypoint. Defaults to sleep infinity if omitted.
          items:
            type: string
          type:
            - array
            - "null"
        env:
          additionalProperties:
            type: string
          description: Environment variables
          type: object
        image:
          description: Container image
          minLength: 1
          type: string
        resources:
          $ref: "#/components/schemas/ResourcesSpec"
          description: Resource requests and limits
      required:
        - image
      type: object
    CreateCommandRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateCommandRequest.json
          format: uri
          readOnly: true
          type: string
        args:
          description: Arguments to the executable
          items:
            type: string
          type:
            - array
            - "null"
        cmd:
          description: Executable path
          minLength: 1
          type: string
        cwd:
          description: Working directory inside the sandbox. Defaults to the target container process's working directory if omitted.
          type: string
        env:
          additionalProperties:
            type: string
          description: Environment variable overrides
          type: object
        timeout:
          description: Max execution time in seconds
          format: int64
          minimum: 1
          type: integer
      required:
        - cmd
      type: object
    CreateCommandResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateCommandResponse.json
          format: uri
          readOnly: true
          type: string
        commandId:
          description: Unique command identifier
          type: string
      required:
        - commandId
      type: object
    CreateSandboxRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateSandboxRequest.json
          format: uri
          readOnly: true
          type: string
        activeDeadlineSeconds:
          description: Max lifetime in seconds. Omit for no timeout
          format: int64
          minimum: 1
          type: integer
        network:
          $ref: "#/components/schemas/NetworkSpec"
          description: Network isolation config
        podTemplate:
          $ref: "#/components/schemas/PodTemplate"
          description: Pod template
        shutdownPolicy:
          $ref: "#/components/schemas/ShutdownPolicySpec"
          description: Shutdown policy config
      required:
        - podTemplate
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    FilesystemWriteResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/FilesystemWriteResponse.json
          format: uri
          readOnly: true
          type: string
        absolutePath:
          description: Absolute path where file was written
          examples:
            - /workspace/file.txt
          type: string
        bytesWritten:
          description: Number of bytes written
          examples:
            - 1024
          format: int64
          type: integer
      required:
        - absolutePath
        - bytesWritten
      type: object
    HealthResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthResponse.json
          format: uri
          readOnly: true
          type: string
        status:
          description: Health status
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    ListSandboxesResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListSandboxesResponse.json
          format: uri
          readOnly: true
          type: string
        sandboxes:
          description: List of sandboxes
          items:
            $ref: "#/components/schemas/SandboxSummary"
          type:
            - array
            - "null"
      required:
        - sandboxes
      type: object
    NetworkSpec:
      additionalProperties: false
      properties:
        allowClusterDNS:
          description: Allow cluster DNS queries
          type: boolean
        allowInternetEgress:
          description: Allow public internet egress
          type: boolean
        allowedEgressCIDRs:
          description: Allowed egress CIDRs
          items:
            type: string
          type:
            - array
            - "null"
        nameservers:
          description: Custom DNS servers (max 3)
          items:
            type: string
          maxItems: 3
          type:
            - array
            - "null"
      type: object
    PodTemplate:
      additionalProperties: false
      properties:
        container:
          $ref: "#/components/schemas/ContainerSpec"
          description: Primary sandbox container
      required:
        - container
      type: object
    PodTemplateInfo:
      additionalProperties: false
      properties:
        container:
          $ref: "#/components/schemas/ContainerInfo"
          description: Primary sandbox container
      required:
        - container
      type: object
    ResourceList:
      additionalProperties: false
      properties:
        cpu:
          description: CPU (K8s quantity)
          examples:
            - 125m
          type: string
        ephemeralStorage:
          description: Ephemeral storage (K8s quantity)
          examples:
            - 1Gi
          type: string
        memory:
          description: Memory (K8s quantity)
          examples:
            - 512Mi
          type: string
      type: object
    ResourcesSpec:
      additionalProperties: false
      properties:
        limits:
          $ref: "#/components/schemas/ResourceList"
          description: Resource limits
        requests:
          $ref: "#/components/schemas/ResourceList"
          description: Resource requests
      type: object
    SandboxResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SandboxResponse.json
          format: uri
          readOnly: true
          type: string
        activeDeadlineSeconds:
          description: Max lifetime in seconds
          format: int64
          type: integer
        creationTimestamp:
          description: Creation UTC timestamp in RFC3339 format
          type: string
        id:
          description: Sandbox identifier
          type: string
        network:
          $ref: "#/components/schemas/NetworkSpec"
          description: Network isolation config
        podTemplate:
          $ref: "#/components/schemas/PodTemplateInfo"
          description: Pod template
        shutdownPolicy:
          $ref: "#/components/schemas/ShutdownPolicySpec"
          description: Shutdown policy config
        status:
          description: Sandbox status
          enum:
            - creating
            - running
            - shuttingDown
            - failed
            - stopped
            - unknown
          type: string
      required:
        - id
        - podTemplate
        - status
        - creationTimestamp
      type: object
    SandboxSummary:
      additionalProperties: false
      properties:
        creationTimestamp:
          description: Creation timestamp
          type: string
        id:
          description: Sandbox identifier
          type: string
        status:
          description: Sandbox status
          type: string
      required:
        - id
        - status
        - creationTimestamp
      type: object
    ShutdownPolicySpec:
      additionalProperties: false
      properties:
        activeDeadlineSeconds:
          description: "Max snapshot job duration in seconds. Only used with SnapshotRootfs. Server default: 300"
          format: int64
          minimum: 1
          type: integer
        strategy:
          default: Delete
          description: Action on shutdown
          enum:
            - Delete
            - SnapshotRootfs
          type: string
      type: object
info:
  description: API for managing sandboxes
  title: Isola Sandbox API
  version: 1.0.0
openapi: 3.1.0
paths:
  /health:
    get:
      description: Returns the health status of the API
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Health check
      tags:
        - health
  /healthz:
    get:
      description: Returns the health status of the API
      operationId: getHealthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Health check (alias)
      tags:
        - health
  /ready:
    get:
      description: Returns the readiness status of the API
      operationId: getReady
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Readiness check
      tags:
        - health
  /readyz:
    get:
      description: Returns the readiness status of the API
      operationId: getReadyz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Readiness check (alias)
      tags:
        - health
  /sandboxes:
    get:
      operationId: listSandboxes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSandboxesResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List sandboxes
      tags:
        - sandboxes
    post:
      operationId: createSandbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandboxRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxResponse"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Create a sandbox
      tags:
        - sandboxes
  /sandboxes/{id}:
    delete:
      operationId: deleteSandbox
      parameters:
        - description: Sandbox identifier
          in: path
          name: id
          required: true
          schema:
            description: Sandbox identifier
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a sandbox
      tags:
        - sandboxes
    get:
      operationId: getSandbox
      parameters:
        - description: Sandbox identifier
          in: path
          name: id
          required: true
          schema:
            description: Sandbox identifier
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxResponse"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get sandbox details
      tags:
        - sandboxes
  /sandboxes/{id}/commands:
    post:
      description: Starts a new command in the sandbox container and returns a command ID for tracking. Commands always run as root (UID 0, GID 0).
      operationId: createSandboxCommand
      parameters:
        - description: Sandbox identifier
          in: path
          name: id
          required: true
          schema:
            description: Sandbox identifier
            type: string
        - description: Container name. Defaults to the only container if there is one, otherwise it's required.
          explode: false
          in: query
          name: container
          schema:
            description: Container name. Defaults to the only container if there is one, otherwise it's required.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommandRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCommandResponse"
          description: Accepted
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      summary: Start a command in a sandbox
      tags:
        - sandboxes
        - commands
  /sandboxes/{id}/commands/{cmdId}:
    delete:
      description: Kills the command process. Idempotent for already-exited commands.
      operationId: deleteSandboxCommand
      parameters:
        - description: Sandbox identifier
          in: path
          name: id
          required: true
          schema:
            description: Sandbox identifier
            type: string
        - description: Command identifier
          in: path
          name: cmdId
          required: true
          schema:
            description: Command identifier
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
            type: string
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      summary: Kill a command
      tags:
        - sandboxes
        - commands
  /sandboxes/{id}/commands/{cmdId}/status:
    get:
      description: Returns the exit code of the command, or null if still running
      operationId: getSandboxCommandStatus
      parameters:
        - description: Sandbox identifier
          in: path
          name: id
          required: true
          schema:
            description: Sandbox identifier
            type: string
        - description: Command identifier
          in: path
          name: cmdId
          required: true
          schema:
            description: Command identifier
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandStatusResponse"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      summary: Get command status
      tags:
        - sandboxes
        - commands
  /sandboxes/{id}/commands/{cmdId}/stderr:
    get:
      description: Streams the command's stderr as raw bytes. The connection remains open until the command exits. Supports resuming via ?offset=N query parameter.
      operationId: getSandboxCommandStderr
      parameters:
        - description: Sandbox identifier
          in: path
          name: id
          required: true
          schema:
            description: Sandbox identifier
            type: string
        - description: Command identifier
          in: path
          name: cmdId
          required: true
          schema:
            description: Command identifier
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
            type: string
        - description: Byte offset to resume from (default 0)
          explode: false
          in: query
          name: offset
          schema:
            description: Byte offset to resume from (default 0)
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: Command stderr stream
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      summary: Stream command stderr
      tags:
        - sandboxes
        - commands
  /sandboxes/{id}/commands/{cmdId}/stdin:
    post:
      description: Writes raw bytes to the command's stdin
      operationId: postSandboxCommandStdin
      parameters:
        - description: Sandbox identifier
          in: path
          name: id
          required: true
          schema:
            description: Sandbox identifier
            type: string
        - description: Command identifier
          in: path
          name: cmdId
          required: true
          schema:
            description: Command identifier
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
            type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
        required: true
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      summary: Write to command stdin
      tags:
        - sandboxes
        - commands
  /sandboxes/{id}/commands/{cmdId}/stdout:
    get:
      description: Streams the command's stdout as raw bytes. The connection remains open until the command exits. Supports resuming via ?offset=N query parameter.
      operationId: getSandboxCommandStdout
      parameters:
        - description: Sandbox identifier
          in: path
          name: id
          required: true
          schema:
            description: Sandbox identifier
            type: string
        - description: Command identifier
          in: path
          name: cmdId
          required: true
          schema:
            description: Command identifier
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
            type: string
        - description: Byte offset to resume from (default 0)
          explode: false
          in: query
          name: offset
          schema:
            description: Byte offset to resume from (default 0)
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: Command stdout stream
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      summary: Stream command stdout
      tags:
        - sandboxes
        - commands
  /sandboxes/{id}/filesystem:
    get:
      description: Streams a file download from the specified path in the sandbox container
      operationId: readSandboxFilesystem
      parameters:
        - description: Sandbox identifier
          in: path
          name: id
          required: true
          schema:
            description: Sandbox identifier
            type: string
