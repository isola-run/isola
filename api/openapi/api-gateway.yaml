components:
  schemas:
    ContainerInfo:
      additionalProperties: false
      properties:
        command:
          description: Container entrypoint override
          items:
            type: string
          type:
            - array
            - "null"
        image:
          description: Container image
          type: string
        resources:
          $ref: "#/components/schemas/ResourcesSpec"
          description: Resource requests and limits
      required:
        - image
      type: object
    ContainerSpec:
      additionalProperties: false
      properties:
        command:
          description: Override the container entrypoint. Defaults to sleep infinity if omitted.
          items:
            type: string
          type:
            - array
            - "null"
        env:
          additionalProperties:
            type: string
          description: Environment variables
          type: object
        image:
          description: Container image
          type: string
        resources:
          $ref: "#/components/schemas/ResourcesSpec"
          description: Resource requests and limits
      required:
        - image
      type: object
    CreateSandboxRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateSandboxRequest.json
          format: uri
          readOnly: true
          type: string
        activeDeadlineSeconds:
          description: Max lifetime in seconds. Omit for no timeout
          format: int64
          minimum: 1
          type: integer
        network:
          $ref: "#/components/schemas/NetworkSpec"
          description: Network isolation config
        podTemplate:
          $ref: "#/components/schemas/PodTemplate"
          description: Pod template
      required:
        - podTemplate
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    HealthResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthResponse.json
          format: uri
          readOnly: true
          type: string
        status:
          description: Health status
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    ListSandboxesResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListSandboxesResponse.json
          format: uri
          readOnly: true
          type: string
        sandboxes:
          description: List of sandboxes
          items:
            $ref: "#/components/schemas/SandboxSummary"
          type:
            - array
            - "null"
      required:
        - sandboxes
      type: object
    NetworkSpec:
      additionalProperties: false
      properties:
        allowAllInternet:
          description: Allow public internet egress
          type: boolean
        allowClusterDNS:
          description: Allow cluster DNS queries
          type: boolean
        allowedEgressCIDRs:
          description: Allowed egress CIDRs
          items:
            type: string
          type:
            - array
            - "null"
        nameservers:
          description: Custom DNS servers (max 3)
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    PodTemplate:
      additionalProperties: false
      properties:
        container:
          $ref: "#/components/schemas/ContainerSpec"
          description: Primary sandbox container
      required:
        - container
      type: object
    PodTemplateInfo:
      additionalProperties: false
      properties:
        container:
          $ref: "#/components/schemas/ContainerInfo"
          description: Primary sandbox container
      required:
        - container
      type: object
    ResourceList:
      additionalProperties: false
      properties:
        cpu:
          description: CPU (K8s quantity)
          examples:
            - 125m
          type: string
        ephemeralStorage:
          description: Ephemeral storage (K8s quantity)
          examples:
            - 1Gi
          type: string
        memory:
          description: Memory (K8s quantity)
          examples:
            - 512Mi
          type: string
      type: object
    ResourcesSpec:
      additionalProperties: false
      properties:
        limits:
          $ref: "#/components/schemas/ResourceList"
          description: Resource limits
        requests:
          $ref: "#/components/schemas/ResourceList"
          description: Resource requests
      type: object
    SandboxResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SandboxResponse.json
          format: uri
          readOnly: true
          type: string
        activeDeadlineSeconds:
          description: Max lifetime in seconds
          format: int64
          type: integer
        creationTimestamp:
          description: Creation UTC timestamp in RFC3339 format
          type: string
        id:
          description: Sandbox identifier
          type: string
        network:
          $ref: "#/components/schemas/NetworkSpec"
          description: Network isolation config
        podTemplate:
          $ref: "#/components/schemas/PodTemplateInfo"
          description: Pod template
        status:
          description: Sandbox status
          enum:
            - creating
            - running
            - shuttingDown
            - failed
            - stopped
            - unknown
          type: string
      required:
        - id
        - podTemplate
        - status
        - creationTimestamp
      type: object
    SandboxSummary:
      additionalProperties: false
      properties:
        creationTimestamp:
          description: Creation timestamp
          type: string
        id:
          description: Sandbox identifier
          type: string
        status:
          description: Sandbox status
          type: string
      required:
        - id
        - status
        - creationTimestamp
      type: object
info:
  description: API for managing sandboxes
  title: Isola Sandbox API
  version: 1.0.0
openapi: 3.1.0
paths:
  /health:
    get:
      description: Returns the health status of the API
      operationId: get-health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Health check
      tags:
        - health
  /healthz:
    get:
      description: Returns the health status of the API
      operationId: get-healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Health check (alias)
      tags:
        - health
  /ready:
    get:
      description: Returns the readiness status of the API
      operationId: get-ready
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Readiness check
      tags:
        - health
  /readyz:
    get:
      description: Returns the readiness status of the API
      operationId: get-readyz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Readiness check (alias)
      tags:
        - health
  /sandboxes:
    get:
      operationId: list-sandboxes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSandboxesResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List sandboxes
      tags:
        - sandboxes
    post:
      operationId: create-sandbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandboxRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxResponse"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Create a sandbox
      tags:
        - sandboxes
  /sandboxes/{id}:
    delete:
      operationId: delete-sandbox
      parameters:
        - description: Sandbox identifier
          in: path
          name: id
          required: true
          schema:
            description: Sandbox identifier
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a sandbox
      tags:
        - sandboxes
    get:
      operationId: get-sandbox
      parameters:
        - description: Sandbox identifier
          in: path
          name: id
          required: true
          schema:
            description: Sandbox identifier
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxResponse"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get sandbox details
      tags:
        - sandboxes
