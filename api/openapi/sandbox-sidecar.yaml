components:
  schemas:
    CommandStatusResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CommandStatusResponse.json
          format: uri
          readOnly: true
          type: string
        exitCode:
          description: Process exit code, null if still running
          format: int64
          type:
            - integer
            - "null"
      required:
        - exitCode
      type: object
    CreateCommandRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateCommandRequest.json
          format: uri
          readOnly: true
          type: string
        args:
          description: Arguments to the executable
          items:
            type: string
          type:
            - array
            - "null"
        cmd:
          description: Executable path
          minLength: 1
          type: string
        cwd:
          description: Working directory inside the sandbox. Defaults to the target container process's working directory if omitted.
          type: string
        env:
          additionalProperties:
            type: string
          description: Environment variable overrides
          type: object
        timeout:
          description: Max execution time in seconds
          format: int64
          minimum: 1
          type: integer
      required:
        - cmd
      type: object
    CreateCommandResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateCommandResponse.json
          format: uri
          readOnly: true
          type: string
        commandId:
          description: Unique command identifier
          type: string
      required:
        - commandId
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    FilesystemWriteResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/FilesystemWriteResponse.json
          format: uri
          readOnly: true
          type: string
        absolutePath:
          description: Absolute path where file was written
          examples:
            - /workspace/file.txt
          type: string
        bytesWritten:
          description: Number of bytes written
          examples:
            - 1024
          format: int64
          type: integer
      required:
        - absolutePath
        - bytesWritten
      type: object
    HealthResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthResponse.json
          format: uri
          readOnly: true
          type: string
        status:
          description: Health status
          examples:
            - ok
          type: string
      required:
        - status
      type: object
info:
  description: Internal API for sandbox filesystem operations
  title: Isola Sandbox Sidecar API
  version: 1.0.0
openapi: 3.1.0
paths:
  /commands:
    post:
      description: Starts a new command in the sandbox container and returns a command ID for tracking
      operationId: createCommand
      parameters:
        - description: Container name. Defaults to the only container if there is one, otherwise it's required.
          explode: false
          in: query
          name: container
          schema:
            description: Container name. Defaults to the only container if there is one, otherwise it's required.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommandRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCommandResponse"
          description: Accepted
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Start a command in the sandbox
      tags:
        - commands
  /commands/{cmdId}:
    delete:
      description: Kills the command process. Idempotent for already-exited commands.
      operationId: deleteCommand
      parameters:
        - description: Command identifier
          in: path
          name: cmdId
          required: true
          schema:
            description: Command identifier
            type: string
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Kill a command
      tags:
        - commands
  /commands/{cmdId}/status:
    get:
      description: Returns the exit code of the command, or null if still running
      operationId: getCommandStatus
      parameters:
        - description: Command identifier
          in: path
          name: cmdId
          required: true
          schema:
            description: Command identifier
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandStatusResponse"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get command status
      tags:
        - commands
  /commands/{cmdId}/stderr:
    get:
      description: Streams the command's stderr as raw bytes. The connection remains open until the command exits. Supports resuming via ?offset=N query parameter.
      operationId: getCommandStderr
      parameters:
        - description: Command identifier
          in: path
          name: cmdId
          required: true
          schema:
            description: Command identifier
            type: string
        - description: Byte offset to resume from (default 0)
          explode: false
          in: query
          name: offset
          schema:
            description: Byte offset to resume from (default 0)
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: Command stderr stream
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Stream command stderr
      tags:
        - commands
  /commands/{cmdId}/stdin:
    post:
      description: Writes raw bytes to the command's stdin
      operationId: postCommandStdin
      parameters:
        - description: Command identifier
          in: path
          name: cmdId
          required: true
          schema:
            description: Command identifier
            type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
        required: true
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Write to command stdin
      tags:
        - commands
  /commands/{cmdId}/stdout:
    get:
      description: Streams the command's stdout as raw bytes. The connection remains open until the command exits. Supports resuming via ?offset=N query parameter.
      operationId: getCommandStdout
      parameters:
        - description: Command identifier
          in: path
          name: cmdId
          required: true
          schema:
            description: Command identifier
            type: string
        - description: Byte offset to resume from (default 0)
          explode: false
          in: query
          name: offset
          schema:
            description: Byte offset to resume from (default 0)
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: Command stdout stream
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Stream command stdout
      tags:
        - commands
  /filesystem:
    get:
      description: Reads a file from the specified path in the sandbox container
      operationId: getFilesystem
      parameters:
        - description: Source path (absolute or relative to container cwd)
          explode: false
          in: query
          name: path
          required: true
          schema:
            description: Source path (absolute or relative to container cwd)
            type: string
        - description: Container name. Defaults to the only container if there is one, otherwise it's required.
          explode: false
          in: query
          name: container
          schema:
            description: Container name. Defaults to the only container if there is one, otherwise it's required.
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: File content
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Read a file from the sandbox filesystem
      tags:
        - filesystem
    post:
      description: Writes a file to the specified path in the sandbox container
      operationId: postFilesystem
      parameters:
        - description: Destination path (absolute or relative to container cwd)
          explode: false
          in: query
          name: path
          required: true
          schema:
            description: Destination path (absolute or relative to container cwd)
            type: string
        - description: Container name. Defaults to the only container if there is one, otherwise it's required.
          explode: false
          in: query
          name: container
          schema:
            description: Container name. Defaults to the only container if there is one, otherwise it's required.
            type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesystemWriteResponse"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Write a file to the sandbox filesystem
      tags:
        - filesystem
  /health:
    get:
      description: Returns the health status of the sidecar
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Health check
      tags:
        - health
  /healthz:
    get:
      description: Returns the health status of the sidecar
      operationId: getHealthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Health check (alias)
      tags:
        - health
