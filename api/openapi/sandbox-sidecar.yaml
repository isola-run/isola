components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    FilesystemWriteResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/FilesystemWriteResponse.json
          format: uri
          readOnly: true
          type: string
        absolutePath:
          description: Absolute path where file was written
          examples:
            - /workspace/file.txt
          type: string
        bytesWritten:
          description: Number of bytes written
          examples:
            - 1024
          format: int64
          type: integer
        container:
          description: Container name
          examples:
            - main
          type: string
      required:
        - absolutePath
        - bytesWritten
      type: object
    HealthResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthResponse.json
          format: uri
          readOnly: true
          type: string
        status:
          description: Health status
          examples:
            - ok
          type: string
      required:
        - status
      type: object
info:
  description: Internal API for sandbox filesystem operations
  title: Isola Sandbox Sidecar API
  version: 1.0.0
openapi: 3.1.0
paths:
  /filesystem:
    post:
      description: Writes a file to the specified path in the sandbox container
      operationId: post-filesystem
      parameters:
        - description: Destination path (absolute or relative to container cwd)
          explode: false
          in: query
          name: path
          required: true
          schema:
            description: Destination path (absolute or relative to container cwd)
            type: string
        - description: Container name (defaults to main container)
          explode: false
          in: query
          name: container
          schema:
            description: Container name (defaults to main container)
            type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesystemWriteResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Write a file to the sandbox filesystem
      tags:
        - filesystem
  /health:
    get:
      description: Returns the health status of the sidecar
      operationId: get-health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Health check
      tags:
        - health
  /healthz:
    get:
      description: Returns the health status of the sidecar
      operationId: get-healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Health check (alias)
      tags:
        - health
  /ws/exec:
    get:
      operationId: ws-exec
      parameters:
        - description: Container name (optional if single container)
          explode: false
          in: query
          name: container
          schema:
            description: Container name (optional if single container)
            type: string
        - description: Shell binary path (absolute)
          explode: false
          in: query
          name: shell
          schema:
            default: /bin/sh
            description: Shell binary path (absolute)
            type: string
        - description: Raw mode (no channel framing)
          explode: false
          in: query
          name: raw
          schema:
            default: false
            description: Raw mode (no channel framing)
            type: boolean
        - description: Terminal columns (1-1000)
          explode: false
          in: query
          name: cols
          schema:
            default: 80
            description: Terminal columns (1-1000)
            format: int32
            minimum: 0
            type: integer
        - description: Terminal rows (1-1000)
          explode: false
          in: query
          name: rows
          schema:
            default: 24
            description: Terminal rows (1-1000)
            format: int32
            minimum: 0
            type: integer
      responses:
        "101":
          description: Switching Protocols — WebSocket connection established
        "200":
          description: OK
      summary: Interactive shell via WebSocket
      tags:
        - exec
