apiVersion: apps/v1
kind: Deployment
metadata:
  name: isola-agent
  namespace: isola-sandboxes
  labels:
    app.kubernetes.io/name: isola-agent
    app.kubernetes.io/instance: isola-agent-dev
    app.kubernetes.io/version: dev
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: isola
#    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: isola-agent
      app.kubernetes.io/instance: isola-agent-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: isola-agent
        app.kubernetes.io/instance: isola-agent-dev
        app.kubernetes.io/version: dev
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: isola
      #    app.kubernetes.io/managed-by: Helm
    spec:
      containers:
      - name: isola-agent
        image: isola-agent:dev
        imagePullPolicy: Never
        env:
        # S3 configuration for large file uploads (LocalStack for development)
        # URL includes endpoint and path style for S3-compatible services
        - name: ISOLA_BUCKET_URL
          value: "s3://isola-uploads?endpoint=http://localstack:4566&use_path_style=true&region=us-east-1"
        - name: AWS_ACCESS_KEY_ID
          value: "test"
        - name: AWS_SECRET_ACCESS_KEY
          value: "test"
