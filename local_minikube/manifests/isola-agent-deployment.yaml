apiVersion: apps/v1
kind: Deployment
metadata:
  name: isola-agent
  namespace: isola-control-plane
  labels:
    app.kubernetes.io/name: isola-agent
    app.kubernetes.io/instance: isola-agent-dev
    app.kubernetes.io/version: dev
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: isola
#    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: isola-agent
      app.kubernetes.io/instance: isola-agent-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: isola-agent
        app.kubernetes.io/instance: isola-agent-dev
        app.kubernetes.io/version: dev
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: isola
      #    app.kubernetes.io/managed-by: Helm
    spec:
      containers:
      - name: isola-agent
        image: isola-agent:dev
        imagePullPolicy: Never
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: LOG_LEVEL
          value: "debug"
        - name: ISOLA_CONTROLLER_WS_URL
          value: "ws://isola-controller:8765/ws"
        # S3 configuration for large file uploads (LocalStack for development)
        - name: S3_BUCKET
          value: "isola-uploads"
        - name: S3_ENDPOINT_URL
          value: "http://localstack:4566"
        - name: S3_REGION
          value: "us-east-1"
        - name: AWS_ACCESS_KEY_ID
          value: "test"
        - name: AWS_SECRET_ACCESS_KEY
          value: "test"
