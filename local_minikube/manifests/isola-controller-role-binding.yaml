apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: isola-controller-sandboxes-binding
  namespace: isola-sandboxes
subjects:
- kind: ServiceAccount
  name: isola-controller-serviceaccount
  namespace: isola-sandboxes
roleRef:
  kind: Role
  name: sandboxes-manager
  apiGroup: rbac.authorization.k8s.io