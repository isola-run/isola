apiVersion: apps/v1
kind: Deployment
metadata:
  name: isola-controller
  namespace: isola-control-plane
  labels:
    app.kubernetes.io/name: isola-controller
    app.kubernetes.io/instance: isola-controller-dev
    app.kubernetes.io/version: dev
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: isola
#    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: isola-controller
      app.kubernetes.io/instance: isola-controller-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: isola-controller
        app.kubernetes.io/instance: isola-controller-dev
        app.kubernetes.io/version: dev
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/part-of: isola
      #    app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: isola-controller-serviceaccount
      containers:
      - name: isola-controller
        image: isola-controller:dev
        imagePullPolicy: Never
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: LOG_LEVEL
          value: "debug"
        # S3 configuration for large file uploads (LocalStack for development)
        - name: BUCKET_NAME
          value: "isola-uploads"
        - name: ENDPOINT_URL
          value: "http://localstack:4566"
        - name: REGION
          value: "us-east-1"
        - name: ACCESS_KEY_ID
          value: "test"
        - name: SECRET_ACCESS_KEY
          value: "test"
        ports:
          - name: http
            containerPort: 30080
