openapi: 3.0.3
info:
  title: Isola Gateway API
  description: |
    API for managing sandboxes - isolated compute environments for secure code execution.
    
    Isola provides:
    - Sandbox lifecycle management (create, list, get, terminate)
    - Command execution within sandboxes
    - File upload/download operations
  version: 1.0.0
  contact:
    name: Isola Team

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.isola.run
    description: Production server

tags:
  - name: Health
    description: Health and readiness endpoints
  - name: Sandboxes
    description: Sandbox lifecycle management
  - name: Execution
    description: Command execution in sandboxes
  - name: Files
    description: File operations (upload/download)

security:
  - ApiKeyAuth: []

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the health status of the gateway and its components
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      tags:
        - Health
      summary: Readiness check
      description: Returns whether the service is ready to accept requests
      operationId: readinessCheck
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'

  /api/v1/sandboxes:
    get:
      tags:
        - Sandboxes
      summary: List sandboxes
      description: Returns a paginated list of sandboxes, optionally filtered by state
      operationId: listSandboxes
      parameters:
        - name: state
          in: query
          description: Filter by sandbox state
          required: false
          schema:
            $ref: '#/components/schemas/SandboxState'
        - name: limit
          in: query
          description: Maximum number of sandboxes to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of sandboxes to skip
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of sandboxes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxList'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Sandboxes
      summary: Create a sandbox
      description: Creates a new sandbox with the specified configuration
      operationId: createSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSandboxRequest'
      responses:
        '201':
          description: Sandbox created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sandboxes/{name}:
    get:
      tags:
        - Sandboxes
      summary: Get sandbox
      description: Returns details of a specific sandbox by name
      operationId: getSandbox
      parameters:
        - $ref: '#/components/parameters/SandboxName'
      responses:
        '200':
          description: Sandbox details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '401':
          description: Unauthorized - missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Sandbox not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Sandboxes
      summary: Terminate sandbox
      description: Terminates and deletes a sandbox
      operationId: terminateSandbox
      parameters:
        - $ref: '#/components/parameters/SandboxName'
        - name: force
          in: query
          description: Force immediate termination without graceful shutdown
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Sandbox terminated successfully
        '401':
          description: Unauthorized - missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Sandbox not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sandboxes/{id}/execute:
    post:
      tags:
        - Execution
      summary: Execute command
      description: |
        Executes a shell command in the sandbox and returns the output.
        The sandbox must be in 'running' state.
      operationId: executeCommand
      parameters:
        - $ref: '#/components/parameters/SandboxName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteCommandRequest'
      responses:
        '200':
          description: Command executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteCommandResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Sandbox not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Sandbox not in running state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sandboxes/{id}/files:
    get:
      tags:
        - Files
      summary: Download file
      description: |
        Downloads a file from the sandbox. Returns base64-encoded content.
        Maximum file size is 5MB. For larger files, use chunked download.
      operationId: downloadFile
      parameters:
        - $ref: '#/components/parameters/SandboxName'
        - name: path
          in: query
          description: Path to the file in the sandbox
          required: true
          schema:
            type: string
          example: /home/user/output.txt
      responses:
        '200':
          description: File downloaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDownloadResponse'
        '400':
          description: Invalid request - missing path parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Sandbox or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Sandbox not in running state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: File too large for direct download
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to connect to sandbox agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Files
      summary: Upload file
      description: |
        Uploads a file to the sandbox. For files under 5MB, uploads directly.
        For larger files, use the presigned URL flow (upload-url + confirm endpoints).
      operationId: uploadFile
      parameters:
        - $ref: '#/components/parameters/SandboxName'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - path
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload
                path:
                  type: string
                  description: Target path in the sandbox
                  example: /home/user/script.py
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        '400':
          description: Invalid request - missing file or path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Sandbox not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Sandbox not in running state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: File too large - use presigned URL flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to connect to sandbox agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sandboxes/{id}/files/upload-url:
    post:
      tags:
        - Files
      summary: Generate presigned upload URL
      description: |
        Generates a presigned URL for uploading large files directly to object storage.
        After uploading to the presigned URL, call the confirm endpoint to trigger
        the file transfer to the sandbox.
      operationId: generateUploadUrl
      parameters:
        - $ref: '#/components/parameters/SandboxName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned URL generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Sandbox not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Sandbox not in running state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Storage not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sandboxes/{id}/files/confirm:
    post:
      tags:
        - Files
      summary: Confirm upload
      description: |
        Confirms a large file upload after the file has been uploaded to the presigned URL.
        Triggers the sandbox agent to download the file from object storage.
      operationId: confirmUpload
      parameters:
        - $ref: '#/components/parameters/SandboxName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmUploadRequest'
      responses:
        '200':
          description: Upload confirmed and file transferred to sandbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmUploadResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Sandbox not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Sandbox not in running state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Storage not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to connect to sandbox agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication

  parameters:
    SandboxName:
      name: name
      in: path
      description: Unique name of the sandbox (DNS-safe identifier)
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9]+$
        minLength: 12
        maxLength: 63
      example: v1stgxr8z5jd

  schemas:
    SandboxState:
      type: string
      description: Current state of the sandbox
      enum:
        - pending
        - starting
        - running
        - terminating
        - stopped
        - error
        - unknown

    AttachedVolume:
      type: object
      description: A volume attached to the sandbox
      required:
        - volumeId
        - mountPath
      properties:
        volumeId:
          type: string
          description: ID of the volume to attach
        mountPath:
          type: string
          description: Path where the volume is mounted in the sandbox

    Sandbox:
      type: object
      description: A sandbox instance
      required:
        - name
        - state
        - env
        - labels
        - createdAt
      properties:
        name:
          type: string
          description: Unique name of the sandbox (DNS-safe identifier, used as the sole identifier)
          pattern: ^[a-z0-9]+$
          example: v1stgxr8z5jd
        state:
          $ref: '#/components/schemas/SandboxState'
        desiredState:
          $ref: '#/components/schemas/SandboxState'
        env:
          type: object
          additionalProperties:
            type: string
          description: Environment variables set in the sandbox
        labels:
          type: object
          additionalProperties:
            type: string
          description: Labels attached to the sandbox
        errorReason:
          type: string
          nullable: true
          description: Error message if the sandbox is in error state
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the sandbox was created

    SandboxList:
      type: object
      description: Paginated list of sandboxes
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Sandbox'
        total:
          type: integer
          description: Total number of sandboxes matching the filter
        limit:
          type: integer
          description: Maximum items per page
        offset:
          type: integer
          description: Number of items skipped

    CreateSandboxRequest:
      type: object
      description: Request to create a new sandbox
      properties:
        name:
          type: string
          description: |
            Optional name for the sandbox. If not provided, a unique name will be auto-generated.
            If provided, must be DNS-safe (lowercase alphanumeric, max 63 chars).
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
        image:
          type: string
          description: Container image to use for the sandbox
          example: python:3.11-slim
        region:
          type: string
          description: Region where the sandbox should be deployed
        cpu:
          type: number
          format: double
          description: CPU cores to allocate (e.g., 0.5, 1, 2)
          minimum: 0.1
          maximum: 16
        memory:
          type: number
          format: double
          description: Memory in GB to allocate
          minimum: 0.1
          maximum: 64
        disk:
          type: number
          format: double
          description: Disk space in GB to allocate
          minimum: 1
          maximum: 100
        gpu:
          type: integer
          description: Number of GPUs to allocate
          minimum: 0
          maximum: 8
        env:
          type: object
          additionalProperties:
            type: string
          description: Environment variables to set in the sandbox
        labels:
          type: object
          additionalProperties:
            type: string
          description: Labels to attach to the sandbox
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/AttachedVolume'
          description: Volumes to attach to the sandbox
        autoStart:
          type: boolean
          description: Whether to start the sandbox automatically after creation
          default: false

    ExecuteCommandRequest:
      type: object
      description: Request to execute a command in a sandbox
      required:
        - command
      properties:
        command:
          type: string
          description: Shell command to execute
          minLength: 1
          example: "python script.py"

    ExecuteCommandResponse:
      type: object
      description: Response from command execution
      required:
        - stdout
        - stderr
        - exitCode
      properties:
        stdout:
          type: string
          description: Standard output from the command
        stderr:
          type: string
          description: Standard error from the command
        exitCode:
          type: integer
          description: Exit code of the command (0 = success)

    FileUploadResponse:
      type: object
      description: Response from file upload
      required:
        - success
        - path
        - size
      properties:
        success:
          type: boolean
          description: Whether the upload was successful
        path:
          type: string
          description: Path where the file was uploaded
        size:
          type: integer
          format: int64
          description: Size of the uploaded file in bytes

    FileDownloadResponse:
      type: object
      description: Response from file download
      required:
        - path
        - size
        - content
      properties:
        path:
          type: string
          description: Path of the downloaded file
        size:
          type: integer
          format: int64
          description: Size of the file in bytes
        content:
          type: string
          format: byte
          description: Base64-encoded file content

    UploadUrlRequest:
      type: object
      description: Request to generate a presigned upload URL
      required:
        - path
        - filename
      properties:
        path:
          type: string
          description: Target path in the sandbox where the file will be placed
          example: /home/user/large-file.zip
        filename:
          type: string
          description: Name of the file being uploaded
          example: large-file.zip
        content_type:
          type: string
          description: MIME type of the file
          example: application/zip

    UploadUrlResponse:
      type: object
      description: Response containing presigned upload URL
      required:
        - upload_url
        - upload_id
        - expires_in
      properties:
        upload_url:
          type: string
          format: uri
          description: Presigned URL to upload the file to
        upload_id:
          type: string
          description: Unique identifier for this upload session
        expires_in:
          type: integer
          description: Seconds until the presigned URL expires

    ConfirmUploadRequest:
      type: object
      description: Request to confirm a large file upload
      required:
        - upload_id
        - filename
        - path
      properties:
        upload_id:
          type: string
          description: Upload ID from the upload-url response
        filename:
          type: string
          description: Name of the uploaded file
        path:
          type: string
          description: Target path in the sandbox

    ConfirmUploadResponse:
      type: object
      description: Response from confirming an upload
      required:
        - success
        - path
        - size
      properties:
        success:
          type: boolean
          description: Whether the file was transferred successfully
        path:
          type: string
          description: Path where the file was placed in the sandbox
        size:
          type: integer
          format: int64
          description: Size of the file in bytes

    HealthResponse:
      type: object
      description: Health check response
      required:
        - status
        - timestamp
        - version
      properties:
        status:
          type: string
          description: Overall health status
          example: healthy
        timestamp:
          type: string
          format: date-time
          description: Current server timestamp
        components:
          type: object
          additionalProperties:
            type: string
          description: Health status of individual components
        version:
          type: string
          description: API version
          example: "1.0.0"

    ReadyResponse:
      type: object
      description: Readiness check response
      required:
        - status
      properties:
        status:
          type: string
          description: Readiness status
          example: ready

    ErrorResponse:
      type: object
      description: Error response
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
          example: NotFound
        message:
          type: string
          description: Human-readable error message
          example: Sandbox not found
        details:
          type: object
          additionalProperties: true
          description: Additional error details

