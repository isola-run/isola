apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: isola-controller-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: isola-controller
    app.kubernetes.io/instance: dev
spec:
  project: isola
  
  source:
    repoURL: git@github.com:omereli/dev-isola.git
    targetRevision: HEAD
    path: charts/isola-controller
    helm:
      releaseName: isola-controller
      valueFiles:
        - values.yaml
        - values-dev.yaml
  
  destination:
    server: https://kubernetes.default.svc
    namespace: isola-control-plane
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  revisionHistoryLimit: 10
  
  # Health assessment for specific resources
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas  # Ignore if HPA is managing replicas
