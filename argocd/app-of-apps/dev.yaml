apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: isola-apps-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: dev
    type: app-of-apps
spec:
  project: isola
  
  source:
    repoURL: https://github.com/yourusername/dev-isola.git
    targetRevision: HEAD
    path: argocd/applications
    directory:
      recurse: false
      include: '*-dev.yaml'
  
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false  # ArgoCD namespace should already exist
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  revisionHistoryLimit: 10
