version: '3.8'

services:
  isola-controller:
    build:
      context: .
      dockerfile: services/isola_controller/Dockerfile
    container_name: isola-controller
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=debug
    networks:
      - isola-network

  isola-agent:
    build:
      context: .
      dockerfile: services/isola_agent/Dockerfile
    container_name: isola-agent
    depends_on:
      - isola-controller
    environment:
      - PYTHONUNBUFFERED=1
      - ISOLA_CONTROLLER_WS_URL=ws://isola-controller:8765/ws
      - LOG_LEVEL=debug
    networks:
      - isola-network

  test:
    build:
      context: .
      dockerfile: tests/Dockerfile
    container_name: isola-test
    depends_on:
      - isola-controller
      - isola-agent
    environment:
      - PYTHONUNBUFFERED=1
      - TEST_BASE_URL=http://isola-controller:30080
      - TEST_API_KEY=iso_sk_demo
    volumes:
      - ./tests:/tests:ro
    networks:
      - isola-network
    stdin_open: true
    tty: true
    working_dir: /tests

networks:
  isola-network:
    driver: bridge

