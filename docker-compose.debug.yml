version: '3.8'

services:
  controller:
    build:
      context: .
      dockerfile: services/isola_controller/Dockerfile
    container_name: isola-controller
    ports:
      - "3000:3000"  # API port
      - "8675:8675"  # WebSocket port
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=debug
    networks:
      - isola-network

  agent:
    build:
      context: .
      dockerfile: services/isola_agent/Dockerfile
    container_name: isola-agent
    depends_on:
      - controller
    environment:
      - PYTHONUNBUFFERED=1
      - ISOLA_CONTROLLER_WS_URL=ws://controller:8765/ws
      - LOG_LEVEL=debug
    networks:
      - isola-network

  test:
    build:
      context: .
      dockerfile: tests/Dockerfile
    container_name: isola-test
    depends_on:
      - controller
      - agent
    environment:
      - PYTHONUNBUFFERED=1
      - TEST_BASE_URL=http://controller:3000
      - TEST_API_KEY=iso_sk_demo
    volumes:
      - ./tests:/tests:ro
    networks:
      - isola-network
    stdin_open: true
    tty: true
    working_dir: /tests

networks:
  isola-network:
    driver: bridge

