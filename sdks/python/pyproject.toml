[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isola-run"
dynamic = ["version"]
description = "Python SDK for the Isola sandbox platform"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "httpx-sse>=0.4.3",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22.0",
    "ruff>=0.4.0",
]

# Version is bumped by hack/bump-version.sh; hatchling reads __version__ from the file.
[tool.hatch.version]
path = "src/isola/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/isola"]

[tool.hatch.build.targets.sdist]
include = ["src/isola", "README.md"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "T10", "T20"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
