[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "isola-run"
dynamic = ["version"]
description = "Python SDK for the Isola sandbox platform"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "httpx-sse>=0.4.3",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22.0",
    "ruff>=0.4.0",
]

[tool.hatch.version]
source = "vcs"
# Accept tags like v0.5.0, v0.5.0-rc.0, v0.5.0-rc.1. Narrower than the default
# regex; prevents a mistyped tag like "vabc" from producing a garbage version.
tag-pattern = "^v(?P<version>\\d+\\.\\d+\\.\\d+(?:-rc\\.\\d+)?)$"
fallback-version = "0.0.0.dev0"

[tool.hatch.version.raw-options]
# SDK lives at sdks/python/; git root is two levels up.
root = "../.."
# Resolve `root` relative to THIS FILE (not the current working directory)
# so `uv build sdks/python` and `cd sdks/python && uv build` both work.
relative_to = "pyproject.toml"
# Clean tags: produce `0.5.0rc0`, not `0.5.0rc0.dev1+g<sha>` on mid-cycle builds.
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
# Write the resolved PEP 440 version into a module file so runtime code can
# `from isola._version import __version__`. File is gitignored; generated at
# build time by hatch-vcs. See the project's root .gitignore.
version-file = "src/isola/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/isola"]

[tool.hatch.build.targets.sdist]
include = ["src/isola", "README.md"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "T10", "T20"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

# _version.py is generated by hatch-vcs at build time and is gitignored;
# mypy must treat it as resolvable regardless of whether the file exists
# on disk at check time.
[[tool.mypy.overrides]]
module = "isola._version"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
