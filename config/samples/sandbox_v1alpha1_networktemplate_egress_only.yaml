apiVersion: sandbox.isola.run/v1alpha1
kind: NetworkTemplate
metadata:
  name: isola-egress-only
  labels:
    app.kubernetes.io/managed-by: isola-operator
spec:
  # isola-egress-only: Allow internet egress, DNS, controller ingress
  # Risky CIDRs (169.254.0.0/16 cloud metadata, fe80::/10 IPv6 link-local)
  # are automatically blocked by the NetworkPolicy builder
  allowedEgress:
    - "0.0.0.0/0"
  allowClusterDNS: true
  # Controller ingress on port 8080 is always allowed by the NetworkPolicy builder
