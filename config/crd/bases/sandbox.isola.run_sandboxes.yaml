---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: sandboxes.sandbox.isola.run
spec:
  group: sandbox.isola.run
  names:
    kind: Sandbox
    listKind: SandboxList
    plural: sandboxes
    shortNames:
    - sb
    singular: sandbox
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Aggregate readiness
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: SandboxTemplate reference
      jsonPath: .spec.templateRef.name
      name: Template
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: Reason for Ready condition
      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Sandbox is the Schema for the sandboxes API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Sandbox
            properties:
              network:
                description: |-
                  Network specifies the network isolation configuration for this sandbox.
                  If not specified, the sandbox has deny-all egress with sink DNS (queries fail fast).
                  Network configuration is immutable after sandbox creation.
                properties:
                  allowAllInternet:
                    default: false
                    description: |-
                      AllowAllInternet allows egress to 0.0.0.0/0 and ::/0 with blocked ranges
                      (private IPs, cloud metadata, etc.) automatically excepted.
                      Adds label isola.run/allow-internet=true to the pod.
                    type: boolean
                  allowClusterDNS:
                    default: false
                    description: |-
                      AllowClusterDNS allows DNS queries to cluster DNS (kube-dns/CoreDNS).
                      When true: DNSPolicy=ClusterFirst, adds label isola.run/allow-cluster-dns=true
                      When false: DNSPolicy=None, uses nameservers field or sink (127.0.0.1)
                    type: boolean
                  allowedEgressCIDRs:
                    description: |-
                      AllowedEgressCIDRs specifies additional CIDRs the sandbox can reach.
                      Blocked ranges are automatically excepted. Creates a custom NetworkPolicy.
                    items:
                      pattern: ^((([0-9]{1,3}\.){3}[0-9]{1,3})/(3[0-2]|[12]?[0-9]))|(([0-9a-fA-F:]+)/([0-9]|[1-9][0-9]|1[01][0-9]|12[0-8]))$
                      type: string
                    type: array
                  allowedEgressPods:
                    description: |-
                      AllowedEgressPods specifies pods the sandbox can reach via selectors.
                      Uses full LabelSelector (matchLabels + matchExpressions) for flexibility.
                      Creates a custom NetworkPolicy.
                    items:
                      description: |-
                        EgressPodRule defines a pod-based egress rule.
                        This allows sandboxes to communicate with specific pods in the cluster.
                      properties:
                        namespace:
                          description: Namespace of the target pods.
                          minLength: 1
                          type: string
                        podSelector:
                          description: |-
                            PodSelector selects pods in the namespace.
                            An empty selector ({}) matches all pods in the namespace.
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector
                                requirements. The requirements are ANDed.
                              items:
                                description: |-
                                  A label selector requirement is a selector that contains values, a key, and an operator that
                                  relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector
                                      applies to.
                                    type: string
                                  operator:
                                    description: |-
                                      operator represents a key's relationship to a set of values.
                                      Valid operators are In, NotIn, Exists and DoesNotExist.
                                    type: string
                                  values:
                                    description: |-
                                      values is an array of string values. If the operator is In or NotIn,
                                      the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                      the values array must be empty. This array is replaced during a strategic
                                      merge patch.
                                    items:
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                required:
                                - key
                                - operator
                                type: object
                              type: array
                              x-kubernetes-list-type: atomic
                            matchLabels:
                              additionalProperties:
                                type: string
                              description: |-
                                matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                map is equivalent to an element of matchExpressions, whose key field is "key", the
                                operator is "In", and the values array contains only "value". The requirements are ANDed.
                              type: object
                          type: object
                          x-kubernetes-map-type: atomic
                        ports:
                          description: Ports to allow. If empty, all ports are allowed
                            to the selected pods.
                          items:
                            description: NetworkPort defines a port for network rules.
                            properties:
                              port:
                                description: Port number.
                                format: int32
                                maximum: 65535
                                minimum: 1
                                type: integer
                              protocol:
                                default: TCP
                                description: Protocol (TCP or UDP). Defaults to TCP.
                                enum:
                                - TCP
                                - UDP
                                type: string
                            required:
                            - port
                            type: object
                          type: array
                      required:
                      - namespace
                      - podSelector
                      type: object
                    type: array
                  nameservers:
                    description: |-
                      Nameservers are DNS server IPs to inject into the pod.
                      When allowClusterDNS=false: These are the only nameservers (or 127.0.0.1 sink if empty).
                      When allowClusterDNS=true: Combined with cluster DNS.
                      When specified with allowAllInternet=false, creates custom policy for DNS egress.
                      MaxItems=3 because Kubernetes allows at most 3 nameservers in pod DNS config.
                    items:
                      type: string
                    maxItems: 3
                    type: array
                    x-kubernetes-validations:
                    - message: must be valid IP addresses
                      rule: self.all(s, isIP(s))
                type: object
              templateRef:
                description: |-
                  TemplateRef references the SandboxTemplate to inherit pod configuration from.
                  The SandboxTemplate must exist in the same namespace as this Sandbox.
                properties:
                  name:
                    description: |-
                      Name of the SandboxTemplate in the same namespace.
                      The referenced SandboxTemplate provides the pod configuration (containers, initContainers, etc.)
                      and lifecycle settings (timeout, shutdown policy) for this Sandbox.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - templateRef
            type: object
            x-kubernetes-validations:
            - message: network cannot be removed once set
              rule: '!has(oldSelf.network) || has(self.network)'
            - message: network is immutable once set
              rule: '!has(self.network) || !has(oldSelf.network) || self.network ==
                oldSelf.network'
          status:
            description: status defines the observed state of Sandbox
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              podIP:
                description: PodIP is the IP address of the sandbox pod.
                type: string
              timeoutAt:
                description: |-
                  TimeoutAt is the absolute time at which the sandbox should be considered timed out.
                  It is set by the controller (derived from template timeout + chosen start time).
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
