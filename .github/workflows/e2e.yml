name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  KIND_CLUSTER_NAME: isola-e2e
  # Image names (no registry prefix - loaded directly into Kind)
  OPERATOR_IMAGE: isola-operator
  SANDBOX_SIDECAR_IMAGE: sandbox-sidecar
  UPLOADER_IMAGE: isola-snapshot-uploader
  API_IMAGE: api-gateway
  SNAPSHOT_MOUNTER_IMAGE: snapshot-mounter

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Build all images in parallel with caching
      - name: Build isola-operator image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: cmd/operator/Dockerfile
          load: true
          tags: ${{ env.OPERATOR_IMAGE }}:ci
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator

      - name: Build sandbox-sidecar image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: cmd/sandbox-sidecar/Dockerfile
          load: true
          tags: ${{ env.SANDBOX_SIDECAR_IMAGE }}:ci
          cache-from: type=gha,scope=sidecar
          cache-to: type=gha,mode=max,scope=sidecar

      - name: Build isola-snapshot-uploader image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: cmd/snapshot-uploader/Dockerfile
          load: true
          tags: ${{ env.UPLOADER_IMAGE }}:ci
          cache-from: type=gha,scope=uploader
          cache-to: type=gha,mode=max,scope=uploader

      - name: Build api-gateway image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: cmd/api-gateway/Dockerfile
          load: true
          tags: ${{ env.API_IMAGE }}:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build snapshot-mounter image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: cmd/snapshot-mounter
          file: cmd/snapshot-mounter/Dockerfile
          load: true
          tags: ${{ env.SNAPSHOT_MOUNTER_IMAGE }}:ci
          cache-from: type=gha,scope=snapshot-mounter
          cache-to: type=gha,mode=max,scope=snapshot-mounter

      - name: Create Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          config: hack/kind-config.yaml
          wait: 120s

      - name: Install gVisor in Kind node
        run: |
          set -e
          NODE="${KIND_CLUSTER_NAME}-control-plane"
          GVISOR_URL="https://storage.googleapis.com/gvisor/releases/release/20260622/x86_64"

          echo "Installing gVisor binaries..."
          docker exec "$NODE" sh -c "
            set -e
            curl -fsSL '${GVISOR_URL}/runsc' -o /tmp/runsc
            curl -fsSL '${GVISOR_URL}/containerd-shim-runsc-v1' -o /tmp/containerd-shim-runsc-v1
            chmod +x /tmp/runsc /tmp/containerd-shim-runsc-v1
            mv /tmp/runsc /tmp/containerd-shim-runsc-v1 /usr/local/bin/
          "

          echo "Configuring containerd for gVisor..."
          docker exec "$NODE" sh -c 'cat > /etc/containerd/runsc.toml << "TOML"
          [runsc_config]
            allow-rootfs-tar-annotation = "true"
            # SystemdCgroup=true so runsc enforces pod cgroup limits.
            # https://gvisor.dev/docs/user_guide/systemd/
            # https://github.com/google/gvisor/issues/10371
            systemd-cgroup = "true"
          TOML'

          GVISOR_CONFIG='
          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runsc]
            runtime_type = "io.containerd.runsc.v1"
            pod_annotations = ["dev.gvisor.*"]
          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runsc.options]
            TypeUrl = "io.containerd.runsc.v1.options"
            ConfigPath = "/etc/containerd/runsc.toml"
          '
          docker exec "$NODE" sh -c "echo '$GVISOR_CONFIG' >> /etc/containerd/config.toml"

          echo "Restarting containerd..."
          docker exec "$NODE" systemctl restart containerd

          echo "Verifying gVisor installation..."
          docker exec "$NODE" runsc --version

      - name: Create gVisor RuntimeClass
        run: |
          kubectl apply -f - <<EOF
          apiVersion: node.k8s.io/v1
          kind: RuntimeClass
          metadata:
            name: gvisor
          handler: runsc
          EOF

      - name: Load images into Kind
        run: |
          kind load docker-image ${{ env.OPERATOR_IMAGE }}:ci --name ${{ env.KIND_CLUSTER_NAME }}
          kind load docker-image ${{ env.SANDBOX_SIDECAR_IMAGE }}:ci --name ${{ env.KIND_CLUSTER_NAME }}
          kind load docker-image ${{ env.UPLOADER_IMAGE }}:ci --name ${{ env.KIND_CLUSTER_NAME }}
          kind load docker-image ${{ env.API_IMAGE }}:ci --name ${{ env.KIND_CLUSTER_NAME }}
          kind load docker-image ${{ env.SNAPSHOT_MOUNTER_IMAGE }}:ci --name ${{ env.KIND_CLUSTER_NAME }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Deploy LocalStack
        run: |
          helm repo add localstack https://localstack.github.io/helm-charts
          helm repo update
          helm install localstack localstack/localstack \
            --namespace localstack \
            --create-namespace \
            -f charts/localstack-values.yaml \
            --wait --timeout 3m

      - name: Create sandbox namespace
        run: kubectl create namespace isola-sandboxes

      - name: Deploy isola
        run: |
          helm install isola charts/isola \
            --namespace isola-system \
            --create-namespace \
            -f charts/isola/values-dev.yaml \
            --set operator.image.repository=${{ env.OPERATOR_IMAGE }} \
            --set operator.image.tag=ci \
            --set operator.image.pullPolicy=Never \
            --set operator.sandboxSidecar.image.repository=${{ env.SANDBOX_SIDECAR_IMAGE }} \
            --set operator.sandboxSidecar.image.tag=ci \
            --set operator.sandboxRuntime.rootfssnapshot.uploader.image.repository=${{ env.UPLOADER_IMAGE }} \
            --set operator.sandboxRuntime.rootfssnapshot.uploader.image.tag=ci \
            --set apiGateway.image.repository=${{ env.API_IMAGE }} \
            --set apiGateway.image.tag=ci \
            --set apiGateway.image.pullPolicy=Never \
            --set operator.sandboxRuntime.rootfssnapshot.snapshotMounter.mounter.image.repository=${{ env.SNAPSHOT_MOUNTER_IMAGE }} \
            --set operator.sandboxRuntime.rootfssnapshot.snapshotMounter.mounter.image.tag=ci \
            --set operator.sandboxRuntime.rootfssnapshot.snapshotMounter.mounter.image.pullPolicy=Never \
            --wait --timeout 3m

      - name: Wait for services to be ready
        run: |
          echo "Waiting for isola-operator..."
          kubectl rollout status deployment/isola-operator -n isola-system --timeout=120s

          echo "Waiting for isola-api-gateway..."
          kubectl rollout status deployment/isola-api-gateway -n isola-system --timeout=120s

          echo "Waiting for isola-snapshot-mounter..."
          kubectl rollout status daemonset/isola-snapshot-mounter -n isola-system --timeout=120s

          echo "Checking pod status..."
          kubectl get pods -n isola-system

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Run E2E tests
        working-directory: tests/e2e
        run: |
          uv run --frozen pytest -n 4 --dist load --slow -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: tests/e2e/test-results.xml
          retention-days: 7

      # Failure diagnostics
      - name: Export Kind logs on failure
        if: failure()
        run: |
          kind export logs ./kind-logs --name ${{ env.KIND_CLUSTER_NAME }}

      - name: Collect debug info on failure
        if: failure()
        run: |
          mkdir -p ./debug-logs

          echo "=== Pods ===" > ./debug-logs/pods.txt
          kubectl get pods -A -o wide >> ./debug-logs/pods.txt 2>&1 || true

          echo "=== Events ===" > ./debug-logs/events.txt
          kubectl get events -A --sort-by='.lastTimestamp' >> ./debug-logs/events.txt 2>&1 || true

          echo "=== isola-operator logs ===" > ./debug-logs/operator.log
          kubectl logs -l app.kubernetes.io/name=isola-operator -n isola-system --tail=500 >> ./debug-logs/operator.log 2>&1 || true

          echo "=== api-gateway logs ===" > ./debug-logs/api.log
          kubectl logs -l app.kubernetes.io/name=isola-api-gateway -n isola-system --tail=500 >> ./debug-logs/api.log 2>&1 || true

          echo "=== snapshot-mounter logs ===" > ./debug-logs/snapshot-mounter.log
          kubectl logs -l app.kubernetes.io/component=snapshot-mounter -n isola-system --all-containers --tail=500 >> ./debug-logs/snapshot-mounter.log 2>&1 || true

          echo "=== Sandboxes ===" > ./debug-logs/sandboxes.txt
          kubectl get sandboxes -A -o wide >> ./debug-logs/sandboxes.txt 2>&1 || true
          kubectl describe sandboxes -A >> ./debug-logs/sandboxes.txt 2>&1 || true

          echo "=== NetworkTemplates ===" > ./debug-logs/networktemplates.txt
          kubectl get networktemplates -A -o wide >> ./debug-logs/networktemplates.txt 2>&1 || true

          echo "=== Sandbox pods ===" > ./debug-logs/sandbox-pods.log
          for pod in $(kubectl get pods -n isola-sandboxes -o name 2>/dev/null); do
            echo "--- $pod ---" >> ./debug-logs/sandbox-pods.log
            kubectl logs "$pod" -n isola-sandboxes --all-containers --tail=100 >> ./debug-logs/sandbox-pods.log 2>&1 || true
          done

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-failure-logs-${{ github.run_id }}
          path: |
            ./kind-logs
            ./debug-logs
          retention-days: 7
