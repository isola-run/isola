name: Codegen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-codegen:
    name: Verify Generated Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install controller-gen
        run: go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.20.0

      - name: Verify Swagger docs are in sync
        run: make check-swagger

      - name: Verify CRD/RBAC manifests are in sync
        run: make check-manifests
