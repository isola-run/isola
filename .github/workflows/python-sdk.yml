name: Python SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdks/python/**'
      - '.github/workflows/python-sdk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdks/python/**'
      - '.github/workflows/python-sdk.yml'

permissions:
  contents: read

jobs:
  python-sdk:
    name: Python SDK (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor matches requires-python / ruff target-version / mypy python_version
        # in pyproject.toml; ceiling is the latest stable release. Mirrors the
        # min/current Node matrix in typescript-sdk.yml.
        python: ['3.10', '3.14']
    defaults:
      run:
        working-directory: sdks/python

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          # Sets UV_PYTHON, so uv sync/run below resolve against the matrix
          # interpreter instead of whatever uv would otherwise discover.
          python-version: ${{ matrix.python }}

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen mypy src

      - name: Test
        run: uv run --frozen pytest -q
