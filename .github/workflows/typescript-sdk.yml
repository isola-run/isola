name: TypeScript SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdks/typescript/**'
      - '.github/workflows/typescript-sdk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdks/typescript/**'
      - '.github/workflows/typescript-sdk.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: sdks/typescript

jobs:
  test:
    name: TypeScript SDK (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.9 # keep in sync with package.json packageManager
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Test with coverage
        run: pnpm test:coverage
      - name: Verify package
        run: pnpm verify-package

  runtime-compat:
    name: ${{ matrix.runtime }} runtime smoke
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.9 # keep in sync with package.json packageManager
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: sdks/typescript/.nvmrc
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Run smoke test (Bun)
        if: matrix.runtime == 'bun'
        run: bun smoke/runtime-smoke.ts
      - name: Set up Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.7.14
      - name: Run smoke test (Deno)
        if: matrix.runtime == 'deno'
        run: deno run --allow-net --allow-env --allow-read smoke/runtime-smoke.ts

  node-smoke:
    # Exercise both ESM and CJS so the dual-format publish stays honest. Bun
    # and Deno cover ESM under modern runtimes (above); CJS is Node-only.
    name: Node runtime smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.9 # keep in sync with package.json packageManager
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: sdks/typescript/.nvmrc
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Run smoke test (Node, CJS)
        run: node smoke/runtime-smoke.cjs
      - name: Run smoke test (Node, ESM)
        run: node --import tsx smoke/runtime-smoke.ts
