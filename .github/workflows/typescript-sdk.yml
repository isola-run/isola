name: TypeScript SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdks/typescript/**'
      - '.github/workflows/typescript-sdk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdks/typescript/**'
      - '.github/workflows/typescript-sdk.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: sdks/typescript

jobs:
  test:
    name: TypeScript SDK (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.0.9 # keep in sync with package.json packageManager
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Test with coverage
        run: pnpm test:coverage
      - name: Verify package
        run: pnpm verify-package

  runtime-compat:
    name: ${{ matrix.runtime }} runtime smoke
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.0.9 # keep in sync with package.json packageManager
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: sdks/typescript/.nvmrc
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Run smoke test (Bun)
        if: matrix.runtime == 'bun'
        run: bun smoke/runtime-smoke.ts
      - name: Set up Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.7.14
      - name: Run smoke test (Deno)
        if: matrix.runtime == 'deno'
        run: deno run --allow-net --allow-env --allow-read smoke/runtime-smoke.ts

  node-smoke:
    # Exercise both ESM and CJS so the dual-format publish stays honest. Bun
    # and Deno cover ESM under modern runtimes (above); CJS is Node-only.
    name: Node runtime smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.0.9 # keep in sync with package.json packageManager
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: sdks/typescript/.nvmrc
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Run smoke test (Node, CJS)
        run: node smoke/runtime-smoke.cjs
      - name: Run smoke test (Node, ESM)
        run: node --import tsx smoke/runtime-smoke.ts
