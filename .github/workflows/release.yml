# Isola release workflow. Triggered on tag push (v*)

name: release

on:
  push:
    tags: ['v*']

permissions: {}  # Each job declares its own minimum-necessary permissions.

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/isola-run
  CHART_REPO: ghcr.io/isola-run/charts

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.parse.outputs.version }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Parse tag
        id: parse
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "ERROR: tag '$TAG' does not match ^v[0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?$" >&2
              exit 1
          fi
          VERSION="${TAG#v}"
          IS_PRERELEASE="false"
          if [[ "$TAG" == *-rc.* ]]; then IS_PRERELEASE="true"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Check version alignment
        run: ./hack/check-versions.sh

      - name: Verify tag matches VERSION
        env:
          TAG_VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$TAG_VERSION" != "$FILE_VERSION" ]]; then
              echo "ERROR: tag version ($TAG_VERSION) does not match VERSION file ($FILE_VERSION)." >&2
              echo "A tag must be pushed from a commit where ./hack/bump-version.sh has already been run." >&2
              exit 1
          fi
          echo "OK: tag $GITHUB_REF_NAME aligns with VERSION=$FILE_VERSION"

      - name: Verify CHANGELOG entry exists
        run: |
          FILE="CHANGELOG/${GITHUB_REF_NAME}.md"
          test -s "$FILE" || {
              echo "ERROR: $FILE is missing or empty." >&2
              exit 1
          }
          echo "OK: $FILE present"

  release-images:
    name: Release ${{ matrix.image.name }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: isola-operator
            dockerfile: cmd/operator/Dockerfile
          - name: api-gateway
            dockerfile: cmd/api-gateway/Dockerfile
          - name: sandbox-sidecar
            dockerfile: cmd/sandbox-sidecar/Dockerfile
          - name: isola-snapshot-uploader
            dockerfile: cmd/snapshot-uploader/Dockerfile
          - name: snapshot-mounter
            dockerfile: cmd/snapshot-mounter/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # snapshot-mounter runs apk in the target arch (no cross-compile), so arm64 needs QEMU.
      # The Go Dockerfiles cross-compile via $BUILDPLATFORM and don't.
      - name: Set up QEMU
        if: matrix.image.name == 'snapshot-mounter'
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - name: Set up buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build metadata is sourced from the Makefile so LDFLAGS and OCI labels
      # stay in sync with `make build`. SOURCE_DATE_EPOCH ties BUILD_DATE to
      # the commit timestamp (deterministic across re-runs).
      - name: Compute build metadata
        id: buildmeta
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          make -s print-buildmeta >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: ${{ matrix.image.context || '.' }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.buildmeta.outputs.version }}
            GIT_COMMIT=${{ steps.buildmeta.outputs.commit_short }}
            BUILD_DATE=${{ steps.buildmeta.outputs.build_date }}
            GIT_TREE_STATE=${{ steps.buildmeta.outputs.tree_state }}

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Sign image (cosign keyless)
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ -n "$DIGEST" ]] || { echo "empty digest" >&2; exit 1; }
          cosign sign --yes "$IMAGE@$DIGEST"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.image.name }}.spdx.json
          output-file: ./sbom-${{ matrix.image.name }}.spdx.json
          upload-release-assets: false  # we aggregate in the github-release job

      - name: Attest SBOM (cosign)
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign attest --yes --type spdxjson \
            --predicate "./sbom-${{ matrix.image.name }}.spdx.json" \
            "$IMAGE@$DIGEST"

      - name: Attest build provenance (SLSA via GitHub)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release-chart:
    name: Release Helm chart
    needs: [validate, release-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
        with:
          version: v3.20.2

      # Helm reads ~/.docker/config.json for OCI registry auth, so plain docker login works.
      - name: Log in to ghcr.io
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package chart
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package charts/isola \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist/
          ls -la dist/

      - name: Push chart (capture digest)
        id: push
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eo pipefail
          helm push "dist/isola-${VERSION}.tgz" "oci://${CHART_REPO}" 2>&1 | tee push.log
          CHART_DIGEST=$(awk '/^Digest: /{print $2}' push.log)
          [[ -n "$CHART_DIGEST" ]] || { echo "ERROR: helm push did not report a Digest" >&2; exit 1; }
          echo "digest=$CHART_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Sign chart (cosign keyless)
        env:
          CHART_DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${CHART_REPO}/isola@${CHART_DIGEST}"

      - name: Attest chart build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.CHART_REPO }}/isola
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release-pypi:
    name: Release Python SDK
    needs: [validate, release-chart]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/isola-run
    permissions:
      contents: read
      id-token: write   # OIDC for PyPI Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1

      - name: Build SDK
        working-directory: sdks/python
        run: uv build

      - name: Inspect build output
        run: ls -la sdks/python/dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/
          # Tolerate re-runs after a partial release: PyPI uploads are immutable, so retrying
          # the same version would otherwise fail the workflow with "File already exists".
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: [validate, release-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download SBOM artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8
        with:
          pattern: sbom-*
          path: sboms
          merge-multiple: true

      - name: Build SBOM tarball + checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          tar czf "isola-sboms-${VERSION}.tar.gz" -C sboms .
          sha256sum "isola-sboms-${VERSION}.tar.gz" > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          body_path: CHANGELOG/${{ github.ref_name }}.md
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          files: |
            isola-sboms-${{ needs.validate.outputs.version }}.tar.gz
            checksums.txt
