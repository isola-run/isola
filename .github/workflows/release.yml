# Isola release workflow. Triggered on tag push (v*)

name: release

on:
  push:
    tags: ['v*']

permissions: {}  # Each job declares its own minimum-necessary permissions.

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/isola-run
  CHART_REPO: ghcr.io/isola-run/charts

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.parse.outputs.version }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse tag
        id: parse
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "ERROR: tag '$TAG' does not match ^v[0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?$" >&2
              exit 1
          fi
          VERSION="${TAG#v}"
          IS_PRERELEASE="false"
          if [[ "$TAG" == *-rc.* ]]; then IS_PRERELEASE="true"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Check version alignment
        run: ./hack/check-versions.sh

      - name: Verify tag matches VERSION
        env:
          TAG_VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$TAG_VERSION" != "$FILE_VERSION" ]]; then
              echo "ERROR: tag version ($TAG_VERSION) does not match VERSION file ($FILE_VERSION)." >&2
              echo "A tag must be pushed from a commit where ./hack/bump-version.sh has already been run." >&2
              exit 1
          fi
          echo "OK: tag $GITHUB_REF_NAME aligns with VERSION=$FILE_VERSION"

      - name: Verify CHANGELOG entry exists
        run: |
          FILE="CHANGELOG/${GITHUB_REF_NAME}.md"
          test -s "$FILE" || {
              echo "ERROR: $FILE is missing or empty." >&2
              exit 1
          }
          echo "OK: $FILE present"

  release-images:
    name: Release ${{ matrix.image.name }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: isola-operator
            dockerfile: cmd/operator/Dockerfile
          - name: api-gateway
            dockerfile: cmd/api-gateway/Dockerfile
          - name: sandbox-sidecar
            dockerfile: cmd/sandbox-sidecar/Dockerfile
          - name: isola-snapshot-uploader
            dockerfile: cmd/snapshot-uploader/Dockerfile
          - name: snapshot-mounter
            dockerfile: cmd/snapshot-mounter/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # snapshot-mounter runs apk in the target arch (no cross-compile), so arm64 needs QEMU.
      # The Go Dockerfiles cross-compile via $BUILDPLATFORM and don't.
      - name: Set up QEMU
        if: matrix.image.name == 'snapshot-mounter'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build metadata is sourced from the Makefile so LDFLAGS and OCI labels
      # stay in sync with `make build`. SOURCE_DATE_EPOCH ties BUILD_DATE to
      # the commit timestamp (deterministic across re-runs).
      - name: Compute build metadata
        id: buildmeta
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          make -s print-buildmeta >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.buildmeta.outputs.version }}
            GIT_COMMIT=${{ steps.buildmeta.outputs.commit_short }}
            BUILD_DATE=${{ steps.buildmeta.outputs.build_date }}
            GIT_TREE_STATE=${{ steps.buildmeta.outputs.tree_state }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (cosign keyless)
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ -n "$DIGEST" ]] || { echo "empty digest" >&2; exit 1; }
          cosign sign --yes "$IMAGE@$DIGEST"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ./sbom-${{ matrix.image.name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM (cosign)
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign attest --yes --type spdxjson \
            --predicate "./sbom-${{ matrix.image.name }}.spdx.json" \
            "$IMAGE@$DIGEST"

      - name: Attest build provenance (SLSA via GitHub)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release-chart:
    name: Release Helm chart
    needs: [validate, release-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.20.2

      # Helm reads ~/.docker/config.json for OCI registry auth, so plain docker login works.
      - name: Log in to ghcr.io
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package chart
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package charts/isola \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist/
          ls -la dist/

      - name: Push chart (capture digest)
        id: push
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eo pipefail
          helm push "dist/isola-${VERSION}.tgz" "oci://${CHART_REPO}" 2>&1 | tee push.log
          CHART_DIGEST=$(awk '/^Digest: /{print $2}' push.log)
          [[ -n "$CHART_DIGEST" ]] || { echo "ERROR: helm push did not report a Digest" >&2; exit 1; }
          echo "digest=$CHART_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign chart (cosign keyless)
        env:
          CHART_DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${CHART_REPO}/isola@${CHART_DIGEST}"

      - name: Attest chart build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.CHART_REPO }}/isola
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release-pypi:
    name: Release Python SDK
    needs: [validate, release-chart]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/isola-run
    permissions:
      contents: read
      id-token: write   # OIDC for PyPI Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Disable cache in release: a poisoned cache from a PR run could taint the
          # published wheel. https://docs.zizmor.sh/audits/#cache-poisoning
          enable-cache: false

      - name: Build SDK
        working-directory: sdks/python
        run: uv build

      - name: Inspect build output
        run: ls -la sdks/python/dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: sdks/python/dist/
          # Tolerate re-runs after a partial release: PyPI uploads are immutable, so retrying
          # the same version would otherwise fail the workflow with "File already exists".
          skip-existing: true

  release-npm:
    name: Release TypeScript SDK
    needs: [validate, release-chart]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/@isola-run/sdk
    permissions:
      contents: read
      id-token: write   # OIDC for npm Trusted Publishing
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.9 # keep in sync with package.json packageManager
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: sdks/typescript/.nvmrc
          registry-url: 'https://registry.npmjs.org'
          # Cache disabled: a poisoned PR cache could taint the published tarball
          # (mirrors release-pypi rationale).
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Test with coverage
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - name: Verify package
        run: pnpm verify-package
      # The typescript-sdk workflow only runs on branch pushes/PRs that touch
      # sdks/typescript/**; it does not run on the release tag push. Re-run the
      # runtime smokes here so the tagged artifact is still proven on each runtime.
      - name: Smoke test (Node CJS)
        run: node smoke/runtime-smoke.cjs
      - name: Smoke test (Node ESM)
        run: node --import tsx smoke/runtime-smoke.ts
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Smoke test (Bun)
        run: bun smoke/runtime-smoke.ts
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.7.14
      - name: Smoke test (Deno)
        run: deno run --allow-net --allow-env --allow-read smoke/runtime-smoke.ts
      - name: Publish to npm
        # Publishes via npm OIDC trusted publishing (tokenless). Requires
        # pnpm >= 11.0.7 (11.0.0-11.0.6 had an OIDC regression); provenance is
        # generated automatically under OIDC and --provenance keeps it explicit.
        # NOTE: npm cannot configure a trusted publisher until the package
        # exists, so the first-ever publish must be bootstrapped out-of-band.
        # Prereleases publish under the `next` dist-tag so a bare
        # `npm install @isola-run/sdk` never resolves to an RC.
        env:
          IS_PRERELEASE: ${{ needs.validate.outputs.is_prerelease }}
        run: |
          DIST_TAG=latest
          [[ "$IS_PRERELEASE" == "true" ]] && DIST_TAG=next
          pnpm publish --provenance --access public --no-git-checks --tag "$DIST_TAG"

  github-release:
    name: Create GitHub Release
    needs: [validate, release-pypi, release-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: CHANGELOG/${{ github.ref_name }}.md
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
