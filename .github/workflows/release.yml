# Isola release workflow. Triggered on tag push (v*). Sequential spine:
# validate -> release-images -> release-chart -> render-manifests -> release-pypi -> github-release.
#
# See docs/superpowers/specs/2026-04-17-first-release-design.md §4 for the full design.

name: release

on:
  push:
    tags: ['v*']

permissions: {}  # Each job declares its own minimum-necessary permissions.

# Serialize releases for the same tag (e.g. force-pushed retag while the
# first run is still executing). Per GitHub concurrency docs: with
# cancel-in-progress: false, the in-flight run is NOT cancelled; the
# second run waits as `pending` and executes after the first completes.
# A third trigger would cancel the pending second and take its place
# (the group is capped at 1 running + 1 pending).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/isola-run
  CHART_REPO: ghcr.io/isola-run/charts

jobs:
  # -------------------------------------------------------------------
  # STAGE 1 — validate
  # -------------------------------------------------------------------
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.parse.outputs.version }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Parse tag
        id: parse
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "ERROR: tag '$TAG' does not match ^v[0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?$" >&2
              exit 1
          fi
          VERSION="${TAG#v}"
          IS_PRERELEASE="false"
          if [[ "$TAG" == *-rc.* ]]; then IS_PRERELEASE="true"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Check version alignment
        run: ./hack/check-versions.sh

      - name: Verify tag matches VERSION
        env:
          TAG_VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$TAG_VERSION" != "$FILE_VERSION" ]]; then
              echo "ERROR: tag version ($TAG_VERSION) does not match VERSION file ($FILE_VERSION)." >&2
              echo "A tag must be pushed from a commit where ./hack/bump-version.sh has already been run." >&2
              exit 1
          fi
          echo "OK: tag $GITHUB_REF_NAME aligns with VERSION=$FILE_VERSION"

      - name: Verify CHANGELOG entry exists
        run: |
          FILE="CHANGELOG/${GITHUB_REF_NAME}.md"
          test -s "$FILE" || {
              echo "ERROR: $FILE is missing or empty." >&2
              exit 1
          }
          echo "OK: $FILE present"

  # -------------------------------------------------------------------
  # STAGE 2 — release-images (matrix x 5)
  # -------------------------------------------------------------------
  release-images:
    name: Release ${{ matrix.image.name }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: isola-operator
            dockerfile: cmd/operator/Dockerfile
          - name: api-gateway
            dockerfile: cmd/api-gateway/Dockerfile
          - name: sandbox-sidecar
            dockerfile: cmd/sandbox-sidecar/Dockerfile
          - name: isola-snapshot-uploader
            dockerfile: cmd/snapshot-uploader/Dockerfile
          - name: snapshot-mounter
            dockerfile: cmd/snapshot-mounter/Dockerfile
            context: cmd/snapshot-mounter
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { fetch-depth: 0 }

      - name: Set up QEMU (needed for arm64 cross-build of alpine-based snapshot-mounter; Go Dockerfiles cross-compile natively and don't need QEMU, but setting it here is the simplest correct behavior for the matrix)
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4 (matches cloudnative-pg pin)

      - name: Set up buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build metadata
        id: buildmeta
        run: |
          echo "version=${{ needs.validate.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date --date=@$(git show -s --format=%ct HEAD) -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "commit_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain)" ]; then
              echo "tree_state=clean" >> "$GITHUB_OUTPUT"
          else
              echo "tree_state=dirty" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.validate.outputs.is_prerelease == 'false' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: ${{ matrix.image.context || '.' }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.buildmeta.outputs.version }}
            GIT_COMMIT=${{ steps.buildmeta.outputs.commit_short }}
            BUILD_DATE=${{ steps.buildmeta.outputs.build_date }}
            GIT_TREE_STATE=${{ steps.buildmeta.outputs.tree_state }}

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Sign image (cosign keyless)
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ -n "$DIGEST" ]] || { echo "empty digest" >&2; exit 1; }
          cosign sign --yes "$IMAGE@$DIGEST"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.image.name }}.spdx.json
          output-file: ./sbom-${{ matrix.image.name }}.spdx.json
          upload-release-assets: false  # we aggregate in the github-release job

      - name: Attest SBOM (cosign)
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign attest --yes --type spdxjson \
            --predicate "./sbom-${{ matrix.image.name }}.spdx.json" \
            "$IMAGE@$DIGEST"

      - name: Attest build provenance (SLSA via GitHub)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload SBOM for aggregator
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sbom-${{ matrix.image.name }}
          path: ./sbom-${{ matrix.image.name }}.spdx.json

  # -------------------------------------------------------------------
  # STAGE 3 — release-chart
  # -------------------------------------------------------------------
  release-chart:
    name: Release Helm chart
    needs: [validate, release-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { fetch-depth: 0 }

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5 (matches e2e.yml pin)
        with:
          version: v3.20.2

      - name: Log in to ghcr.io (docker login — Helm reads ~/.docker/config.json)
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package chart
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package charts/isola \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist/
          ls -la dist/

      - name: Push chart (capture digest)
        id: push
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eo pipefail
          helm push "dist/isola-${VERSION}.tgz" "oci://${CHART_REPO}" 2>&1 | tee push.log
          CHART_DIGEST=$(awk '/^Digest: /{print $2}' push.log)
          [[ -n "$CHART_DIGEST" ]] || { echo "ERROR: helm push did not report a Digest" >&2; exit 1; }
          echo "digest=$CHART_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Sign chart (cosign keyless)
        env:
          CHART_DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${CHART_REPO}/isola@${CHART_DIGEST}"

      - name: Attest chart build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.CHART_REPO }}/isola
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # -------------------------------------------------------------------
  # STAGE 4 — render-manifests
  # -------------------------------------------------------------------
  render-manifests:
    name: Render standalone manifests
    needs: [validate, release-chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5 (matches e2e.yml pin)
        with:
          version: v3.20.2

      - name: Install yq
        env:
          # Pin yq to an explicit version (NOT `latest`) for reproducibility
          # and supply-chain hygiene. Bump as needed; verify the sha256 from
          # the mikefarah/yq release notes before updating.
          YQ_VERSION: v4.45.4
          YQ_SHA256: b96de04645707e14a12f52c37e6266832e03c29e95b9b139cddcae7314466e69
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /usr/local/bin/yq" | sha256sum -c -
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Render isola.yaml (full install)
        run: |
          set -euo pipefail
          helm template isola charts/isola \
            --kube-version "1.34.0" \
            --namespace isola-system \
            --set crds.enabled=true --set crds.keep=true \
            > isola.yaml
          sed -i '1{/^---$/d;}' isola.yaml
          test -s isola.yaml

      - name: Render isola.crds.yaml (CRDs only)
        run: |
          set -euo pipefail
          yq 'select(.kind == "CustomResourceDefinition")' isola.yaml > isola.crds.yaml
          sed -i '1{/^---$/d;}' isola.crds.yaml
          test -s isola.crds.yaml

      - name: Upload manifests
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: isola-manifests
          path: |
            isola.yaml
            isola.crds.yaml

  # -------------------------------------------------------------------
  # STAGE 5 — release-pypi
  # -------------------------------------------------------------------
  release-pypi:
    name: Release Python SDK
    needs: [validate, render-manifests]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/isola-run
    permissions:
      contents: read
      id-token: write   # OIDC for PyPI Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1

      - name: Build SDK wheel + sdist
        working-directory: sdks/python
        run: uv build

      - name: Inspect build output
        run: ls -la sdks/python/dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/
          # Tolerate re-runs: if stages 2-4 succeeded and stage 5 or 6 failed
          # mid-flight, the user can re-push the tag. Without this flag, PyPI
          # returns 400 "File already exists" and the release workflow cannot
          # complete without bumping to a new version (PyPI cannot un-upload).
          skip-existing: true

  # -------------------------------------------------------------------
  # STAGE 6 — github-release (aggregator)
  # -------------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    needs: [validate, release-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download SBOM artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8
        with:
          pattern: sbom-*
          path: sboms
          merge-multiple: true

      - name: Download manifests
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8
        with:
          name: isola-manifests
          path: .

      - name: Build SBOM tarball + checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          tar czf "isola-sboms-${VERSION}.tar.gz" -C sboms .
          sha256sum "isola-sboms-${VERSION}.tar.gz" isola.yaml isola.crds.yaml > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          body_path: CHANGELOG/${{ github.ref_name }}.md
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          files: |
            isola-sboms-${{ needs.validate.outputs.version }}.tar.gz
            isola.yaml
            isola.crds.yaml
            checksums.txt
