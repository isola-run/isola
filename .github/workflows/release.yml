# Release workflow - builds and publishes container images to GitHub Container Registry
#
# Triggered on:
#   - Tags matching v* (e.g., v0.1.0, v1.0.0)
#
# Published images:
#   - ghcr.io/isola-run/isola-operator:<tag>
#   - ghcr.io/isola-run/sandbox-sidecar:<tag>
#   - ghcr.io/isola-run/isola-snapshot-uploader:<tag>
#   - ghcr.io/isola-run/api-gateway:<tag>
#   - ghcr.io/isola-run/snapshot-mounter:<tag>
#
# This workflow is intentionally build-only. It does not write back to the
# repository. The Helm chart's appVersion must be bumped in a PR *before* the
# tag is created (see .github/workflows/prepare-release.yml). Release flow:
#   1. Run the "Prepare Release" workflow with the target version.
#   2. Review and merge the PR it opens.
#   3. Tag the merge commit locally and push the tag:
#        git checkout main && git pull
#        git tag -a vX.Y.Z -m "Release vX.Y.Z"
#        git push origin vX.Y.Z
#   4. This workflow then builds and publishes the images.

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/isola-run

jobs:
  release-images:
    name: Build and Push ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: isola-operator
            dockerfile: cmd/operator/Dockerfile
          - name: sandbox-sidecar
            dockerfile: cmd/sandbox-sidecar/Dockerfile
          - name: isola-snapshot-uploader
            dockerfile: cmd/snapshot-uploader/Dockerfile
          - name: api-gateway
            dockerfile: cmd/api-gateway/Dockerfile
          - name: snapshot-mounter
            dockerfile: cmd/snapshot-mounter/Dockerfile
            context: cmd/snapshot-mounter

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context || '.' }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          platforms: linux/amd64,linux/arm64
