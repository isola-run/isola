# Release workflow - builds and publishes container images to GitHub Container Registry
# and creates a GitHub Release with a standalone CRD bundle asset.
#
# Triggered on:
#   - Tags matching v* (e.g., v0.1.0, v1.0.0)
#
# Published images:
#   - ghcr.io/isola-run/isola-operator:<tag>
#   - ghcr.io/isola-run/sandbox-sidecar:<tag>
#   - ghcr.io/isola-run/isola-snapshot-uploader:<tag>
#   - ghcr.io/isola-run/api-gateway:<tag>
#   - ghcr.io/isola-run/snapshot-mounter:<tag>
#
# Release assets:
#   - isola-crds.yaml (standalone CRD bundle for kubectl apply before helm upgrade)

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/isola-run

jobs:
  release-images:
    name: Build and Push ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: isola-operator
            dockerfile: cmd/operator/Dockerfile
          - name: sandbox-sidecar
            dockerfile: cmd/sandbox-sidecar/Dockerfile
          - name: isola-snapshot-uploader
            dockerfile: cmd/snapshot-uploader/Dockerfile
          - name: api-gateway
            dockerfile: cmd/api-gateway/Dockerfile
          - name: snapshot-mounter
            dockerfile: cmd/snapshot-mounter/Dockerfile
            context: cmd/snapshot-mounter

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context || '.' }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          platforms: linux/amd64,linux/arm64

  create-release:
    name: Create Release with CRD Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate CRD bundle
        run: make crd-bundle

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: isola-crds.yaml

  update-chart-versions:
    name: Update Helm Chart appVersion
    runs-on: ubuntu-latest
    needs: [release-images, create-release]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Update Chart.yaml appVersion
        run: |
          VERSION=${GITHUB_REF_NAME#v}  # Strip 'v' prefix

          # Update isola Chart.yaml (unified chart)
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/isola/Chart.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/*/Chart.yaml
          git diff --staged --quiet || git commit -m "chore: update appVersion to ${GITHUB_REF_NAME#v}"
          git push
