# Development values - used by Tilt for local development

operator:
  image:
    registry: ""
    repository: isola-operator
    tag: "dev"
    pullPolicy: IfNotPresent

  sandboxSidecar:
    image:
      registry: ""
      repository: sandbox-sidecar
      tag: "dev"

  logging:
    level: debug
    devMode: true

  sandboxRuntime:
    type: gvisor # alternatively, if gvisor not installed, use clusterDefault

    gvisor:
      runtimeClassName: gvisor
      rootfssnapshot:
        enabled: true
        runsc:
          binaryPath: /usr/local/bin/runsc
          rootDir: /run/containerd/runsc/k8s.io
        uploader:
          image:
            registry: ""
            repository: isola-uploader
            tag: "dev"

        storage:
          bucketUrl: "s3://isola-snapshots?endpoint=http://localstack.localstack.svc.cluster.local:4566&use_path_style=true&region=us-east-1"
          credentials:
            accessKeyId: "test"
            secretAccessKey: "test"
            region: "us-east-1"

        snapshotMounter:
          hostMountPath: /mnt/isola-snapshots
          rclone:
            image:
              registry: docker.io
              repository: rclone/rclone
              tag: "1.69.1"
            vfsCacheMaxSize: "2Gi"
            vfsCacheMaxAge: "1h"
            dirCacheTime: "2s"
          mounter:
            image:
              registry: ""
              repository: snapshot-mounter
              tag: "dev"

apiGateway:
  image:
    registry: ""
    repository: api-gateway
    tag: "dev"
    pullPolicy: IfNotPresent

  logging:
    level: debug
    devMode: true

  service:
    type: NodePort
    nodePort: 30080
