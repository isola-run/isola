---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: sandboxes.sandbox.isola.run
spec:
  group: sandbox.isola.run
  names:
    kind: Sandbox
    listKind: SandboxList
    plural: sandboxes
    shortNames:
    - sb
    singular: sandbox
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Aggregate readiness
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: Reason for Ready condition
      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Sandbox is the Schema for the sandboxes API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Sandbox
            properties:
              activeDeadlineSeconds:
                description: ActiveDeadlineSeconds defines how long the sandbox runs
                  before being shut down
                format: int64
                minimum: 1
                type: integer
              network:
                description: |-
                  Network specifies the network isolation configuration for this sandbox.
                  If not specified, the sandbox has deny-all egress.
                  Network configuration is immutable after sandbox creation.
                properties:
                  allowClusterDNS:
                    description: |-
                      AllowClusterDNS allows DNS queries to cluster DNS (kube-dns/CoreDNS).
                      When true: DNSPolicy=ClusterFirst, adds label isola.run/allow-cluster-dns=true
                      When false: DNSPolicy=None, uses nameservers field or sink (127.0.0.1)
                    type: boolean
                  allowInternetEgress:
                    description: |-
                      AllowInternetEgress allows egress to 0.0.0.0/0 and ::/0 with blocked ranges
                      (private IPs, cloud metadata, etc.) automatically excepted.
                      Adds label isola.run/allow-internet-egress=true to the pod.
                    type: boolean
                  allowedEgressCIDRs:
                    description: |-
                      AllowedEgressCIDRs specifies additional CIDRs the sandbox can reach.
                      Blocked ranges (private IPs, cloud metadata, etc.) are rejected — see ComputeExcept.
                      When allowInternetEgress is true, these CIDRs are already reachable via the static
                      internet policy and do not produce additional NetworkPolicy rules.
                      Creates a custom NetworkPolicy only when allowInternetEgress is false or unset.
                    items:
                      pattern: ^((([0-9]{1,3}\.){3}[0-9]{1,3})/(3[0-2]|[12]?[0-9]))|(([0-9a-fA-F:]+)/([0-9]|[1-9][0-9]|1[01][0-9]|12[0-8]))$
                      type: string
                    type: array
                  nameservers:
                    description: |-
                      Nameservers are DNS server IPs to inject into the pod.
                      When allowClusterDNS=false: These are the only nameservers (or 127.0.0.1 sink if empty).
                      When allowClusterDNS=true: Combined with cluster DNS.
                      When allowInternetEgress is true, nameservers do not produce additional NetworkPolicy rules.
                      MaxItems=3 because Kubernetes allows at most 3 nameservers in pod DNS config.
                    items:
                      type: string
                    maxItems: 3
                    type: array
                    x-kubernetes-validations:
                    - message: must be valid IP addresses
                      rule: self.all(s, isIP(s))
                type: object
              podTemplate:
                description: |-
                  PodTemplate describes the pod that will be created to run the sandbox.
                  The Sandbox controller will override specific security settings (runtimeClassName, etc.)
                  but allows users to define containers, volumes, and env vars.
                x-kubernetes-preserve-unknown-fields: true
              shutdownPolicy:
                description: ShutdownPolicy defines what to do when the sandbox ends
                  (defaults to Delete if unspecified)
                properties:
                  activeDeadlineSeconds:
                    default: 300
                    description: |-
                      ActiveDeadlineSeconds specifies the duration in seconds relative to the startTime
                      that the snapshot job may be active before the system tries to terminate it.
                      Only used when Strategy is SnapshotRootfs.
                    format: int64
                    minimum: 1
                    type: integer
                  strategy:
                    allOf:
                    - enum:
                      - Delete
                      - SnapshotRootfs
                    - enum:
                      - Delete
                      - SnapshotRootfs
                    default: Delete
                    description: Strategy determines the action taken when the sandbox
                      shuts down
                    type: string
                type: object
            required:
            - podTemplate
            type: object
            x-kubernetes-validations:
            - message: network cannot be removed once set
              rule: '!has(oldSelf.network) || has(self.network)'
            - message: network is immutable once set
              rule: '!has(self.network) || !has(oldSelf.network) || self.network ==
                oldSelf.network'
          status:
            description: status defines the observed state of Sandbox
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              podIP:
                description: PodIP is the IP address of the sandbox pod.
                type: string
              timeoutAt:
                description: |-
                  TimeoutAt is the absolute time at which the sandbox should be considered timed out.
                  It is set by the controller (derived from sandbox timeout).
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
