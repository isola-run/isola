---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: sandboxes.sandbox.isola.run
spec:
  group: sandbox.isola.run
  names:
    kind: Sandbox
    listKind: SandboxList
    plural: sandboxes
    shortNames:
    - sb
    singular: sandbox
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Aggregate readiness
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: Reason for Ready condition
      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Sandbox is the Schema for the sandboxes API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Sandbox
            properties:
              network:
                description: |-
                  Network specifies the network isolation configuration for this sandbox.
                  If not specified, the sandbox has deny-all egress.
                  Network configuration is immutable after sandbox creation.
                properties:
                  allowClusterDNS:
                    description: |-
                      AllowClusterDNS allows DNS queries to cluster DNS (kube-dns/CoreDNS).
                      When true: DNSPolicy=ClusterFirst, adds label isola.run/allow-cluster-dns=true
                      When false: DNSPolicy=None, uses nameservers field or sink (127.0.0.1)
                    type: boolean
                  allowIPv6Egress:
                    description: |-
                      AllowIPv6Egress enables IPv6 in egress configuration.
                      When false (default): only IPv4 CIDRs and nameservers are accepted.
                      When true with allowInternetEgress: also enables IPv6 internet egress.
                      When true without allowInternetEgress: allows IPv6 in allowedEgressCIDRs and nameservers.
                    type: boolean
                  allowInternetEgress:
                    description: |-
                      AllowInternetEgress allows egress to 0.0.0.0/0 (and ::/0 when allowIPv6Egress is true)
                      with blocked ranges (private IPs, cloud metadata, etc.) automatically excepted.
                      Adds label isola.run/allow-ipv4-internet-egress=true to the pod.
                    type: boolean
                  allowedEgressCIDRs:
                    description: |-
                      AllowedEgressCIDRs specifies additional CIDRs the sandbox can reach.
                      Blocked ranges (private IPs, cloud metadata, etc.) are rejected.
                      When allowInternetEgress is true, these CIDRs are already reachable via the static
                      internet policy and do not produce additional NetworkPolicy rules.
                      Creates a custom NetworkPolicy only when allowInternetEgress is false or unset.
                    items:
                      maxLength: 43
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-validations:
                    - message: must be valid CIDR notation (e.g. 10.0.0.0/8 or 2001:db8::/32)
                      rule: self.all(s, isCIDR(s))
                  nameservers:
                    description: |-
                      Nameservers are DNS server IPs to inject into the pod.
                      When allowClusterDNS=false and no egress is configured: 127.0.0.1 sink (DNS fails fast).
                      When allowClusterDNS=false and allowInternetEgress or allowedEgressCIDRs is set: public resolvers are auto-injected.
                      When allowClusterDNS=true: Combined with cluster DNS.
                      Explicit nameservers override auto-injection in all cases.
                      When allowInternetEgress is true, nameservers do not produce additional NetworkPolicy rules.
                      MaxItems=3 because Kubernetes allows at most 3 nameservers in pod DNS config.
                    items:
                      type: string
                    maxItems: 3
                    type: array
                    x-kubernetes-validations:
                    - message: must be valid IP addresses
                      rule: self.all(s, isIP(s))
                type: object
                x-kubernetes-validations:
                - message: IPv6 nameservers require allowIPv6Egress to be true
                  rule: '!has(self.nameservers) || (has(self.allowIPv6Egress) && self.allowIPv6Egress
                    == true) || self.nameservers.all(s, ip(s).family() == 4)'
                - message: IPv6 CIDRs require allowIPv6Egress to be true
                  rule: '!has(self.allowedEgressCIDRs) || (has(self.allowIPv6Egress)
                    && self.allowIPv6Egress == true) || self.allowedEgressCIDRs.all(s,
                    cidr(s).ip().family() == 4)'
              podTemplate:
                description: |-
                  PodTemplate describes the pod that will be created to run the sandbox.
                  The Sandbox controller will override specific security settings (runtimeClassName, etc.)
                  but allows users to define containers, volumes, and env vars.
                x-kubernetes-preserve-unknown-fields: true
              rootfsSnapshotSources:
                description: |-
                  RootfsSnapshotSources specifies rootfs snapshots to restore into containers at creation time.
                  Requires gVisor runtime and the snapshot-mounter NFS mount to be running on the node.
                  Only the overlay rootfs upper layer is captured/restored. Files on separately-mounted
                  filesystems (e.g. /tmp, which gVisor mounts as a separate tmpfs) are excluded.
                  Write data to paths on the root filesystem (e.g. /root, /home) to ensure it
                  survives snapshot and restore.
                items:
                  description: RootfsSnapshotSource specifies a rootfs snapshot to
                    restore into a container at creation time.
                  properties:
                    containerName:
                      description: |-
                        ContainerName is the name of the container to apply the rootfs restore to.
                        If omitted and the sandbox has exactly one user container, that container is used.
                        Required when the sandbox has multiple user containers.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    snapshotName:
                      description: |-
                        SnapshotName is the name of the rootfs snapshot to restore from.
                        This matches the snapshotName field from the RootfsSnapshot CR that created it.
                        Must be a valid RFC 1123 DNS label (lowercase alphanumeric and hyphens only).
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                  required:
                  - snapshotName
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: containerName is required when multiple rootfsSnapshotSources
                    are specified
                  rule: self.size() <= 1 || self.all(s, s.containerName != '')
                - message: each rootfsSnapshotSource must target a different container
                  rule: self.size() <= 1 || self.all(i, self.all(j, i == j || i.containerName
                    != j.containerName))
              startupTimeoutSeconds:
                default: 60
                description: |-
                  StartupTimeoutSeconds defines how long the sandbox has to become Ready
                  after pod creation. If the pod hasn't reached Ready within this time,
                  the sandbox is marked as failed.
                format: int64
                minimum: 1
                type: integer
              terminationPolicy:
                description: TerminationPolicy defines what to do when the sandbox
                  ends (defaults to Delete if unspecified)
                properties:
                  snapshotRootfs:
                    description: SnapshotRootfs configures the SnapshotRootfs type.
                    properties:
                      snapshotName:
                        description: |-
                          SnapshotName is the name used for the snapshot storage key.
                          This is the value callers must pass as rootfsSnapshotSources[].snapshotName to restore from this snapshot.
                          Same semantic as RootfsSnapshotSpec.SnapshotName.
                          If omitted, the operator defaults it to the sandbox name.
                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      timeoutSeconds:
                        description: |-
                          TimeoutSeconds specifies the duration in seconds for the snapshot job.
                          If the job does not complete within this time, it will be terminated.
                          Same semantic as RootfsSnapshotSpec.TimeoutSeconds.
                        format: int64
                        minimum: 1
                        type: integer
                    type: object
                  type:
                    allOf:
                    - enum:
                      - Delete
                      - SnapshotRootfs
                    - enum:
                      - Delete
                      - SnapshotRootfs
                    default: Delete
                    description: Type determines the action taken when the sandbox
                      terminates
                    type: string
                type: object
                x-kubernetes-validations:
                - message: snapshotRootfs config is required when type is SnapshotRootfs
                  rule: self.type != 'SnapshotRootfs' || has(self.snapshotRootfs)
                - message: snapshotRootfs config is only valid when type is SnapshotRootfs
                  rule: self.type == 'SnapshotRootfs' || !has(self.snapshotRootfs)
              timeoutSeconds:
                description: TimeoutSeconds defines how long the sandbox runs before
                  being shut down
                format: int64
                minimum: 1
                type: integer
            required:
            - podTemplate
            type: object
            x-kubernetes-validations:
            - message: network cannot be removed once set
              rule: '!has(oldSelf.network) || has(self.network)'
            - message: network is immutable once set
              rule: '!has(self.network) || !has(oldSelf.network) || self.network ==
                oldSelf.network'
            - message: rootfsSnapshotSources cannot be removed once set
              rule: '!has(oldSelf.rootfsSnapshotSources) || has(self.rootfsSnapshotSources)'
            - message: rootfsSnapshotSources is immutable once set
              rule: '!has(self.rootfsSnapshotSources) || !has(oldSelf.rootfsSnapshotSources)
                || self.rootfsSnapshotSources == oldSelf.rootfsSnapshotSources'
            - message: terminationPolicy cannot be removed once set
              rule: '!has(oldSelf.terminationPolicy) || has(self.terminationPolicy)'
            - message: terminationPolicy is immutable once set
              rule: '!has(self.terminationPolicy) || !has(oldSelf.terminationPolicy)
                || self.terminationPolicy == oldSelf.terminationPolicy'
          status:
            description: status defines the observed state of Sandbox
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              podIP:
                description: PodIP is the IP address of the sandbox pod.
                type: string
              terminationDeadlineAt:
                description: |-
                  TerminationDeadlineAt is the absolute time by which the termination policy must complete.
                  Set once by the controller when finalization begins (anchored to DeletionTimestamp).
                format: date-time
                type: string
              timeoutAt:
                description: |-
                  TimeoutAt is the absolute time at which the sandbox should be considered timed out.
                  It is set by the controller (derived from sandbox timeout).
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
