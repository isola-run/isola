{{- if .Values.apiGateway.enabled }}
{{- if .Values.apiGateway.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "isola.apiGateway.serviceAccountName" . }}
  labels:
    {{- include "isola.apiGateway.labels" . | nindent 4 }}
  {{- with .Values.apiGateway.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
