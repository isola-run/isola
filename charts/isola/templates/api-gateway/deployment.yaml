{{- if .Values.apiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "isola.apiGateway.fullname" . }}
  labels:
    {{- include "isola.apiGateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.apiGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "isola.apiGateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "isola.apiGateway.selectorLabels" . | nindent 8 }}
      {{- if or .Values.apiGateway.podAnnotations (and (gt (len .Values.apiGateway.auth.apiKeys) 0) (not .Values.apiGateway.auth.existingSecret)) }}
      annotations:
        {{- with .Values.apiGateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and (gt (len .Values.apiGateway.auth.apiKeys) 0) (not .Values.apiGateway.auth.existingSecret) }}
        checksum/auth-secret: {{ include (print $.Template.BasePath "/api-gateway/credentials.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "isola.apiGateway.serviceAccountName" . }}
      {{- include "isola.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-gateway
          image: {{ include "isola.apiGateway.image" . }}
          imagePullPolicy: {{ .Values.apiGateway.image.pullPolicy }}
          args:
            - "--log-level={{ .Values.apiGateway.logging.level }}"
            {{- if .Values.apiGateway.logging.devMode }}
            - --dev-mode
            {{- end }}
          env:
            - name: ISOLA_SANDBOX_NAMESPACE
              value: {{ include "isola.sandboxNamespace" . | quote }}
            {{- if or .Values.apiGateway.auth.existingSecret (gt (len .Values.apiGateway.auth.apiKeys) 0) }}
            - name: ISOLA_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "isola.apiGateway.authSecretName" . }}
                  key: ISOLA_API_KEYS
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      {{- with .Values.apiGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiGateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiGateway.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
