{{- if .Values.apiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "isola.apiGateway.fullname" . }}
  labels:
    {{- include "isola.apiGateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.apiGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "isola.apiGateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "isola.apiGateway.selectorLabels" . | nindent 8 }}
      {{- with .Values.apiGateway.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "isola.apiGateway.serviceAccountName" . }}
      {{- include "isola.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: {{ include "isola.apiGateway.image" . }}
          imagePullPolicy: {{ .Values.apiGateway.image.pullPolicy }}
          args:
            - -log-level={{ .Values.apiGateway.logging.level }}
            {{- if .Values.apiGateway.logging.devMode }}
            - --dev
            {{- end }}
            {{- if .Values.apiGateway.metrics.enabled }}
            - -metrics-port={{ .Values.apiGateway.metrics.port }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.apiGateway.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.apiGateway.metrics.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          env:
            - name: ISOLA_SANDBOX_NAMESPACE
              value: {{ include "isola.sandboxNamespace" . | quote }}
      {{- with .Values.apiGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiGateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiGateway.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
