{{/*
API Gateway auth credentials secret (release namespace — the gateway's own namespace).
Created when: api-gateway enabled AND inline apiKeys provided AND no auth.existingSecret.
The gateway reads ISOLA_API_KEYS (comma/newline-separated Bearer keys). When unset/empty
it runs UNAUTHENTICATED and warns on every boot, so this Secret is intentionally optional.
*/}}
{{- if and .Values.apiGateway.enabled (gt (len .Values.apiGateway.auth.apiKeys) 0) (not .Values.apiGateway.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "isola.apiGateway.authSecretName" . }}
  labels:
    {{- include "isola.apiGateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  ISOLA_API_KEYS: {{ join "\n" .Values.apiGateway.auth.apiKeys | quote }}
{{- end }}
