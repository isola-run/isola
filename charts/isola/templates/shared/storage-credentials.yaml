{{/*
Storage credentials secrets.
- One in Release.Namespace for API deployment
- One in sandboxNamespace for snapshot jobs (operator passes this name to jobs)
Created only when existingSecret is NOT set AND both accessKeyId/secretAccessKey are provided.
*/}}
{{- if and (not .Values.storage.credentials.existingSecret) .Values.storage.credentials.accessKeyId .Values.storage.credentials.secretAccessKey }}
---
# Secret for API (in release namespace)
{{- if .Values.api.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "isola.fullname" . }}-storage-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "isola.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.storage.credentials.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.storage.credentials.secretAccessKey | quote }}
  {{- if .Values.storage.credentials.region }}
  AWS_REGION: {{ .Values.storage.credentials.region | quote }}
  {{- end }}
{{- end }}
---
# Secret for snapshot jobs (in sandbox namespace)
{{- if .Values.operator.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "isola.fullname" . }}-storage-credentials
  namespace: {{ .Values.sandboxNamespace }}
  labels:
    {{- include "isola.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.storage.credentials.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.storage.credentials.secretAccessKey | quote }}
  {{- if .Values.storage.credentials.region }}
  AWS_REGION: {{ .Values.storage.credentials.region | quote }}
  {{- end }}
{{- end }}
{{- end }}
