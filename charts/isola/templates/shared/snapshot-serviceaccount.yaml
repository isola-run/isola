{{- if .Values.operator.snapshot.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "isola.snapshot.serviceAccountName" . }}
  namespace: {{ .Values.sandboxNamespace }}
  labels:
    {{- include "isola.labels" . | nindent 4 }}
    app.kubernetes.io/component: rootfssnapshot
  {{- with .Values.operator.snapshot.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
