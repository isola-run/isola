{{- if and .Values.gvisor.installer.enabled .Values.gvisor.installer.runtimeClass.create }}
{{/*
  RuntimeClass for sandbox pods. scheduling.nodeSelector is merged into pod
  nodeSelectors at admission, so sandboxes only schedule onto nodes where the
  installer verified a healthy gVisor runtime.
*/}}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ include "isola.operator.runtimeClassName" . }}
  labels:
    {{- include "isola.gvisorInstaller.labels" . | nindent 4 }}
{{- /* quoted: DNS labels like "true" or "on" would otherwise render as YAML booleans */}}
handler: {{ .Values.gvisor.installer.handler | quote }}
scheduling:
  nodeSelector:
    isola.run/gvisor: "true"
{{- end }}
