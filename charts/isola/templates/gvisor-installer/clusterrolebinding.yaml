{{- if .Values.gvisor.autoInstall.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "isola.gvisorInstaller.fullname" . }}
  labels:
    {{- include "isola.gvisorInstaller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "isola.gvisorInstaller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "isola.gvisorInstaller.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
