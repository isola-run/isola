{{- if .Values.gvisor.autoInstall.enabled }}
{{/*
  Base runsc shim configuration installed (with installer-managed additions:
  binary_name, auto-detected systemd-cgroup) to /etc/containerd/isola-runsc.toml
  on each node. Changing it rolls the DaemonSet via the checksum annotation;
  running sandboxes are unaffected (the shim reads it at sandbox start).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "isola.gvisorInstaller.fullname" . }}
  labels:
    {{- include "isola.gvisorInstaller.labels" . | nindent 4 }}
data:
  runsc.toml: |
    [runsc_config]
    {{- range $flag, $value := .Values.gvisor.autoInstall.runscConfig }}
      {{ $flag }} = {{ $value | quote }}
    {{- end }}
{{- end }}
