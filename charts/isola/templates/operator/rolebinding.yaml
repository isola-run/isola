{{- if .Values.operator.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "isola.fullname" . }}-operator-leader-election
  labels:
    {{- include "isola.operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "isola.fullname" . }}-operator-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "isola.operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
