{{- include "isola.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "isola.operator.fullname" . }}
  labels:
    {{- include "isola.operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      {{- include "isola.operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "isola.operator.selectorLabels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.operator.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "isola.operator.serviceAccountName" . }}
      {{- include "isola.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: {{ include "isola.operator.image" . }}
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          command:
            - /operator
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - "--metrics-bind-address=:{{ .Values.operator.metrics.port }}"
            - "--runtime-class={{ include "isola.operator.runtimeClassName" . }}"
            - "--log-level={{ .Values.operator.logging.level }}"
            {{- if .Values.operator.logging.devMode }}
            - --dev-mode
            {{- end }}
            {{- if .Values.operator.sandboxPriorityClassName }}
            - "--priority-class={{ .Values.operator.sandboxPriorityClassName }}"
            {{- end }}
            {{- if eq (include "isola.operator.rootfssnapshotEnabled" .) "true" }}
            - --rootfssnapshot-enabled
            {{- end }}
            {{- $bucketUrl := include "isola.operator.storageBucketUrl" . }}
            {{- if $bucketUrl }}
            - "--rootfssnapshot-bucket-url={{ $bucketUrl }}"
            {{- $credentialSecretName := include "isola.operator.uploaderCredentialSecretName" . }}
            {{- if $credentialSecretName }}
            - "--rootfssnapshot-credential-secret={{ $credentialSecretName }}"
            {{- end }}
            {{- end }}
            - "--rootfssnapshot-service-account={{ include "isola.operator.rootfssnapshotServiceAccountName" . }}"
            - "--gvisor-runsc-path={{ include "isola.operator.gvisorRunscPath" . }}"
            - "--gvisor-runsc-root={{ include "isola.operator.gvisorRunscRoot" . }}"
            {{- $hostMountPath := include "isola.operator.rootfssnapshotHostMountPath" . }}
            {{- if $hostMountPath }}
            - "--rootfssnapshot-host-mount-path={{ $hostMountPath }}"
            {{- end }}
            - "--sidecar-image-pull-policy={{ .Values.operator.sandboxSidecar.image.pullPolicy }}"
            - "--rootfssnapshot-uploader-image-pull-policy={{ .Values.operator.sandboxRuntime.rootfssnapshot.uploader.image.pullPolicy }}"
            {{- $imagePullSecretNames := include "isola.imagePullSecretNames" . }}
            {{- if $imagePullSecretNames }}
            - "--image-pull-secrets={{ $imagePullSecretNames }}"
            {{- end }}
          env:
            - name: ISOLA_SANDBOX_SIDECAR_IMAGE
              value: "{{ include "isola.operator.sandboxSidecarImage" . }}"
            - name: ISOLA_UPLOADER_IMAGE
              value: "{{ include "isola.operator.uploaderImage" . }}"
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.operator.metrics.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
