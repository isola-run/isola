apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "isola.operator.fullname" . }}
  labels:
    {{- include "isola.operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "isola.operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "isola.operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
