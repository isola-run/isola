{{- if and (eq (include "isola.operator.rootfssnapshotEnabled" .) "true") (.Values.operator.sandboxRuntime.rootfssnapshot.uploader.serviceAccount.create) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "isola.operator.rootfssnapshotServiceAccountName" . }}
  namespace: {{ include "isola.sandboxNamespace" . }}
  labels:
    {{- include "isola.rootfssnapshot.labels" . | nindent 4 }}
  {{- with .Values.operator.sandboxRuntime.rootfssnapshot.uploader.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
