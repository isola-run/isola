{{- if and (eq .Values.operator.sandboxRuntime.type "gvisor") (.Values.operator.sandboxRuntime.gvisor.rootfssnapshot.serviceAccount.create) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "isola.operator.rootfssnapshotServiceAccountName" . }}
  namespace: {{ include "isola.sandboxNamespace" . }}
  labels:
    {{- include "isola.rootfssnapshot.labels" . | nindent 4 }}
  {{- with .Values.operator.sandboxRuntime.gvisor.rootfssnapshot.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
