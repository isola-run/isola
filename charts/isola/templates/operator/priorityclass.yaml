{{- if .Values.operator.priorityClassName }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.operator.priorityClassName }}
  labels:
    {{- include "isola.operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
value: 900000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "High priority for sandbox pods to prevent preemption"
{{- end }}
