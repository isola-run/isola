# Default deny policy for all sandbox pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "isola.fullname" . }}-sandbox-default-deny
  namespace: {{ include "isola.sandboxNamespace" . }}
  labels:
    {{- include "isola.sandbox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      isola.run/sandbox: "true"
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
