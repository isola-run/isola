# Allow internet egress for sandbox pods with isola.run/allow-internet-egress=true label
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-allow-internet-egress
  namespace: {{ include "isola.sandboxNamespace" . }}
  labels:
    {{- include "isola.operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
spec:
  podSelector:
    matchLabels:
      isola.run/allow-internet-egress: "true"
  policyTypes:
    - Egress
  egress:
    # IPv4 internet with private ranges excepted
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8         # RFC 1918: Class A private
              - 100.64.0.0/10      # RFC 6598: Carrier-grade NAT
              - 169.254.0.0/16     # RFC 3927: Link-local (cloud metadata)
              - 172.16.0.0/12      # RFC 1918: Class B private
              - 192.168.0.0/16     # RFC 1918: Class C private
              - 198.18.0.0/15      # RFC 2544: Benchmark testing
              - 240.0.0.0/4        # RFC 1112: Reserved (Class E)
              - 34.118.224.0/20    # GKE-managed Service ClusterIP range
              - 224.0.0.0/4        # RFC 1112: Multicast
              - 192.0.0.0/24       # RFC 6890: IETF Protocol Assignments
              - 192.0.2.0/24       # RFC 5737: Documentation (TEST-NET-1)
              - 192.88.99.0/24     # RFC 7526: 6to4 Relay Anycast (deprecated)
              - 198.51.100.0/24    # RFC 5737: Documentation (TEST-NET-2)
              - 203.0.113.0/24     # RFC 5737: Documentation (TEST-NET-3)
              - 168.63.129.16/32   # Azure: Wire Server
    # IPv6 internet with private ranges excepted
    - to:
        - ipBlock:
            cidr: ::/0
            except:
              - fc00::/7           # RFC 4193: Unique Local Address (ULA)
              - fe80::/10          # RFC 4291: Link-local
              - 2600:2d00:0:4::/64 # GKE-managed Service IPv6 range
              - ff00::/8           # Multicast
              - "::ffff:0:0/96"      # RFC 4291: IPv4-mapped address
              - 64:ff9b:1::/48       # RFC 8215: NAT64 local-use prefix
              - 100::/64             # RFC 6666: Discard-Only prefix
              - 100:0:0:1::/64       # RFC 9780: Dummy IPv6 Prefix
              - 2001::/32            # RFC 4380: Teredo
              - 2001:2::/48          # RFC 5180: Benchmarking
              - 2001:10::/28         # RFC 4843: ORCHID
              - 2001:db8::/32        # RFC 3849: Documentation
              - 2002::/16            # RFC 3056: 6to4
              - 3fff::/20            # RFC 9637: Documentation prefix
              - 5f00::/16            # RFC 9602: SRv6 SIDs
              - 2600:2d00:0:2::/63   # GCP: Cloud Router Next Hop
