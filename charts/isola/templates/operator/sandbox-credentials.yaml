{{/*
Storage credentials secret for snapshot jobs.
Created only when existingSecret is NOT set AND both accessKeyId/secretAccessKey are provided.
*/}}
{{- $existingSecret := .Values.operator.snapshot.storage.credentials.existingSecret -}}
{{- $accessKeyId := .Values.operator.snapshot.storage.credentials.accessKeyId -}}
{{- $secretAccessKey := .Values.operator.snapshot.storage.credentials.secretAccessKey -}}
{{- $region := .Values.operator.snapshot.storage.credentials.region -}}
{{- if and (not $existingSecret) $accessKeyId $secretAccessKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "isola.operator.fullname" . }}-snapshot-credentials
  namespace: {{ include "isola.sandboxNamespace" . }}
  labels:
    {{- include "isola.operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: rootfssnapshot
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ $accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $secretAccessKey | quote }}
  {{- if $region }}
  AWS_REGION: {{ $region | quote }}
  {{- end }}
{{- end }}
