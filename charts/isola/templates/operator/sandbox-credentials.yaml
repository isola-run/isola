{{/*
Snapshot-uploader credentials secret (sandbox namespace).
Created when: no uploader.existingSecret AND chart-managed credentials are provided.
S3: gocloud.dev reads AWS SDK env vars. Azure: gocloud.dev reads Azure SDK env vars.
GCS: no chart-managed credentials (use existingSecret or workload identity).
*/}}
{{- if eq (include "isola.operator.rootfssnapshotEnabled" .) "true" -}}
{{- $uploader := .Values.operator.sandboxRuntime.gvisor.rootfssnapshot.uploader -}}
{{- $storage := .Values.operator.sandboxRuntime.gvisor.rootfssnapshot.storage -}}
{{- if and (not $uploader.existingSecret) (eq (include "isola.operator.hasChartManagedCredentials" .) "true") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "isola.operator.uploaderCredentialSecretName" . }}
  namespace: {{ include "isola.sandboxNamespace" . }}
  labels:
    {{- include "isola.rootfssnapshot.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq $storage.type "s3" }}
  AWS_ACCESS_KEY_ID: {{ $storage.s3.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $storage.s3.secretAccessKey | quote }}
  {{- if $storage.s3.region }}
  AWS_REGION: {{ $storage.s3.region | quote }}
  {{- end }}
  {{- else if eq $storage.type "azure" }}
  AZURE_STORAGE_ACCOUNT: {{ $storage.azure.storageAccount | quote }}
  AZURE_STORAGE_KEY: {{ $storage.azure.accountKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
