{{/*
Mounter credentials secret (release namespace).
Created when: no snapshotMounter.existingSecret AND chart-managed credentials are provided.
Uses rclone-native env vars (not AWS/AZURE SDK env vars).
*/}}
{{- if eq (include "isola.operator.rootfssnapshotEnabled" .) "true" -}}
{{- $mounter := .Values.operator.sandboxRuntime.rootfssnapshot.snapshotMounter -}}
{{- $storage := .Values.operator.sandboxRuntime.rootfssnapshot.storage -}}
{{- if and (not $mounter.existingSecret) (eq (include "isola.operator.hasChartManagedCredentials" .) "true") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "isola.operator.mounterCredentialSecretName" . }}
  labels:
    {{- include "isola.snapshotMounter.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq $storage.type "s3" }}
  RCLONE_S3_ACCESS_KEY_ID: {{ $storage.s3.accessKeyId | quote }}
  RCLONE_S3_SECRET_ACCESS_KEY: {{ $storage.s3.secretAccessKey | quote }}
  {{- if $storage.s3.region }}
  RCLONE_S3_REGION: {{ $storage.s3.region | quote }}
  {{- end }}
  {{- else if eq $storage.type "azure" }}
  RCLONE_AZUREBLOB_ACCOUNT: {{ $storage.azure.storageAccount | quote }}
  RCLONE_AZUREBLOB_KEY: {{ $storage.azure.accountKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
