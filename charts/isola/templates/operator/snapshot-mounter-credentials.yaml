{{/*
Storage credentials secret for the snapshot-mounter DaemonSet (release namespace).
Mirrors sandbox-credentials.yaml because Secrets are namespace-scoped and the
DaemonSet runs in the release namespace while uploader jobs run in the sandbox namespace.
Created only when existingSecret is NOT set AND both accessKeyId/secretAccessKey are provided.
*/}}
{{- if eq (include "isola.operator.rootfssnapshotEnabled" .) "true" -}}
{{- $creds := .Values.operator.sandboxRuntime.gvisor.rootfssnapshot.storage.credentials -}}
{{- if and (not $creds.existingSecret) $creds.accessKeyId $creds.secretAccessKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "isola.operator.rootfssnapshotCredentialSecretName" . }}
  labels:
    {{- include "isola.labels" . | nindent 4 }}
    app.kubernetes.io/component: snapshot-mounter
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ $creds.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $creds.secretAccessKey | quote }}
  {{- if $creds.region }}
  AWS_REGION: {{ $creds.region | quote }}
  {{- end }}
{{- end }}
{{- end }}
