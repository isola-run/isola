{{- if and (eq (include "isola.operator.rootfssnapshotEnabled" .) "true") (.Values.operator.sandboxRuntime.gvisor.rootfssnapshot.snapshotMounter.serviceAccount.create) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "isola.operator.snapshotMounterServiceAccountName" . }}
  labels:
    {{- include "isola.labels" . | nindent 4 }}
    app.kubernetes.io/component: snapshot-mounter
  {{- with .Values.operator.sandboxRuntime.gvisor.rootfssnapshot.snapshotMounter.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
