{{- if .Values.identitySigner.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "isola.identitySigner.fullname" . }}
  labels:
    {{- include "isola.identitySigner.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.identitySigner.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "isola.identitySigner.selectorLabels" . | nindent 4 }}
{{- end }}
