{{- if .Values.identitySigner.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "isola.identitySigner.fullname" . }}
  labels:
    {{- include "isola.identitySigner.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.identitySigner.replicaCount }}
  selector:
    matchLabels:
      {{- include "isola.identitySigner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "isola.identitySigner.selectorLabels" . | nindent 8 }}
      {{- with .Values.identitySigner.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "isola.identitySigner.serviceAccountName" . }}
      {{- include "isola.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity-signer
          image: {{ include "isola.identitySigner.image" . }}
          imagePullPolicy: {{ .Values.identitySigner.image.pullPolicy }}
          args:
            - "--log-level={{ .Values.identitySigner.logging.level }}"
            {{- if .Values.identitySigner.logging.devMode }}
            - --dev-mode
            {{- end }}
          env:
            - name: ISOLA_SANDBOX_NAMESPACE
              value: {{ include "isola.sandboxNamespace" . | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.identitySigner.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.identitySigner.resources | nindent 12 }}
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      {{- with .Values.identitySigner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.identitySigner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.identitySigner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
