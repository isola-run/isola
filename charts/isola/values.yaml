# Optionally override the chart name
nameOverride: ""
# Optionally override the full release name
fullnameOverride: ""


# CRD installation and lifecycle configuration.
crds:
  # Whether to install CRDs as part of the chart.
  # Set to false if CRDs are managed externally (e.g., applied via kubectl).
  enabled: true
  # When true, CRDs are annotated with "helm.sh/resource-policy: keep" so they
  # survive `helm uninstall`. Strongly recommended to prevent accidental deletion
  # of all Sandbox and RootfsSnapshot resources when uninstalling the chart.
  keep: true


global:
  # Override registry for all images (operator, sandbox-sidecar, snapshot-uploader, api-gateway)
  # Useful for air-gapped environments or private registries.
  # Example: "my-registry.example.com/isola"
  imageRegistry: ""

  # Image pull secrets applied to all pods
  # Example: [{ name: "my-registry-secret" }]
  imagePullSecrets: []


# Namespace where sandbox pods are created. The api-gateway would create sandboxes in this namespace.
# Note: sandboxes manually created outside this namespace won't enjoy full functionality like the isola network policies.
sandboxNamespace:
  name: isola-sandboxes
  # Set to true to have the chart create it (note: if true, helm uninstall will cascade-delete
  # the namespace and everything inside it).
  create: false


operator:
  image:
    registry: ghcr.io/isola-run
    repository: isola-operator
    tag: ""  # Defaults to Chart.appVersion
    digest: ""  # If set, takes precedence over tag (e.g., sha256:abc123...)
    pullPolicy: IfNotPresent

  replicaCount: 1

  metrics:
    # The container port for the Prometheus metrics endpoint.
    port: 8080
    service:
      type: ClusterIP
      nodePort: null

  resources:
    requests:
      cpu: 50m
      memory: 128Mi

  serviceAccount:
    create: true
    name: ""
    annotations: {}

  logging:
    level: info
    devMode: false

  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}

  # Sandbox sidecar image injected into sandbox pods to facilitate control
  # from api-gateway to the sandbox (e.g. exec commands, copy files).
  #
  # IMPORTANT: the sidecar image MUST correspond to the same build as the
  # isola-operator image above. The operator and sandbox-sidecar are released
  # together, and the operator records its own version as
  # Sandbox.Status.SidecarVersion at pod creation time as a proxy for the
  # sidecar build. If you override these values to point at different builds
  # (e.g. operator 1.3 with sandbox-sidecar 1.2), Status.SidecarVersion will
  # lie and any future capability checks based on it will make wrong decisions
  # for running sandboxes. Only override registry/digest to pin specific
  # mirrors or digests of the same version that ships with this chart.
  sandboxSidecar:
    image:
      registry: ghcr.io/isola-run
      repository: sandbox-sidecar
      tag: ""  # Defaults to Chart.appVersion
      digest: ""  # If set, takes precedence over tag (e.g., sha256:abc123...)
      pullPolicy: IfNotPresent

  # Sandbox runtime configuration
  sandboxRuntime:
    # Kubernetes RuntimeClass name set on sandbox pods (pod.spec.runtimeClassName).
    # Must reference a gVisor/runsc RuntimeClass in your cluster (kubectl get
    # runtimeclass). With gvisor.autoInstall enabled, the chart creates this
    # RuntimeClass and installs gVisor on the nodes for you.
    runtimeClassName: gvisor

    # Rootfs snapshot capability for gVisor sandboxes
    # Allows creating point-in-time rootfs snapshots of sandbox container filesystems.
    #
    # Disabled by default because it requires cloud storage bucket configuration.
    # Enable and configure storage below to use rootfs snapshots.
    #
    # SECURITY NOTE: RootfsSnapshot jobs require privileged operations:
    # - hostPath mount of runsc binary and state directory
    # - hostPID: true to verify sandbox is running
    # - Root user in snapshotter init container
    rootfssnapshot:
      enabled: false

      # gVisor/runsc paths for rootfs snapshot operations
      # These paths must match your cluster's gVisor installation
      runsc:
        # Path to runsc on the node. Leave empty for the automatic default:
        # <gvisor.autoInstall.installDir>/runsc when gVisor auto-install is
        # enabled, /usr/local/bin/runsc otherwise.
        binaryPath: ""
        rootDir: /run/containerd/runsc/k8s.io

      # RootfsSnapshot storage configuration
      # Selects the cloud storage provider and bucket for snapshot uploads.
      #
      # Three credential modes (per provider):
      #   1. Workload identity (recommended): Leave inline credentials and existingSecret empty.
      #      Configure serviceAccount annotations for IRSA/GKE WI/Azure WI.
      #   2. Existing secret: Set uploader.existingSecret and/or snapshotMounter.existingSecret
      #   3. Chart-managed: Provide inline credentials in the provider block (S3 and Azure)
      storage:
        # Provider type selector: "s3", "gcs", "azure"
        # Must be set when rootfssnapshot is enabled.
        type: ""

        s3:
          bucket: ""
          region: ""
          # Custom S3 endpoint. Only needed for S3-compatible stores (MinIO, LocalStack, etc.).
          # AWS S3 resolves endpoints automatically from region.
          endpoint: ""
          # Force path-style S3 URLs (bucket in path, not subdomain).
          # Required for MinIO, LocalStack, and most S3-compatible stores.
          forcePathStyle: false
          # Chart-managed S3 credentials (creates secrets in both namespaces).
          accessKeyId: ""
          secretAccessKey: ""

        gcs:
          bucket: ""
          # GCS uses JSON service account key files that don't fit as inline YAML values.
          # Use existingSecret or workload identity (GKE Workload Identity).

        azure:
          container: ""
          # Storage account name (required for Azure, even with workload identity).
          storageAccount: ""
          # Storage account access key (from Azure Portal > Storage account > Access keys).
          # Leave empty to use workload identity or existingSecret.
          accountKey: ""

      # Uploader job configuration (runs in sandbox namespace, needs write access)
      uploader:
        image:
          registry: ghcr.io/isola-run
          repository: isola-snapshot-uploader
          tag: ""  # Defaults to Chart.appVersion
          digest: ""  # If set, takes precedence over tag (e.g., sha256:abc123...)
          pullPolicy: IfNotPresent
        # Pre-existing secret in the sandbox namespace.
        # Takes precedence over chart-managed credentials.
        existingSecret: ""
        serviceAccount:
          create: true
          name: ""
          annotations: {}  # For IRSA/Workload Identity

      # Isola snapshot mounter DaemonSet configuration.
      # When rootfssnapshot is enabled, a DaemonSet is deployed on each node
      # running rclone as an NFSv3 server with a kernel NFS mount, making
      # snapshot tars available for gVisor rootfs restore.
      #
      # Host prerequisites:
      #   - NFS client kernel support (CONFIG_NFS_FS). Built-in on all major
      #     managed K8s node images (EKS, GKE, AKS) and required by NFS CSI
      #     drivers (EFS, Filestore, Azure Files).
      #
      # Cleanup on uninstall:
      #   The NFS mount is intentionally NOT unmounted on pod termination for restarts resiliency.
      #   After `helm uninstall`, it is possible to it clean it up on each node:
      #     umount /mnt/isola-snapshots; rm -rf /var/cache/isola-snapshots
      snapshotMounter:
        # Host path where snapshots are NFS-mounted (readable by runsc on the node)
        hostMountPath: /mnt/isola-snapshots

        # Port for the rclone NFS server on the host loopback (127.0.0.1).
        # Uses hostNetwork, so this port must not conflict with other services.
        nfsPort: 12049

        # Pre-existing secret in the release namespace.
        # Takes precedence over chart-managed credentials.
        existingSecret: ""

        # ServiceAccount for the snapshot-mounter DaemonSet.
        # Separate from the snapshot job SA because they run in different namespaces
        # (release namespace vs sandbox namespace).
        # For IRSA/Workload Identity, this SA needs read-only access to the bucket.
        serviceAccount:
          create: true
          name: ""
          annotations: {}  # For IRSA/Workload Identity

        # rclone NFS server configuration
        rclone:
          image:
            registry: docker.io
            repository: rclone/rclone
            tag: "1.74.0"
            digest: ""  # If set, takes precedence over tag (e.g., sha256:abc123...)
            pullPolicy: IfNotPresent

          # How long to cache directory listings (--dir-cache-time).
          # Lower values detect new snapshots faster but increase cloud API calls.
          dirCacheTime: "1m"

          resources:
            requests:
              cpu: 50m
              memory: 128Mi

        # Privileged mounter container (creates NFS mount with Bidirectional
        # propagation). Purpose-built image with nfs-utils for mount.nfs.
        mounter:
          image:
            registry: ghcr.io/isola-run
            repository: snapshot-mounter
            tag: ""  # Defaults to Chart.appVersion
            digest: ""  # If set, takes precedence over tag (e.g., sha256:abc123...)
            pullPolicy: IfNotPresent
          resources: {}

        podAnnotations: {}
        nodeSelector: {}
        tolerations: []

  # PriorityClassName for sandbox pods
  sandboxPriorityClassName: ""


gvisor:
  # Automatic per-node gVisor (runsc) installation via a privileged DaemonSet.
  #
  # When enabled, the gvisor-installer DaemonSet downloads the pinned gVisor
  # release (sha512-verified) onto each eligible node, registers a containerd
  # runtime handler for it, restarts containerd once on first install (running
  # containers are unaffected), and labels the node isola.run/gvisor=true after
  # verifying the runtime is healthy. A RuntimeClass gated on that label is
  # created so sandbox pods only schedule onto nodes that are actually ready.
  #
  # Scope and safety:
  #   - Requires nodes with a standard containerd setup (config at
  #     /etc/containerd/config.toml, systemd). kind, kubeadm, EKS, AKS and GKE
  #     Ubuntu nodes qualify. k3s/RKE2/MicroK8s/k0s manage containerd config
  #     differently and are detected and skipped with a clear node event.
  #   - Nodes that already have a runsc handler (installed by other means) are
  #     left completely untouched and labeled ready with version "unmanaged".
  #   - containerd config edits are confined to a marker-delimited block; the
  #     pristine config is backed up once to /etc/containerd/config.toml.isola-orig,
  #     every change is validated before containerd is restarted, and rolled
  #     back automatically if containerd does not come back healthy.
  #   - Version upgrades replace binaries atomically and do NOT restart
  #     containerd: running sandboxes keep the old version until they restart,
  #     new sandboxes use the new one.
  #   - Uninstalling the chart intentionally leaves gVisor on the nodes
  #     (removing a runtime under running sandboxes breaks them). Manual
  #     cleanup per node: remove the marker-delimited block from
  #     /etc/containerd/config.toml (or restore the .isola-orig backup),
  #     delete /etc/containerd/isola-runsc.toml and the installDir, restart
  #     containerd, and remove the isola.run/gvisor* node labels.
  #   - Exclude individual nodes by labeling them isola.run/gvisor-install=disabled.
  #
  # Pod Security Admission: the DaemonSet is privileged. If PSA is enforced on
  # the release namespace, label it pod-security.kubernetes.io/enforce=privileged.
  autoInstall:
    enabled: false

    # gVisor release to install (https://gvisor.dev/docs/user_guide/install/).
    # Must be a dated release, not "latest". This default is updated
    # periodically with isola releases.
    version: "20260608.0"

    # Release artifacts are fetched from <downloadURLBase>/<version>/<arch>/.
    # Override for mirrors or air-gapped environments.
    downloadURLBase: "https://storage.googleapis.com/gvisor/releases/release"

    # containerd runtime handler name to register (also used as the
    # RuntimeClass handler). Change it only to run isola's gVisor alongside an
    # unrelated pre-existing "runsc" handler. Note: the operator's rootfs
    # snapshot feature requires the handler to be "runsc" or "gvisor".
    handler: runsc

    # Host directory for the runsc and containerd-shim-runsc-v1 binaries.
    # Deliberately isola-owned (not /usr/local/bin) so gVisor installations
    # managed by other means are never overwritten.
    installDir: /opt/isola/bin

    # runsc flags written to the shim config on each node
    # ([runsc_config] in /etc/containerd/isola-runsc.toml); the shim passes
    # them to every runsc invocation. Values must be strings.
    # systemd-cgroup is auto-detected from the node's runc configuration
    # unless set here explicitly.
    runscConfig:
      # Required for isola rootfs snapshot restore.
      allow-rootfs-tar-annotation: "true"

    runtimeClass:
      # Create the RuntimeClass (named operator.sandboxRuntime.runtimeClassName,
      # with the handler above), restricted via scheduling.nodeSelector to
      # nodes where installation succeeded. Set to false if the RuntimeClass
      # already exists in the cluster.
      create: true

    image:
      registry: ghcr.io/isola-run
      repository: gvisor-installer
      tag: ""  # Defaults to Chart.appVersion
      digest: ""  # If set, takes precedence over tag (e.g., sha256:abc123...)
      pullPolicy: IfNotPresent

    logging:
      level: info
      devMode: false

    resources:
      requests:
        cpu: 10m
        memory: 32Mi

    # The installer must run on every node that may host sandbox pods.
    # Restrict it (and thereby gVisor) to a dedicated pool if desired.
    nodeSelector:
      kubernetes.io/os: linux
    # Tolerate everything by default so dedicated/tainted sandbox node pools
    # are covered.
    tolerations:
      - operator: Exists
    podAnnotations: {}
    priorityClassName: system-node-critical


serviceMonitor:
  # Specifies whether a ServiceMonitor should be created.
  enabled: false
  # Additional labels for the ServiceMonitor (e.g. for Prometheus selector matching).
  additionalLabels: {}


apiGateway:
  # The apiGateway installation could be skipped,
  # though it is not recommended as it provides control
  # functionality over the sandboxes (proxies file copies, exec commands, etc)
  enabled: true

  image:
    registry: ghcr.io/isola-run
    repository: api-gateway
    tag: ""  # Defaults to Chart.appVersion
    digest: ""  # If set, takes precedence over tag (e.g., sha256:abc123...)
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 10m
      memory: 64Mi

  serviceAccount:
    create: true
    name: ""
    annotations: {}

  logging:
    level: info
    devMode: false

  service:
    type: ClusterIP
    nodePort: null
    annotations: {}

  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
