# Isola Helm Chart
#
# Deploys the complete Isola sandbox orchestration stack:
#   - Operator: Manages sandbox lifecycle, CRDs, network policies
#   - API Gateway: REST API for programmatic sandbox control

# Override the chart name
nameOverride: ""
# Override the full release name
fullnameOverride: ""

# =============================================================================
# Global Settings
# =============================================================================

global:
  # Override registry for all images (operator, sidecar, uploader, api-gateway)
  # Useful for air-gapped environments or private registries.
  # Example: "my-registry.example.com/isola"
  imageRegistry: ""

  # Image pull secrets applied to all pods
  # Example: [{ name: "my-registry-secret" }]
  imagePullSecrets: []

# Namespace where sandbox pods are created
sandboxNamespace: isola-sandboxes

# Whether to create the sandbox namespace (set to false if it already exists)
createSandboxNamespace: true

# =============================================================================
# Operator
# =============================================================================

operator:
  # Operator image configuration
  image:
    registry: ghcr.io/isola-ai
    repository: isola-operator
    tag: ""  # Defaults to Chart.appVersion
    digest: ""  # If set, takes precedence over tag (e.g., sha256:abc123...)
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 50m
      memory: 128Mi

  # ServiceAccount for the operator
  serviceAccount:
    create: true
    name: ""
    annotations: {}

  # Pod scheduling
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}

  # Sidecar image injected into sandbox pods
  sidecar:
    image:
      registry: ghcr.io/isola-ai
      repository: sandbox-sidecar
      tag: ""  # Defaults to Chart.appVersion
      digest: ""  # If set, takes precedence over tag (e.g., sha256:abc123...)

  # RuntimeClassName for sandbox pods
  # Use "gvisor" for production (stronger isolation)
  # Use "" for development without gVisor installed
  runtimeClassName: "gvisor"

  # PriorityClassName for sandbox pods
  # Creates a PriorityClass with this name. Leave empty to use cluster default.
  priorityClassName: "isola-sandbox"

  # Snapshot configuration
  snapshot:
    uploader:
      image:
        registry: ghcr.io/isola-ai
        repository: isola-uploader
        tag: ""  # Defaults to Chart.appVersion
        digest: ""  # If set, takes precedence over tag (e.g., sha256:abc123...)

    # Storage configuration for snapshot uploads
    storage:
      # Bucket URL (required for snapshotting to work)
      # Examples:
      #   s3://bucket-name?region=us-east-1 (AWS S3)
      #   s3://bucket-name?endpoint=http://localstack:4566&use_path_style=true (LocalStack/MinIO)
      #   gs://bucket-name (Google Cloud Storage)
      #   azblob://container-name (Azure Blob Storage)
      bucketUrl: ""

      # Credentials - three modes:
      #   1. Pod/Workload Identity: Leave all empty (recommended)
      #   2. Existing Secret: Set existingSecret
      #   3. Chart-managed: Provide accessKeyId/secretAccessKey (dev only)
      credentials:
        existingSecret: ""
        accessKeyId: ""
        secretAccessKey: ""
        region: ""

    # ServiceAccount for snapshot jobs
    serviceAccount:
      create: true
      name: "isola-snapshot-job"
      annotations: {}  # For IRSA/Workload Identity

# =============================================================================
# API Gateway
# =============================================================================

apiGateway:
  # Enable/disable the API gateway
  enabled: true

  # API gateway image configuration
  image:
    registry: ghcr.io/isola-ai
    repository: api-gateway
    tag: ""  # Defaults to Chart.appVersion
    digest: ""  # If set, takes precedence over tag (e.g., sha256:abc123...)
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 10m
      memory: 64Mi

  # Service configuration
  service:
    type: ClusterIP
    nodePort: null

  # Logging configuration
  logging:
    level: info
    devMode: false

  # ServiceAccount for the API gateway
  serviceAccount:
    create: true
    name: ""
    annotations: {}

  # Pod scheduling
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
