# Optionally override the chart name
nameOverride: ""
# Optionally override the full release name
fullnameOverride: ""


global:
  # Override registry for all images (operator, sidecar, uploader, api-gateway)
  # Useful for air-gapped environments or private registries.
  # Example: "my-registry.example.com/isola"
  imageRegistry: ""

  # Image pull secrets applied to all pods
  # Example: [{ name: "my-registry-secret" }]
  imagePullSecrets: []


# Namespace where sandbox pods are created
sandboxNamespace: isola-sandboxes

# Whether to create the sandbox namespace (set to false if it already exists).
# The sandbox namespace is different from the namespace this helm charts installs
# the isola system components to (operator, api-gateway), and is used to orchestrate
# the sandboxes and related resource in.
createSandboxNamespace: true


operator:
  image:
    registry: ghcr.io/isola-ai
    repository: isola-operator
    tag: ""  # Defaults to Chart.appVersion
    digest: ""  # If set, takes precedence over tag (e.g., sha256:abc123...)
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 50m
      memory: 128Mi

  serviceAccount:
    create: true
    name: ""
    annotations: {}

  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}

  # Sidecar image injected into sandbox pods to facilitate control
  # from api-gateway to the sandbox (e.g. exec commands, copy files)
  sidecar:
    image:
      registry: ghcr.io/isola-ai
      repository: sandbox-sidecar
      tag: ""  # Defaults to Chart.appVersion
      digest: ""  # If set, takes precedence over tag (e.g., sha256:abc123...)

  # RuntimeClassName for sandbox pods (not operator, leave empty for cluste default)
  # - "gvisor": Requires RuntimeClass to exist (stronger isolation, production)
  #   Provides strong isolation and advanced features like rootfs snapshotting.
  #   Isola tests against and develops features for this runtime (or any runsc-based runtime).
  # - "": Uses cluster default runtime (no gVisor required, development)
  sandboxRuntimeClassName: "gvisor"

  # PriorityClassName for sandbox pods (not operator, leave empty for cluster default)
  sandboxPriorityClassName: ""

# TODO BENL: rename snapshot, consolidate single snapshotter image
  snapshot:
    uploader:
      image:
        registry: ghcr.io/isola-ai
        repository: isola-uploader
        tag: ""  # Defaults to Chart.appVersion
        digest: ""  # If set, takes precedence over tag (e.g., sha256:abc123...)

    # Storage configuration for snapshot uploads
    storage:
      # Bucket URL (required for snapshotting to work)
      # Examples:
      #   s3://bucket-name?region=us-east-1 (AWS S3)
      #   s3://bucket-name?endpoint=http://localstack:4566&use_path_style=true (LocalStack/MinIO)
      #   gs://bucket-name (Google Cloud Storage)
      #   azblob://container-name (Azure Blob Storage)
      bucketUrl: ""

      # Credentials - three modes:
      #   1. Pod/Workload Identity: Leave all empty (recommended)
      #   2. Existing Secret: Set existingSecret
      #   3. Chart-managed: Provide accessKeyId/secretAccessKey (dev only)
      credentials:
        existingSecret: ""
        accessKeyId: ""
        secretAccessKey: ""
        region: ""

    # ServiceAccount for snapshot jobs
    serviceAccount:
      create: true
      name: "isola-snapshot-job"
      annotations: {}  # For IRSA/Workload Identity


apiGateway:
  # The apiGateway installation could be skipped,
  # though it is not recommended as it provides control
  # functionality over the sandboxes (proxies file copies, exec commands, etc)
  enabled: true

  image:
    registry: ghcr.io/isola-ai
    repository: api-gateway
    tag: ""  # Defaults to Chart.appVersion
    digest: ""  # If set, takes precedence over tag (e.g., sha256:abc123...)
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 10m
      memory: 64Mi

  service:
    type: ClusterIP
    nodePort: null

  logging:
    level: info
    devMode: false

  serviceAccount:
    create: true
    name: ""
    annotations: {}

  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
