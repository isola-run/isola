apiVersion: apps/v1
kind: Deployment
metadata:
  name: isola-controller
  labels:
    app: isola-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "isola-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "isola-controller.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: isola-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: isola-controller
        securityContext:
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 30080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: LOG_LEVEL
          value: {{ .Values.logLevel | default "info" | quote }}
        - name: KUBERNETES_NAMESPACE
          value: {{ .Values.sandboxNamespace | quote }}
        {{- if .Values.storage.enabled }}
        - name: S3_BUCKET
          value: {{ .Values.storage.bucket | quote }}
        - name: S3_ENDPOINT_URL
          value: {{ .Values.storage.endpointUrl | quote }}
        - name: S3_REGION
          value: {{ .Values.storage.region | quote }}
        - name: AWS_ACCESS_KEY_ID
          value: {{ .Values.storage.accessKeyId | quote }}
        - name: AWS_SECRET_ACCESS_KEY
          value: {{ .Values.storage.secretAccessKey | quote }}
      {{- end }}
