apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "isola-controller.fullname" . }}
  labels:
    {{- include "isola-controller.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "isola-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "isola-controller.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "isola-controller.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: ws
          containerPort: {{ .Values.config.websocket.port }}
          protocol: TCP
        - name: http
          containerPort: {{ .Values.config.http.port }}
          protocol: TCP
        {{- if .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 12 }}
        {{- end }}
        {{- if .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 12 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        env:
        {{- range .Values.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        {{- if .Values.storage.enabled }}
        {{- if .Values.storage.bucket }}
        - name: S3_BUCKET
          value: {{ .Values.storage.bucket | quote }}
        {{- end }}
        {{- if .Values.storage.endpointUrl }}
        - name: S3_ENDPOINT_URL
          value: {{ .Values.storage.endpointUrl | quote }}
        {{- end }}
        {{- if .Values.storage.region }}
        - name: S3_REGION
          value: {{ .Values.storage.region | quote }}
        {{- end }}
        {{- if and .Values.storage.existingSecret (not .Values.storage.accessKeyId) }}
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.storage.existingSecret }}
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.storage.existingSecret }}
              key: AWS_SECRET_ACCESS_KEY
        {{- else }}
        {{- if .Values.storage.accessKeyId }}
        - name: AWS_ACCESS_KEY_ID
          value: {{ .Values.storage.accessKeyId | quote }}
        {{- end }}
        {{- if .Values.storage.secretAccessKey }}
        - name: AWS_SECRET_ACCESS_KEY
          value: {{ .Values.storage.secretAccessKey | quote }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- with .Values.envFrom }}
        envFrom:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.volumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
