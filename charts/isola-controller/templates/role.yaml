{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "isola-controller.fullname" . }}
  namespace: {{ .Values.sandboxesNamespace.name }}
  labels:
    {{- include "isola-controller.labels" . | nindent 4 }}
rules:
{{- with .Values.rbac.rules }}
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
