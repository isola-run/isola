# Default values for isola-controller
replicaCount: 1

image:
  repository: isola-controller
  pullPolicy: IfNotPresent
  tag: ""  # Overrides the image tag whose default is the chart appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  ports:
    http:
      port: 30080
      targetPort: http
      protocol: TCP
    websocket:
      port: 8765
      targetPort: ws
      protocol: TCP

nodePort:
  enabled: false
  type: NodePort
  ports:
    http:
      port: 30080
      targetPort: 30080
      nodePort: 30080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: isola-controller.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: isola-controller-tls
  #    hosts:
  #      - isola-controller.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Application specific configurations
config:
  logLevel: info
  pythonUnbuffered: "1"
  
  # WebSocket configuration
  websocket:
    port: 8765
    
  # HTTP API configuration
  http:
    port: 30080

# Sandboxes Namespace Configuration
sandboxesNamespace:
  create: true
  name: isola-sandboxes

# RBAC Configuration
# Note: RBAC is namespace-scoped to isola-sandboxes namespace
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "pods/log", "pods/exec", "pods/status"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["apps"]
      resources: ["deployments", "replicasets"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: [""]
      resources: ["services", "endpoints"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: [""]
      resources: ["configmaps", "secrets"]
      verbs: ["get", "list", "watch"]

# Environment variables
env:
  - name: PYTHONUNBUFFERED
    value: "1"
  - name: LOG_LEVEL
    value: "info"

# Additional environment variables from ConfigMap/Secret
envFrom: []
  # - configMapRef:
  #     name: isola-controller-config
  # - secretRef:
  #     name: isola-controller-secrets

# Volume mounts
volumeMounts: []
  # - name: config
  #   mountPath: /config
  #   readOnly: true

# Volumes
volumes: []
  # - name: config
  #   configMap:
  #     name: isola-controller-config

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
