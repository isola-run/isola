# isola-controller values

image:
  repository: isola-controller
  tag: "latest"

# Log level: debug, info, warning, error
logLevel: info

# Namespace for sandbox pods
sandboxNamespace: isola-sandboxes

# NodePort for local development access
nodePort:
  enabled: false

# S3/Object Storage configuration
storage:
  enabled: false
  bucketUrl: ""
  # Credentials (read automatically by go-cloud from standard env vars)
  awsAccessKeyId: ""
  awsSecretAccessKey: ""
