# Development values - used by Tilt for local development
# Tilt overrides image references via --set flags, so these are defaults

image:
  # Tilt will override with localhost:5001/api-gateway
  registry: ""
  repository: api-gateway
  tag: "dev"
  pullPolicy: IfNotPresent

logging:
  level: debug
  devMode: true

service:
  type: NodePort
  nodePort: 30080
