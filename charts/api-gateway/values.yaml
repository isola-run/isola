# Override the chart name
nameOverride: ""
# Override the full release name
fullnameOverride: ""

# Global settings
# When installed as part of the umbrella chart, these are set by the parent.
# When installed standalone, these provide defaults.
global:
  # Override registry for all images (e.g., "my-registry.example.com/isola")
  imageRegistry: ""
  # Image pull secrets applied to all pods
  # Example: [{ name: "my-registry-secret" }]
  imagePullSecrets: []
  # Sandbox namespace (when empty, uses local sandboxNamespace value)
  sandboxNamespace: ""

# API image configuration
image:
  registry: ghcr.io/isola-ai
  repository: api-gateway
  # Tag defaults to Chart.appVersion if empty
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# Pod annotations (e.g., for Prometheus scraping)
podAnnotations: {}

# Pod scheduling
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  nodePort: null

resources:
  requests:
    cpu: 10m
    memory: 64Mi

logging:
  level: info
  devMode: false

sandboxNamespace: isola-sandboxes

# ServiceAccount configuration
serviceAccount:
  # Create a new service account
  create: true
  # Name of the service account (auto-generated if empty)
  name: ""
  # Annotations to add to the service account
  annotations: {}
