apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "api-gateway.fullname" . }}-pods
  namespace: {{ include "api-gateway.sandboxNamespace" . }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
rules:
  # Pod access scoped to sandbox namespace
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
