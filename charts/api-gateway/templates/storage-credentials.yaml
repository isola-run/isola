{{/*
Create a secret for storage credentials if:
1. No existing secret is referenced AND
2. Inline credentials are provided
Supports both standalone mode (uses local values) and umbrella mode (uses global values).
*/}}
{{- $existingSecret := include "api-gateway.storageCredentialsExistingSecret" . -}}
{{- $accessKeyId := include "api-gateway.storageCredentialsAccessKeyId" . -}}
{{- $secretAccessKey := include "api-gateway.storageCredentialsSecretAccessKey" . -}}
{{- $region := include "api-gateway.storageCredentialsRegion" . -}}
{{- if and (not $existingSecret) $accessKeyId $secretAccessKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api-gateway.fullname" . }}-storage-credentials
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ $accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $secretAccessKey | quote }}
  {{- if $region }}
  AWS_REGION: {{ $region | quote }}
  {{- end }}
{{- end }}
