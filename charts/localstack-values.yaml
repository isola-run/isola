# Shared LocalStack configuration for dev and CI
# Used by: Tiltfile, .github/workflows/e2e.yml
image:
  repository: localstack/localstack
  tag: "4.14.0"

service:
  type: ClusterIP

# Only enable S3 for storage backend
startServices: s3

# Create the buckets on startup
enableStartupScripts: true
startupScriptContent: |
  #!/bin/bash
  awslocal s3api create-bucket --bucket isola-uploads 2>/dev/null || true
  awslocal s3api create-bucket --bucket isola-snapshots 2>/dev/null || true
