image:
  repository: isola-gw
  tag: "dev"

logLevel: debug

# Namespace for sandbox pods
sandboxNamespace: isola-sandboxes

nodePort:
  enabled: true
  port: 30080

# LocalStack storage configuration
storage:
  enabled: true
  bucketUrl: "s3://isola-uploads?endpoint=http://localstack.localstack.svc.cluster.local:4566&use_path_style=true&region=us-east-1"
  # LocalStack credentials - chart creates isola-gw-storage-credentials secret
  credentials:
    accessKeyId: "test"
    secretAccessKey: "test"
    region: "us-east-1"
