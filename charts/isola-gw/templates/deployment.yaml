apiVersion: apps/v1
kind: Deployment
metadata:
  name: isola-gw
  labels:
    app: isola-gw
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "isola-gw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "isola-gw.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: isola-gw
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
      - name: isola-gw
        securityContext:
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        env:
        - name: HTTP_HOST
          value: "0.0.0.0"
        - name: HTTP_PORT
          value: "8080"
        - name: KUBERNETES_NAMESPACE
          value: {{ .Values.kubernetes.namespace | quote }}
        {{- if .Values.kubernetes.runtimeClassName }}
        - name: RUNTIME_CLASS_NAME
          value: {{ .Values.kubernetes.runtimeClassName | quote }}
        {{- end }}
        - name: GIN_MODE
          value: {{ if eq .Values.logLevel "debug" }}"debug"{{ else }}"release"{{ end }}
        {{- if .Values.storage.enabled }}
        - name: STORAGE_BACKEND
          value: {{ .Values.storage.backend | quote }}
        - name: BUCKET_NAME
          value: {{ .Values.storage.bucket | quote }}
        - name: REGION
          value: {{ .Values.storage.region | quote }}
        {{- if .Values.storage.endpointUrl }}
        - name: ENDPOINT_URL
          value: {{ .Values.storage.endpointUrl | quote }}
        {{- end }}
        {{- if .Values.storage.accessKeyId }}
        - name: ACCESS_KEY_ID
          value: {{ .Values.storage.accessKeyId | quote }}
        {{- end }}
        {{- if .Values.storage.secretAccessKey }}
        - name: SECRET_ACCESS_KEY
          value: {{ .Values.storage.secretAccessKey | quote }}
        {{- end }}
        {{- end }}

