apiVersion: apps/v1
kind: Deployment
metadata:
  name: isola-gw
  labels:
    app: isola-gw
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "isola-gw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "isola-gw.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: isola-gw
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
      - name: isola-gw
        securityContext:
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        env:
        - name: ISOLA_HTTP_HOST
          value: "0.0.0.0"
        - name: ISOLA_HTTP_PORT
          value: "8080"
        - name: GIN_MODE
          value: {{ if eq .Values.logLevel "debug" }}"debug"{{ else }}"release"{{ end }}
        - name: ISOLA_LOG_LEVEL
          value: {{ .Values.logLevel | default "info" | quote }}
        - name: ISOLA_KUBERNETES_NAMESPACE
          value: {{ .Values.sandboxNamespace | quote }}
        {{- if .Values.storage.enabled }}
        - name: ISOLA_BUCKET_URL
          value: {{ .Values.storage.bucketUrl | quote }}
        {{- end }}
        # Bucket credentials loaded from secret (if configured)
        # Falls back to service account auth (IRSA/Workload Identity) when no secret provided
        {{- if .Values.storage.credentialsSecretRef }}
        envFrom:
        - secretRef:
            name: {{ .Values.storage.credentialsSecretRef }}
        {{- else if and .Values.storage.enabled .Values.storage.credentials.create }}
        envFrom:
        - secretRef:
            name: {{ include "isola-gw.fullname" . }}-storage-credentials
        {{- end }}
