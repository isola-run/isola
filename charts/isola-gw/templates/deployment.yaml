apiVersion: apps/v1
kind: Deployment
metadata:
  name: isola-gw
  labels:
    app: isola-gw
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "isola-gw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "isola-gw.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: isola-gw
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
      - name: isola-gw
        securityContext:
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        env:
        - name: ISOLA_HTTP_HOST
          value: "0.0.0.0"
        - name: ISOLA_HTTP_PORT
          value: "8080"
        {{- if .Values.kubernetes.runtimeClassName }}
        - name: ISOLA_RUNTIME_CLASS_NAME
          value: {{ .Values.kubernetes.runtimeClassName | quote }}
        {{- end }}
        - name: ISOLA_GIN_MODE
          value: {{ if eq .Values.logLevel "debug" }}"debug"{{ else }}"release"{{ end }}
        - name: ISOLA_LOG_LEVEL
          value: {{ .Values.logLevel | default "info" | quote }}
        - name: ISOLA_KUBERNETES_NAMESPACE
          value: {{ .Values.sandboxNamespace | quote }}
        {{- if .Values.storage.enabled }}
        - name: ISOLA_STORAGE_BACKEND
          value: {{ .Values.storage.backend | quote }}
        - name: ISOLA_BUCKET_NAME
          value: {{ .Values.storage.bucket | quote }}
        - name: ISOLA_STORAGE_REGION
          value: {{ .Values.storage.region | quote }}
        {{- if .Values.storage.endpointUrl }}
        - name: ISOLA_STORAGE_ENDPOINT
          value: {{ .Values.storage.endpointUrl | quote }}
        {{- end }}
        {{- if .Values.storage.accessKeyId }}
        - name: ISOLA_STORAGE_ACCESS_KEY_ID
          value: {{ .Values.storage.accessKeyId | quote }}
        {{- end }}
        {{- if .Values.storage.secretAccessKey }}
        - name: ISOLA_STORAGE_SECRET_ACCESS_KEY
          value: {{ .Values.storage.secretAccessKey | quote }}
        {{- end }}
        {{- end }}

