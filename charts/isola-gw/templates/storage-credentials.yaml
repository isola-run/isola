{{/*
Storage credentials secret for isola-gw.
Created only when:
  1. storage is enabled
  2. existingSecret is NOT set
  3. Both accessKeyId AND secretAccessKey are provided

When all credential fields are empty, pod identity (IRSA/Workload Identity) is assumed.
*/}}
{{- if .Values.storage.enabled }}
{{- if and (not .Values.storage.credentials.existingSecret) .Values.storage.credentials.accessKeyId .Values.storage.credentials.secretAccessKey }}
apiVersion: v1
kind: Secret
metadata:
  name: isola-gw-storage-credentials
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: isola-gw
    app.kubernetes.io/component: storage-credentials
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ .Values.storage.credentials.accessKeyId | b64enc }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.storage.credentials.secretAccessKey | b64enc }}
  {{- if .Values.storage.credentials.region }}
  AWS_REGION: {{ .Values.storage.credentials.region | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
