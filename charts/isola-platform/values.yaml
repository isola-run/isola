# Isola Platform Helm Chart Values

# Global settings
global:
  environment: "development"
  domain: "isola.local"
  imageRegistry: ""
  imagePullSecrets: []
  
  # Namespace configuration
  namespaces:
    createControlPlane: true
    createSandboxes: true
    controlPlaneName: isola-control-plane
    sandboxesName: isola-sandboxes

# Controller configuration
controller:
  enabled: true
  replicaCount: 1
  image:
    repository: isola-controller
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    ports:
      http:
        port: 80
        targetPort: 30080
      websocket:
        port: 8765
        targetPort: 8765
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  
  config:
    logLevel: info
    maxSandboxes: 10
    sandboxTimeout: 3600  # seconds

# Agent configuration
agent:
  enabled: true
  replicaCount: 2
  image:
    repository: isola-agent
    tag: latest
    pullPolicy: IfNotPresent
  
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  
  config:
    logLevel: info
    maxConcurrentExecutions: 5
    executionTimeout: 300  # seconds

# Monitoring and observability
monitoring:
  enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false
  
# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.isola.local
      paths:
        - path: /
          pathType: Prefix
          backend: controller
  tls:
    - secretName: isola-tls
      hosts:
        - api.isola.local

# Security settings
security:
  podSecurityPolicy:
    enabled: false
  networkPolicy:
    enabled: false
  rbac:
    create: true
