apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "isola-api.fullname" . }}-pods
  namespace: {{ .Values.sandboxNamespace }}
  labels:
    {{- include "isola-api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "isola-api.fullname" . }}-pods
subjects:
  - kind: ServiceAccount
    name: {{ include "isola-api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
