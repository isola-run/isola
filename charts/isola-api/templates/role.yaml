apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "isola-api.fullname" . }}
  labels:
    {{- include "isola-api.labels" . | nindent 4 }}
rules:
  # Sandbox and SandboxTemplate access
  - apiGroups: ["sandbox.isola.run"]
    resources: ["sandboxes", "sandboxtemplates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["sandbox.isola.run"]
    resources: ["sandboxes/status"]
    verbs: ["get"]
  # Pod access for sandbox status
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
