apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "isola-api.fullname" . }}
  labels:
    {{- include "isola-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "isola-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "isola-api.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "isola-api.serviceAccountName" . }}
      {{- include "isola-api.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "isola-api.apiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -log-level={{ .Values.logging.level }}
            {{- if .Values.logging.devMode }}
            - --dev
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          env:
            - name: ISOLA_SANDBOX_NAMESPACE
              value: {{ .Values.sandboxNamespace | quote }}
            {{- if .Values.storage.bucketUrl }}
            - name: ISOLA_BUCKET_URL
              value: {{ .Values.storage.bucketUrl | quote }}
            {{- end }}
            {{- $credentialSecret := include "isola-api.credentialSecretName" . }}
            {{- if $credentialSecret }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $credentialSecret }}
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $credentialSecret }}
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: {{ $credentialSecret }}
                  key: AWS_REGION
                  optional: true
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
