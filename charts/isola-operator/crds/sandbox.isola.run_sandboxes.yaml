---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: sandboxes.sandbox.isola.run
spec:
  group: sandbox.isola.run
  names:
    kind: Sandbox
    listKind: SandboxList
    plural: sandboxes
    singular: sandbox
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Aggregate readiness
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: Reason for Ready condition
      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Sandbox is the Schema for the sandboxes API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Sandbox
            properties:
              network:
                description: |-
                  Network specifies the network isolation configuration for this sandbox.
                  Can either reference a shared NetworkTemplate or embed network rules directly.
                  If not specified, no NetworkPolicy is created (unrestricted network access).
                  When specified, must contain exactly one of templateRef or spec.
                properties:
                  spec:
                    description: |-
                      Spec embeds network isolation rules directly in the sandbox.
                      When specified, the controller creates a NetworkTemplate CR
                      that is owned by this sandbox and garbage-collected
                      when the sandbox is deleted.
                      Note: This spec is immutable after sandbox creation - changes are ignored.
                    properties:
                      allowedEgressCIDRs:
                        description: |-
                          AllowedEgressCIDRs is a list of CIDRs the sandbox is allowed to connect to (outbound traffic).
                          If empty, no CIDR-based egress is allowed (but allowedEgressPods rules may still permit traffic).
                          Risky IPs (cloud metadata 169.254.0.0/16, private ranges, IPv6 link-local fe80::/10) are
                          automatically blocked when the specified CIDR would otherwise allow them.
                        items:
                          pattern: ^((([0-9]{1,3}\.){3}[0-9]{1,3})/(3[0-2]|[12]?[0-9]))|(([0-9a-fA-F:]+)/([0-9]|[1-9][0-9]|1[01][0-9]|12[0-8]))$
                          type: string
                        type: array
                      allowedEgressPods:
                        description: |-
                          AllowedEgressPods specifies pods the sandbox can connect to via label selectors.
                          Useful for allowing access to in-cluster services like kube-dns.
                          When using ClusterFirst DNS policy, you must add a rule here to allow egress to DNS.

                          Example for kube-dns/CoreDNS:
                            - namespace: kube-system
                              podSelector:
                                matchLabels:
                                  k8s-app: kube-dns  # or k8s-app: coredns depending on cluster
                              ports:
                                - port: 53
                                  protocol: UDP
                                - port: 53
                                  protocol: TCP
                        items:
                          description: |-
                            EgressPodRule defines a pod-based egress rule.
                            This allows sandboxes to communicate with specific pods in the cluster,
                            such as in-cluster DNS (kube-dns/CoreDNS) when using ClusterFirst DNS policy.
                          properties:
                            namespace:
                              description: Namespace of the target pods.
                              minLength: 1
                              type: string
                            podSelector:
                              description: |-
                                PodSelector selects pods in the namespace.
                                An empty selector ({}) matches all pods in the namespace.
                              properties:
                                matchExpressions:
                                  description: matchExpressions is a list of label
                                    selector requirements. The requirements are ANDed.
                                  items:
                                    description: |-
                                      A label selector requirement is a selector that contains values, a key, and an operator that
                                      relates the key and values.
                                    properties:
                                      key:
                                        description: key is the label key that the
                                          selector applies to.
                                        type: string
                                      operator:
                                        description: |-
                                          operator represents a key's relationship to a set of values.
                                          Valid operators are In, NotIn, Exists and DoesNotExist.
                                        type: string
                                      values:
                                        description: |-
                                          values is an array of string values. If the operator is In or NotIn,
                                          the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                          the values array must be empty. This array is replaced during a strategic
                                          merge patch.
                                        items:
                                          type: string
                                        type: array
                                        x-kubernetes-list-type: atomic
                                    required:
                                    - key
                                    - operator
                                    type: object
                                  type: array
                                  x-kubernetes-list-type: atomic
                                matchLabels:
                                  additionalProperties:
                                    type: string
                                  description: |-
                                    matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                    map is equivalent to an element of matchExpressions, whose key field is "key", the
                                    operator is "In", and the values array contains only "value". The requirements are ANDed.
                                  type: object
                              type: object
                              x-kubernetes-map-type: atomic
                            ports:
                              description: Ports to allow. If empty, all ports are
                                allowed to the selected pods.
                              items:
                                description: |-
                                  NetworkPort defines a port for network rules.
                                  Using a custom type instead of networkingv1.NetworkPolicyPort for a simpler API
                                properties:
                                  port:
                                    description: Port number.
                                    format: int32
                                    maximum: 65535
                                    minimum: 1
                                    type: integer
                                  protocol:
                                    default: TCP
                                    description: Protocol (TCP or UDP). Defaults to
                                      TCP.
                                    enum:
                                    - TCP
                                    - UDP
                                    type: string
                                required:
                                - port
                                type: object
                              type: array
                          required:
                          - namespace
                          - podSelector
                          type: object
                        type: array
                      dnsPolicy:
                        default: ClusterFirst
                        description: |
                          DNSPolicy specifies the DNS policy for sandbox pods.
                          - "None": Pod uses only the nameservers from the nameservers field (fully isolated from cluster DNS).
                            If no nameservers are specified, a sink nameserver (127.0.0.1) is used and DNS queries will fail.
                            The pod's resolv.conf will have ndots:1 for faster resolution of external domains.
                          - "ClusterFirst": Pod uses cluster DNS, with nameservers combined (duplicates removed).
                            When using ClusterFirst, you must also add an egress rule via allowedEgressPods to permit
                            traffic to kube-dns (typically namespace=kube-system, label k8s-app=kube-dns or k8s-app=coredns).
                        enum:
                        - None
                        - ClusterFirst
                        type: string
                      nameservers:
                        description: |-
                          Nameservers is a list of DNS server IP addresses.
                          - When dnsPolicy is "None": optional. If empty, 127.0.0.1 is used as a sink (DNS queries fail).
                            If specified, these are the only nameservers available, and egress to their IPs is automatically allowed.
                          - When dnsPolicy is "ClusterFirst": optional, combined with cluster DNS (duplicates removed by k8s).
                            If specified, egress to their IPs is automatically allowed.
                          MaxItems=3 because Kubernetes allows at most 3 nameservers in pod DNS config.
                        items:
                          type: string
                        maxItems: 3
                        type: array
                        x-kubernetes-validations:
                        - message: must be valid IP addresses
                          rule: self.all(s, isIP(s))
                    type: object
                    x-kubernetes-validations:
                    - message: allowedEgressPods is required when dnsPolicy is ClusterFirst
                        (must allow egress to cluster DNS)
                      rule: self.dnsPolicy != 'ClusterFirst' || size(self.allowedEgressPods)
                        > 0
                  templateRef:
                    description: |-
                      TemplateRef references an existing NetworkTemplate in the same namespace.
                      The referenced NetworkTemplate is not owned by this sandbox and will persist
                      independently of sandbox lifecycle.
                    properties:
                      name:
                        description: |-
                          Name of the NetworkTemplate in the same namespace.
                          The referenced NetworkTemplate defines the network isolation rules.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                type: object
                x-kubernetes-validations:
                - message: At least one of 'templateRef' or 'spec' is required.
                  rule: has(self.templateRef) || has(self.spec)
              templateRef:
                description: |-
                  TemplateRef references the SandboxTemplate to inherit pod configuration from.
                  The SandboxTemplate must exist in the same namespace as this Sandbox.
                properties:
                  name:
                    description: |-
                      Name of the SandboxTemplate in the same namespace.
                      The referenced SandboxTemplate provides the pod configuration (containers, initContainers, etc.)
                      and lifecycle settings (timeout, shutdown policy) for this Sandbox.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - templateRef
            type: object
          status:
            description: status defines the observed state of Sandbox
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              timeoutAt:
                description: |-
                  TimeoutAt is the absolute time at which the sandbox should be considered timed out.
                  It is set by the controller (derived from template timeout + chosen start time).
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
