image:
  repository: isola-operator
  tag: "latest"
  pullSecrets: []

replicaCount: 1

# Pod annotations (e.g., for Prometheus scraping)
podAnnotations: {}

# Pod scheduling
nodeSelector: {}
tolerations: []
affinity: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi

# Agent sidecar image injected into sandbox pods
agentImage: isola-agent:latest

# RuntimeClassName for sandbox pods.
# Options:
#   "gvisor" - Use gVisor (runsc) for stronger isolation. Requires gVisor installed on nodes
#              and a RuntimeClass named "gvisor" pointing to the "runsc" handler.
#   ""       - Use cluster default runtime (typically runc). Easier to get started,
#              but provides weaker isolation between sandboxes and the host, and less isola features supported.
# For production, use gvisor.
runtimeClassName: "gvisor"

# PriorityClassName for sandbox pods.
# Used to prevent sandbox pods from being preempted by other workloads.
# If set, the chart creates a PriorityClass with this name. Leave empty to skip creation and use cluster default.
priorityClassName: "isola-sandbox"

# ServiceAccount for the operator
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Namespace where sandbox pods are created
sandboxNamespace: isola-sandboxes

# Snapshot configuration for uploading rootfs snapshots to bucket storage
snapshot:
  # Container image for the snapshot uploader job
  uploaderImage: "isola-uploader:latest"

  # Storage configuration
  storage:
    # Bucket URL for snapshot storage (required for snapshotting to work)
    # Examples:
    #   s3://bucket-name?region=us-east-1 (AWS S3)
    #   s3://bucket-name?endpoint=http://localstack:4566&use_path_style=true (LocalStack/MinIO)
    #   gs://bucket-name (Google Cloud Storage)
    #   azblob://container-name (Azure Blob Storage)
    bucketUrl: ""

    # Storage credentials for snapshot jobs
    # Three modes of operation:
    #   1. Pod/Workload Identity: Leave all fields empty (recommended for production)
    #   2. Existing Secret: Set existingSecret to reference a pre-created secret (any provider)
    #   3. Chart-managed Secret: Provide accessKeyId/secretAccessKey (AWS/S3-compatible only)
    credentials:
      ## @param snapshot.storage.credentials.existingSecret Name of existing secret containing storage credentials
      ## Use this for production with any storage provider (AWS, GCP, Azure, S3-compatible).
      ## The secret can contain any keys your storage backend requires.
      ## When set, the inline credentials below are ignored.
      existingSecret: ""

      ## AWS/S3-compatible credentials (only used when existingSecret is empty)
      ## Convenient for dev/CI with LocalStack or S3-compatible storage.
      ## Creates a secret with AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION keys.
      ## @param snapshot.storage.credentials.accessKeyId AWS Access Key ID
      accessKeyId: ""
      ## @param snapshot.storage.credentials.secretAccessKey AWS Secret Access Key
      secretAccessKey: ""
      ## @param snapshot.storage.credentials.region AWS Region
      region: ""

  # ServiceAccount for snapshot jobs (created in sandboxNamespace)
  serviceAccount:
    create: true
    name: "isola-snapshot-job"
    # Annotations for pod identity (IRSA, Workload Identity, etc.)
    # Examples:
    #   eks.amazonaws.com/role-arn: "arn:aws:iam::123456789:role/isola-snapshot"
    #   iam.gke.io/gcp-service-account: "isola-snapshot@project.iam.gserviceaccount.com"
    #   azure.workload.identity/use: "true"
    annotations: {}
