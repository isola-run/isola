# isola-operator values

image:
  repository: isola-operator
  tag: "latest"

# Agent sidecar image injected into sandbox pods
agentImage: isola-agent:latest

# Controller WebSocket URL for agent connection (FQDN for cross-namespace reliability)
controllerWSURL: ws://isola-controller.isola-control-plane.svc.cluster.local:8765/ws
