apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: isola-operator-manager-rolebinding
  labels:
    app: isola-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: isola-operator-manager-role
subjects:
- kind: ServiceAccount
  name: isola-operator
  namespace: {{ .Release.Namespace }}
