# Headless service for DNS-based addressing of sandbox agent sidecars
# Pods addressed as: <pod-name>.sandbox-agents.<namespace>.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: sandbox-agents
  namespace: {{ .Values.sandboxNamespace }}
  labels:
    {{- include "isola-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: isola-sandbox
    app.kubernetes.io/managed-by: isola-operator
  ports:
    - name: agent
      port: 8080
      targetPort: 8080

