# PodDisruptionBudget to prevent voluntary disruptions from evicting sandbox pods
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: isola-sandbox-pdb
  namespace: {{ include "isola-operator.sandboxNamespace" . }}
  labels:
    {{- include "isola-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: isola-sandbox
      app.kubernetes.io/managed-by: isola-operator
