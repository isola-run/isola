# Allow ingress from isola-api to sandbox agent sidecars
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-isola-api-ingress
  namespace: {{ .Values.sandboxNamespace }}
  labels:
    {{- include "isola-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
spec:
  podSelector:
    matchLabels:
      app: isola-sandbox
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: isola-api
      ports:
        - protocol: TCP
          port: 8080
