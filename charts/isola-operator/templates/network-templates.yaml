# Built-in NetworkTemplates for sandbox network isolation
---
# isola-isolated: Deny all network traffic (except isola-gw ingress via allow-isola-gw-ingress NetworkPolicy)
# allowInClusterEgress: false (default) implies DNSPolicy=None with sink nameserver (127.0.0.1)
apiVersion: sandbox.isola.run/v1alpha1
kind: NetworkTemplate
metadata:
  name: isola-isolated
  namespace: {{ .Values.sandboxNamespace | default "isola-sandboxes" }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: network-template
    isola.run/builtin: "true"
# Empty spec uses defaults: allowInClusterEgress=false (DNSPolicy=None), no nameservers (sink 127.0.0.1)
spec: {}
---
# isola-egress-only: Allow internet egress with external DNS, block cluster egress
apiVersion: sandbox.isola.run/v1alpha1
kind: NetworkTemplate
metadata:
  name: isola-egress-only
  namespace: {{ .Values.sandboxNamespace | default "isola-sandboxes" }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: network-template
    isola.run/builtin: "true"
spec:
  # allowInClusterEgress: false (default) - cluster egress blocked, DNSPolicy=None
  nameservers:
    - "8.8.8.8"
    - "1.1.1.1"
  allowedEgressCIDRs:
    - "0.0.0.0/0"
