# Built-in NetworkTemplates for sandbox network isolation
---
# isola-isolated: Deny all network traffic (except isola-gw ingress via allow-isola-gw-ingress NetworkPolicy)
# Uses dnsPolicy: None with no nameservers (sink nameserver 127.0.0.1) - DNS queries fail fast
apiVersion: sandbox.isola.run/v1alpha1
kind: NetworkTemplate
metadata:
  name: isola-isolated
  namespace: {{ .Values.sandboxNamespace | default "isola-sandboxes" }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: network-template
    isola.run/builtin: "true"
spec:
  dnsPolicy: None
  # No nameservers = sink nameserver (127.0.0.1) with fast-fail DNS options
---
# isola-egress-only: Allow internet egress with external DNS
apiVersion: sandbox.isola.run/v1alpha1
kind: NetworkTemplate
metadata:
  name: isola-egress-only
  namespace: {{ .Values.sandboxNamespace | default "isola-sandboxes" }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: network-template
    isola.run/builtin: "true"
spec:
  dnsPolicy: None
  nameservers:
    - "8.8.8.8"
    - "1.1.1.1"
  allowedEgressCIDRs:
    - "0.0.0.0/0"
