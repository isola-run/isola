---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "isola-operator.fullname" . }}-manager-role
  labels:
    {{- include "isola-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sandbox.isola.run
  resources:
  - sandboxes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sandbox.isola.run
  resources:
  - sandboxes/finalizers
  verbs:
  - update
- apiGroups:
  - sandbox.isola.run
  resources:
  - sandboxes/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - sandbox.isola.run
  resources:
  - sandboxtemplates
  verbs:
  - get
  - list
  - watch

