{{- if .Values.snapshot.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.snapshot.serviceAccount.name }}
  namespace: {{ .Values.sandboxNamespace }}
  labels:
    app.kubernetes.io/name: isola-operator
    app.kubernetes.io/component: snapshot
  {{- with .Values.snapshot.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
