# Default deny policy for all sandbox pods.
# Denies all ingress and egress by default - other policies add specific allowances.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-default-deny
  namespace: {{ .Values.sandboxNamespace | default "isola-sandboxes" }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: isola-operator
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: isola-sandbox
  policyTypes:
    - Ingress
    - Egress
  # Empty rules = deny all
  ingress: []
  egress: []
