apiVersion: apps/v1
kind: Deployment
metadata:
  name: isola-operator
  labels:
    app: isola-operator
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "isola-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        {{- include "isola-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: isola-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      containers:
      - name: manager
        command:
        - /manager
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --agent-image={{ .Values.agentImage }}
        {{- if .Values.runtimeClassName }}
        - --runtime-class={{ .Values.runtimeClassName }}
        {{- end }}
        securityContext:
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: IfNotPresent
        ports: []
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        env:
        {{- if .Values.snapshot.storage.bucketUrl }}
        - name: ISOLA_SNAPSHOT_BUCKET_URL
          value: {{ .Values.snapshot.storage.bucketUrl | quote }}
        {{- /* Determine which secret to use for snapshot credentials */ -}}
        {{- $credentialSecretName := "" }}
        {{- if .Values.snapshot.storage.credentials.existingSecret }}
        {{- $credentialSecretName = .Values.snapshot.storage.credentials.existingSecret }}
        {{- else if and .Values.snapshot.storage.credentials.accessKeyId .Values.snapshot.storage.credentials.secretAccessKey }}
        {{- $credentialSecretName = "isola-snapshot-credentials" }}
        {{- end }}
        {{- if $credentialSecretName }}
        - name: ISOLA_SNAPSHOT_CREDENTIAL_SECRET
          value: {{ $credentialSecretName | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.snapshot.uploaderImage }}
        - name: ISOLA_UPLOADER_IMAGE
          value: {{ .Values.snapshot.uploaderImage | quote }}
        {{- end }}
        {{- if .Values.snapshot.serviceAccount.name }}
        - name: ISOLA_SNAPSHOT_SERVICE_ACCOUNT
          value: {{ .Values.snapshot.serviceAccount.name | quote }}
        {{- end }}
