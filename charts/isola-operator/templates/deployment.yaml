apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "isola-operator.fullname" . }}
  labels:
    {{- include "isola-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "isola-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "isola-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "isola-operator.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      containers:
      - name: manager
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: IfNotPresent
        command:
        - /manager
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --sidecar-image={{ .Values.sidecarImage }}
        {{- if .Values.runtimeClassName }}
        - --runtime-class={{ .Values.runtimeClassName }}
        {{- end }}
        {{- if .Values.priorityClassName }}
        - --priority-class={{ .Values.priorityClassName }}
        {{- end }}
        ports:
        - name: health
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        env:
        {{- if .Values.snapshot.storage.bucketUrl }}
        - name: ISOLA_SNAPSHOT_BUCKET_URL
          value: {{ .Values.snapshot.storage.bucketUrl | quote }}
        {{- $credentialSecretName := include "isola-operator.snapshotCredentialSecretName" . }}
        {{- if $credentialSecretName }}
        - name: ISOLA_SNAPSHOT_CREDENTIAL_SECRET
          value: {{ $credentialSecretName | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.snapshot.uploaderImage }}
        - name: ISOLA_UPLOADER_IMAGE
          value: {{ .Values.snapshot.uploaderImage | quote }}
        {{- end }}
        {{- if .Values.snapshot.serviceAccount.name }}
        - name: ISOLA_SNAPSHOT_SERVICE_ACCOUNT
          value: {{ .Values.snapshot.serviceAccount.name | quote }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
