{{/*
Storage credentials secret for snapshot jobs.
Created only when existingSecret is NOT set AND both accessKeyId/secretAccessKey are provided.
*/}}
{{- if and (not .Values.snapshot.storage.credentials.existingSecret) .Values.snapshot.storage.credentials.accessKeyId .Values.snapshot.storage.credentials.secretAccessKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "isola-operator.fullname" . }}-snapshot-credentials
  namespace: {{ .Values.sandboxNamespace }}
  labels:
    {{- include "isola-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: rootfssnapshot
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.snapshot.storage.credentials.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.snapshot.storage.credentials.secretAccessKey | quote }}
  {{- if .Values.snapshot.storage.credentials.region }}
  AWS_REGION: {{ .Values.snapshot.storage.credentials.region | quote }}
  {{- end }}
{{- end }}
