{{/*
Storage credentials secret for snapshot jobs.
Created only when:
  1. existingSecret is NOT set
  2. Both accessKeyId AND secretAccessKey are provided

When all credential fields are empty, pod identity (IRSA/Workload Identity) is assumed.
*/}}
{{- if and (not .Values.snapshot.storage.credentials.existingSecret) .Values.snapshot.storage.credentials.accessKeyId .Values.snapshot.storage.credentials.secretAccessKey }}
apiVersion: v1
kind: Secret
metadata:
  name: isola-snapshot-credentials
  namespace: {{ .Values.sandboxNamespace | default "isola-sandboxes" }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: isola
    app.kubernetes.io/component: snapshot-credentials
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ .Values.snapshot.storage.credentials.accessKeyId | b64enc }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.snapshot.storage.credentials.secretAccessKey | b64enc }}
  {{- if .Values.snapshot.storage.credentials.region }}
  AWS_REGION: {{ .Values.snapshot.storage.credentials.region | b64enc }}
  {{- end }}
{{- end }}
