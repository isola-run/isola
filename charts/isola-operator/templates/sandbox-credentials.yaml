{{/*
AWS credentials secret for sandbox jobs.
Created only when:
  1. existingSecret is NOT set
  2. Both accessKeyId AND secretAccessKey are provided

When all credential fields are empty, pod identity (IRSA/Workload Identity) is assumed.
*/}}
{{- if and (not .Values.sandboxCredentials.existingSecret) .Values.sandboxCredentials.accessKeyId .Values.sandboxCredentials.secretAccessKey }}
apiVersion: v1
kind: Secret
metadata:
  name: isola-sandbox-credentials
  namespace: {{ .Values.sandboxNamespace | default "isola-sandboxes" }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: isola
    app.kubernetes.io/component: sandbox-credentials
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ .Values.sandboxCredentials.accessKeyId | b64enc }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.sandboxCredentials.secretAccessKey | b64enc }}
  AWS_REGION: {{ .Values.sandboxCredentials.region | b64enc }}
{{- end }}
