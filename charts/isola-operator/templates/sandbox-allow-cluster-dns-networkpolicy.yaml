# Allow cluster DNS egress for sandbox pods with isola.run/allow-cluster-dns=true label.
# Allows egress to kube-dns/CoreDNS in kube-system namespace on port 53.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-allow-cluster-dns
  namespace: {{ .Values.sandboxNamespace | default "isola-sandboxes" }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: isola-operator
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      isola.run/allow-cluster-dns: "true"
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
