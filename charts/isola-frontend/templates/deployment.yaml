apiVersion: apps/v1
kind: Deployment
metadata:
  name: isola-frontend
  labels:
    app: isola-frontend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "isola-frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "isola-frontend.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: isola-frontend
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
