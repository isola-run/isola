openapi: 3.1.0
info:
  title: Isola Sandbox Infrastructure API
  version: 1.0.0
  description: |
    Isola provides on-premise sandbox infrastructure for development and testing environments.
    This API allows you to manage sandboxes, snapshots, and volumes programmatically.
  contact:
    name: Isola Support
    email: support@isola.io
    url: https://isola.io
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Default local server
  - url: https://api.isola.local
    description: Production server

security:
  - apiKey: []

tags:
  - name: health
    description: Health and status endpoints
  - name: config
    description: System configuration
  - name: sandboxes
    description: Sandbox management operations
  - name: snapshots
    description: Snapshot management operations
  - name: volumes
    description: Volume management operations
  - name: runners
    description: Runner infrastructure management
  - name: api-keys
    description: API key management

paths:
  # Health and Status
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Returns the health status of the Isola API
      tags:
        - health
      security: []  # No auth required for health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /config:
    get:
      operationId: getConfig
      summary: Get system configuration
      description: Returns the current Isola system configuration
      tags:
        - config
      responses:
        '200':
          description: System configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # API Key Management
  /api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys
      description: Returns a list of all API keys in the system
      tags:
        - api-keys
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
    
    post:
      operationId: createApiKey
      summary: Create a new API key
      description: Creates a new API key with the specified permissions
      tags:
        - api-keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKey'
      responses:
        '201':
          description: API key created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyWithSecret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api-keys/{name}:
    delete:
      operationId: deleteApiKey
      summary: Delete an API key
      description: Deletes the specified API key
      tags:
        - api-keys
      parameters:
        - $ref: '#/components/parameters/ApiKeyName'
      responses:
        '204':
          description: API key deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # Sandbox Management
  /sandboxes:
    get:
      operationId: listSandboxes
      summary: List all sandboxes
      description: Returns a list of all sandboxes
      tags:
        - sandboxes
      parameters:
        - $ref: '#/components/parameters/State'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of sandboxes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    
    post:
      operationId: createSandbox
      summary: Create a new sandbox
      description: Creates a new sandbox with the specified configuration
      tags:
        - sandboxes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSandbox'
      responses:
        '201':
          description: Sandbox created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /sandboxes/{sandboxId}:
    get:
      operationId: getSandbox
      summary: Get sandbox details
      description: Returns detailed information about a specific sandbox
      tags:
        - sandboxes
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      responses:
        '200':
          description: Sandbox details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    
    delete:
      operationId: deleteSandbox
      summary: Delete a sandbox
      description: Permanently deletes a sandbox and all associated resources
      tags:
        - sandboxes
      parameters:
        - $ref: '#/components/parameters/SandboxId'
        - name: force
          in: query
          description: Force deletion even if sandbox is running
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Sandbox deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /sandboxes/{sandboxId}/start:
    post:
      operationId: startSandbox
      summary: Start a sandbox
      description: Starts a stopped sandbox
      tags:
        - sandboxes
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      responses:
        '202':
          description: Sandbox start initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /sandboxes/{sandboxId}/stop:
    post:
      operationId: stopSandbox
      summary: Stop a sandbox
      description: Stops a running sandbox
      tags:
        - sandboxes
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      responses:
        '202':
          description: Sandbox stop initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /sandboxes/{sandboxId}/restart:
    post:
      operationId: restartSandbox
      summary: Restart a sandbox
      description: Restarts a sandbox (stop and start)
      tags:
        - sandboxes
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      responses:
        '202':
          description: Sandbox restart initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /sandboxes/{sandboxId}/labels:
    patch:
      operationId: updateSandboxLabels
      summary: Update sandbox labels
      description: Updates the labels of a sandbox
      tags:
        - sandboxes
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Labels'
      responses:
        '200':
          description: Labels updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /sandboxes/{sandboxId}/ssh-access:
    get:
      operationId: getSandboxSshAccess
      summary: Get SSH access information
      description: Returns SSH connection details for the sandbox
      tags:
        - sandboxes
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      responses:
        '200':
          description: SSH access information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SshAccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # Snapshot Management
  /snapshots:
    get:
      operationId: listSnapshots
      summary: List all snapshots
      description: Returns a list of all available snapshots
      tags:
        - snapshots
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: includeGeneral
          in: query
          description: Include general (system) snapshots
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: List of snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    
    post:
      operationId: createSnapshot
      summary: Create a new snapshot
      description: Creates a new snapshot from a sandbox or Dockerfile
      tags:
        - snapshots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSnapshot'
      responses:
        '201':
          description: Snapshot created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /snapshots/{snapshotId}:
    get:
      operationId: getSnapshot
      summary: Get snapshot details
      description: Returns detailed information about a specific snapshot
      tags:
        - snapshots
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
      responses:
        '200':
          description: Snapshot details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    
    delete:
      operationId: deleteSnapshot
      summary: Delete a snapshot
      description: Permanently deletes a snapshot
      tags:
        - snapshots
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
      responses:
        '204':
          description: Snapshot deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /snapshots/{snapshotId}/build-logs:
    get:
      operationId: getSnapshotBuildLogs
      summary: Get snapshot build logs
      description: Returns the build logs for a snapshot
      tags:
        - snapshots
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
      responses:
        '200':
          description: Build logs
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # Volume Management
  /volumes:
    get:
      operationId: listVolumes
      summary: List all volumes
      description: Returns a list of all volumes
      tags:
        - volumes
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of volumes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    
    post:
      operationId: createVolume
      summary: Create a new volume
      description: Creates a new persistent volume
      tags:
        - volumes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVolume'
      responses:
        '201':
          description: Volume created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Volume'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /volumes/{volumeId}:
    get:
      operationId: getVolume
      summary: Get volume details
      description: Returns detailed information about a specific volume
      tags:
        - volumes
      parameters:
        - $ref: '#/components/parameters/VolumeId'
      responses:
        '200':
          description: Volume details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Volume'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    
    delete:
      operationId: deleteVolume
      summary: Delete a volume
      description: Permanently deletes a volume
      tags:
        - volumes
      parameters:
        - $ref: '#/components/parameters/VolumeId'
      responses:
        '204':
          description: Volume deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # Runner Management
  /runners:
    get:
      operationId: listRunners
      summary: List all runners
      description: Returns a list of all registered runners
      tags:
        - runners
      parameters:
        - name: region
          in: query
          description: Filter by region
          required: false
          schema:
            type: string
        - name: state
          in: query
          description: Filter by runner state
          required: false
          schema:
            $ref: '#/components/schemas/RunnerState'
      responses:
        '200':
          description: List of runners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Runner'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /runners/{runnerId}:
    get:
      operationId: getRunner
      summary: Get runner details
      description: Returns detailed information about a specific runner
      tags:
        - runners
      parameters:
        - $ref: '#/components/parameters/RunnerId'
      responses:
        '200':
          description: Runner details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Runner'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication

  parameters:
    SandboxId:
      name: sandboxId
      in: path
      description: Unique identifier of the sandbox
      required: true
      schema:
        type: string
        format: uuid
    
    SnapshotId:
      name: snapshotId
      in: path
      description: Unique identifier of the snapshot
      required: true
      schema:
        type: string
        format: uuid
    
    VolumeId:
      name: volumeId
      in: path
      description: Unique identifier of the volume
      required: true
      schema:
        type: string
        format: uuid
    
    RunnerId:
      name: runnerId
      in: path
      description: Unique identifier of the runner
      required: true
      schema:
        type: string
        format: uuid
    
    ApiKeyName:
      name: name
      in: path
      description: Name of the API key
      required: true
      schema:
        type: string
    
    State:
      name: state
      in: query
      description: Filter by state
      required: false
      schema:
        $ref: '#/components/schemas/SandboxState'
    
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    
    Offset:
      name: offset
      in: query
      description: Number of items to skip
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    BadRequest:
      description: Bad request - Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    Unauthorized:
      description: Unauthorized - Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    Conflict:
      description: Conflict - Resource already exists or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # Common Schemas
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
          examples:
            - INVALID_INPUT
            - UNAUTHORIZED
            - NOT_FOUND
            - CONFLICT
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    
    Labels:
      type: object
      description: Key-value pairs for labeling resources
      additionalProperties:
        type: string
      examples:
        - environment: production
          team: backend
          project: api-service
    
    HealthStatus:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum:
            - healthy
            - unhealthy
          description: Overall health status
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the health check
        components:
          type: object
          description: Health status of individual components
          properties:
            database:
              type: boolean
            runners:
              type: boolean
            storage:
              type: boolean
    
    SystemConfig:
      type: object
      required:
        - version
        - defaultSnapshot
        - sshGatewayHost
        - sshGatewayPort
      properties:
        version:
          type: string
          description: Isola API version
          examples:
            - "1.0.0"
        defaultSnapshot:
          type: string
          description: Default snapshot for new sandboxes
          examples:
            - "ubuntu:22.04"
        sshGatewayHost:
          type: string
          description: SSH gateway hostname
          examples:
            - "ssh.isola.local"
        sshGatewayPort:
          type: integer
          description: SSH gateway port
          default: 22
        maxSandboxes:
          type: integer
          description: Maximum number of sandboxes allowed
          default: 100
        maxVolumes:
          type: integer
          description: Maximum number of volumes allowed
          default: 500
        regions:
          type: array
          description: Available deployment regions
          items:
            type: string
          examples:
            - ["us-east", "us-west", "eu-central"]
    
    # API Key Schemas
    ApiKey:
      type: object
      required:
        - name
        - createdAt
        - lastUsedAt
      properties:
        name:
          type: string
          description: Unique name of the API key
        description:
          type: string
          description: Description of the API key
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Last usage timestamp
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Expiration timestamp
        scopes:
          type: array
          description: Permission scopes
          items:
            type: string
            enum:
              - sandboxes:read
              - sandboxes:write
              - snapshots:read
              - snapshots:write
              - volumes:read
              - volumes:write
              - admin
    
    CreateApiKey:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Unique name for the API key
          pattern: '^[a-zA-Z0-9-_]+$'
          minLength: 3
          maxLength: 64
        description:
          type: string
          description: Description of the API key
          maxLength: 256
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Optional expiration date
        scopes:
          type: array
          description: Permission scopes
          items:
            type: string
            enum:
              - sandboxes:read
              - sandboxes:write
              - snapshots:read
              - snapshots:write
              - volumes:read
              - volumes:write
              - admin
          default:
            - sandboxes:read
            - sandboxes:write
            - snapshots:read
            - volumes:read
    
    ApiKeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required:
            - secret
          properties:
            secret:
              type: string
              description: The API key secret (only shown once)
              examples:
                - "isk_1234567890abcdef..."
    
    # Sandbox Schemas
    SandboxState:
      type: string
      enum:
        - creating
        - starting
        - started
        - stopping
        - stopped
        - destroying
        - destroyed
        - error
        - unknown
      description: Current state of the sandbox
    
    SandboxClass:
      type: string
      enum:
        - small
        - medium
        - large
        - xlarge
      description: Size class of the sandbox
      default: small
    
    Sandbox:
      type: object
      required:
        - id
        - name
        - state
        - class
        - region
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier
        name:
          type: string
          description: Human-readable name
        state:
          $ref: '#/components/schemas/SandboxState'
        desiredState:
          $ref: '#/components/schemas/SandboxState'
        class:
          $ref: '#/components/schemas/SandboxClass'
        region:
          type: string
          description: Deployment region
        snapshot:
          type: string
          description: Snapshot used to create this sandbox
        cpu:
          type: integer
          description: Number of CPU cores
          minimum: 1
          maximum: 32
        memory:
          type: integer
          description: Memory in GB
          minimum: 1
          maximum: 256
        disk:
          type: integer
          description: Disk size in GB
          minimum: 10
          maximum: 1000
        gpu:
          type: integer
          description: Number of GPUs
          minimum: 0
          maximum: 8
          default: 0
        env:
          type: object
          description: Environment variables
          additionalProperties:
            type: string
        labels:
          $ref: '#/components/schemas/Labels'
        volumes:
          type: array
          description: Attached volumes
          items:
            type: object
            required:
              - volumeId
              - mountPath
            properties:
              volumeId:
                type: string
                format: uuid
              mountPath:
                type: string
                examples:
                  - "/data"
                  - "/mnt/storage"
        ports:
          type: array
          description: Exposed ports
          items:
            type: object
            required:
              - port
              - protocol
            properties:
              port:
                type: integer
                minimum: 1
                maximum: 65535
              protocol:
                type: string
                enum:
                  - tcp
                  - udp
        runnerId:
          type: string
          format: uuid
          description: ID of the runner hosting this sandbox
        errorReason:
          type: string
          nullable: true
          description: Error message if state is 'error'
        ipAddress:
          type: string
          format: ipv4
          nullable: true
          description: Internal IP address
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
    
    CreateSandbox:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Unique name for the sandbox
          pattern: '^[a-zA-Z0-9-]+$'
          minLength: 3
          maxLength: 64
        snapshot:
          type: string
          description: Snapshot to use (defaults to system default)
        class:
          $ref: '#/components/schemas/SandboxClass'
        region:
          type: string
          description: Deployment region
          default: "default"
        cpu:
          type: integer
          description: Number of CPU cores (overrides class default)
          minimum: 1
          maximum: 32
        memory:
          type: integer
          description: Memory in GB (overrides class default)
          minimum: 1
          maximum: 256
        disk:
          type: integer
          description: Disk size in GB (overrides class default)
          minimum: 10
          maximum: 1000
        gpu:
          type: integer
          description: Number of GPUs
          minimum: 0
          maximum: 8
          default: 0
        env:
          type: object
          description: Environment variables
          additionalProperties:
            type: string
        labels:
          $ref: '#/components/schemas/Labels'
        volumes:
          type: array
          description: Volumes to attach
          items:
            type: object
            required:
              - volumeId
              - mountPath
            properties:
              volumeId:
                type: string
                format: uuid
              mountPath:
                type: string
                pattern: '^/[a-zA-Z0-9/_-]+$'
        autoStart:
          type: boolean
          description: Automatically start the sandbox after creation
          default: true
    
    SandboxList:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Sandbox'
        total:
          type: integer
          description: Total number of sandboxes
        limit:
          type: integer
          description: Maximum items returned
        offset:
          type: integer
          description: Number of items skipped
    
    SshAccess:
      type: object
      required:
        - host
        - port
        - username
        - command
      properties:
        host:
          type: string
          description: SSH host
        port:
          type: integer
          description: SSH port
        username:
          type: string
          description: SSH username
        command:
          type: string
          description: SSH connection command
          examples:
            - "ssh -p 2222 sandbox-abc123@ssh.isola.local"
        publicKey:
          type: string
          description: Public key for authentication
    
    # Snapshot Schemas
    SnapshotState:
      type: string
      enum:
        - pending
        - building
        - active
        - failed
        - deleting
      description: Current state of the snapshot
    
    Snapshot:
      type: object
      required:
        - id
        - name
        - state
        - imageName
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier
        name:
          type: string
          description: Unique name of the snapshot
        state:
          $ref: '#/components/schemas/SnapshotState'
        imageName:
          type: string
          description: Container image name
        general:
          type: boolean
          description: Whether this is a system-provided snapshot
          default: false
        size:
          type: number
          format: float
          nullable: true
          description: Size in GB
        cpu:
          type: integer
          description: Default CPU cores
          default: 1
        memory:
          type: integer
          description: Default memory in GB
          default: 1
        disk:
          type: integer
          description: Default disk size in GB
          default: 10
        gpu:
          type: integer
          description: Default GPU count
          default: 0
        entrypoint:
          type: array
          nullable: true
          items:
            type: string
          description: Container entrypoint command
        errorReason:
          type: string
          nullable: true
          description: Error message if state is 'failed'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
    
    CreateSnapshot:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Unique name for the snapshot
          pattern: '^[a-zA-Z0-9-]+$'
          minLength: 3
          maxLength: 64
        sandboxId:
          type: string
          format: uuid
          description: Create snapshot from existing sandbox
        dockerfile:
          type: string
          description: Dockerfile content for building the snapshot
        imageName:
          type: string
          description: Existing container image to use
        cpu:
          type: integer
          description: Default CPU cores
          minimum: 1
          maximum: 32
          default: 1
        memory:
          type: integer
          description: Default memory in GB
          minimum: 1
          maximum: 256
          default: 1
        disk:
          type: integer
          description: Default disk size in GB
          minimum: 10
          maximum: 1000
          default: 10
        gpu:
          type: integer
          description: Default GPU count
          minimum: 0
          maximum: 8
          default: 0
        entrypoint:
          type: array
          items:
            type: string
          description: Container entrypoint command
    
    SnapshotList:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'
        total:
          type: integer
          description: Total number of snapshots
        limit:
          type: integer
          description: Maximum items returned
        offset:
          type: integer
          description: Number of items skipped
    
    # Volume Schemas
    VolumeState:
      type: string
      enum:
        - creating
        - ready
        - attached
        - deleting
        - error
      description: Current state of the volume
    
    Volume:
      type: object
      required:
        - id
        - name
        - state
        - size
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier
        name:
          type: string
          description: Unique name of the volume
        state:
          $ref: '#/components/schemas/VolumeState'
        size:
          type: integer
          description: Size in GB
          minimum: 1
          maximum: 1000
        attachedTo:
          type: array
          description: Sandboxes this volume is attached to
          items:
            type: object
            required:
              - sandboxId
              - sandboxName
              - mountPath
            properties:
              sandboxId:
                type: string
                format: uuid
              sandboxName:
                type: string
              mountPath:
                type: string
        labels:
          $ref: '#/components/schemas/Labels'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    
    CreateVolume:
      type: object
      required:
        - name
        - size
      properties:
        name:
          type: string
          description: Unique name for the volume
          pattern: '^[a-zA-Z0-9-]+$'
          minLength: 3
          maxLength: 64
        size:
          type: integer
          description: Size in GB
          minimum: 1
          maximum: 1000
        labels:
          $ref: '#/components/schemas/Labels'
    
    VolumeList:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Volume'
        total:
          type: integer
          description: Total number of volumes
        limit:
          type: integer
          description: Maximum items returned
        offset:
          type: integer
          description: Number of items skipped
    
    # Runner Schemas
    RunnerState:
      type: string
      enum:
        - initializing
        - ready
        - busy
        - maintenance
        - error
        - offline
      description: Current state of the runner
    
    Runner:
      type: object
      required:
        - id
        - domain
        - state
        - region
        - class
        - capacity
        - usage
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier
        domain:
          type: string
          description: Runner domain name
        state:
          $ref: '#/components/schemas/RunnerState'
        region:
          type: string
          description: Runner region
        class:
          $ref: '#/components/schemas/SandboxClass'
        capacity:
          type: object
          description: Total capacity of the runner
          required:
            - cpu
            - memory
            - disk
            - gpu
          properties:
            cpu:
              type: integer
              description: Total CPU cores
            memory:
              type: integer
              description: Total memory in GB
            disk:
              type: integer
              description: Total disk in GB
            gpu:
              type: integer
              description: Total GPUs
        usage:
          type: object
          description: Current resource usage
          required:
            - cpu
            - memory
            - disk
            - gpu
            - sandboxCount
          properties:
            cpu:
              type: integer
              description: Used CPU cores
            memory:
              type: integer
              description: Used memory in GB
            disk:
              type: integer
              description: Used disk in GB
            gpu:
              type: integer
              description: Used GPUs
            sandboxCount:
              type: integer
              description: Number of sandboxes
        availabilityScore:
          type: number
          format: float
          description: Availability score (0-100)
          minimum: 0
          maximum: 100
        lastChecked:
          type: string
          format: date-time
          description: Last health check timestamp
        version:
          type: string
          description: Runner version
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
