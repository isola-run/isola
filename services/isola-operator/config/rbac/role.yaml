  - update
- apiGroups:
  - sandbox.isola.run
  resources:
  - rootfssnapshots
  - sandboxes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sandbox.isola.run
  resources:
  - sandboxtemplates
  verbs:
  - get
  - list
  - watch
