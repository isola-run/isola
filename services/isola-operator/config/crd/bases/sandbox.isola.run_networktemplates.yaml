metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: networktemplates.sandbox.isola.run
spec:
  group: sandbox.isola.run
  names:
    kind: NetworkTemplate
    listKind: NetworkTemplateList
    plural: networktemplates
    singular: networktemplate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: NetworkPolicy applied
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: Reason for Ready condition
      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NetworkTemplate defines network isolation rules that can be shared across multiple Sandboxes.
          When a Sandbox references a NetworkTemplate, a Kubernetes NetworkPolicy is created that selects
          pods with the label sandbox.isola.run/network-template={template-name}.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the network isolation rules
            properties:
              allowedEgress:
                description: |-
                  AllowedEgress is a list of CIDRs the sandbox is allowed to connect to (outbound traffic).
                  If empty, all egress traffic is blocked (default-deny) unless some other NetworkPolicy in the cluster allows traffic.
                  Risky IPs (cloud metadata 169.254.0.0/16, IPv6 link-local fe80::/10) are automatically
                  blocked when the specified CIDR would otherwise allow them.
                items:
                  pattern: ^((([0-9]{1,3}\.){3}[0-9]{1,3})/(3[0-2]|[12]?[0-9]))|(([0-9a-fA-F:]+)/([0-9]|[1-9][0-9]|1[01][0-9]|12[0-8]))$
                  type: string
                type: array
              allowedIngress:
                description: |-
                  AllowedIngress is a list of CIDRs allowed to connect to the sandbox (inbound traffic).
                  If empty, all ingress traffic is blocked (default-deny) unless some other NetworkPolicy in the cluster allows traffic.
                  todo benl: consider removing AllowedIngress
                items:
                  pattern: ^((([0-9]{1,3}\.){3}[0-9]{1,3})/(3[0-2]|[12]?[0-9]))|(([0-9a-fA-F:]+)/([0-9]|[1-9][0-9]|1[01][0-9]|12[0-8]))$
                  type: string
                type: array
              dnsServers:
                description: |-
                  DNSServers is a list of DNS server IP addresses the sandbox can use.
                  When specified, egress to these IPs on port 53 (UDP/TCP) is allowed,
                  and the pod is configured with dnsPolicy: None using these as nameservers.
                  If empty (or not specified), DNS is not available (sandbox is fully isolated from DNS).
                  MaxItems=3 because k8s allow specifying at most 3 nameservers https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/?utm_source=chatgpt.com#pod-dns-config
                items:
                  type: string
                maxItems: 3
                type: array
                x-kubernetes-validations:
                - message: dnsServers must be valid IPv4/IPv6 addresses
                  rule: self.size() == 0 || self.all(s, isIP(s))
            type: object
          status:
            description: status defines the observed state of NetworkTemplate
            properties:
              conditions:
                description: Conditions represent the current state of the NetworkTemplate.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
