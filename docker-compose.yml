version: '3.8'

services:
  controller:
    build:
      context: .
      dockerfile: services/isola_controller/Dockerfile
    container_name: isola-controller
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - isola-network

  agent:
    build:
      context: .
      dockerfile: services/isola_agent/Dockerfile
    container_name: isola-agent
    depends_on:
      - controller
    environment:
      - PYTHONUNBUFFERED=1
      - ISOLA_CONTROLLER_WS_URL=ws://controller:8765/ws
    networks:
      - isola-network

networks:
  isola-network:
    driver: bridge
