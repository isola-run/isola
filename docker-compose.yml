version: '3.8'

services:
  isola-controller:
    build:
      context: .
      dockerfile: services/isola_controller/Dockerfile
    container_name: isola-controller
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=info
    networks:
      - isola-network

  isola-agent:
    build:
      context: .
      dockerfile: services/isola_agent/Dockerfile
    container_name: isola-agent
    depends_on:
      - isola-controller
    environment:
      - PYTHONUNBUFFERED=1
      - ISOLA_CONTROLLER_WS_URL=ws://isola-controller:8765/ws
      - LOG_LEVEL=info
    networks:
      - isola-network

networks:
  isola-network:
    driver: bridge
