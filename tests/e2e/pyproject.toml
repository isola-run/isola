[project]
name = "isola-e2e-tests"
version = "0.1.0"
description = "End-to-end tests for the Isola sandbox platform"
requires-python = ">=3.10"
dependencies = [
    "isola-run",
    "prometheus-client>=0.20",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.8.0",
]

[tool.uv.sources]
isola-run = { path = "../../sdks/python", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
timeout = 120
markers = [
    "slow: tests with long waits (>30s); skipped by default, use --slow to include",
]
