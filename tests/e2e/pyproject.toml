# Internal end-to-end test harness. NEVER PUBLISHED to PyPI.
# Version is frozen at 0.0.0 and does not track the release version.
# hack/bump-version.sh does not touch this file.

[build-system]
# A minimal build-system is REQUIRED to avoid astral-sh/uv#9518 (without
# [build-system], uv's lockfile treats the project as fully virtual and
# can drop the editable `isola-run` path source). `[tool.uv] package = false`
# still keeps the e2e project itself from being built/installed.
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isola-e2e-tests"
version = "0.0.0"
description = "End-to-end tests for the Isola sandbox platform"
requires-python = ">=3.10"
# PyPI rejects uploads with any classifier starting with "Private ::" --
# server-side guarantee that this package can never accidentally publish.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "isola-run",
    "prometheus-client>=0.20",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
package = false

[tool.uv.sources]
isola-run = { path = "../../sdks/python", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
timeout = 120
markers = [
    "slow: tests with long waits (>30s); skipped by default, use --slow to include",
]
